@if (profile$ | async; as p) {
<notify-swipe-available
  title="Gesture disponibile"
  subtitle="Fai swipe da sinistra verso destra per passare al profilo aziendale"
></notify-swipe-available>
<div class="fixed bottom-5 right-5 z-[999]" *ngIf="isAgent(p)">
  <button class="floating-button" (click)="saveContact(p)">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
    >
      <path d="M0 0h24v24H0z" fill="none"></path>
      <path
        d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"
      ></path>
    </svg>
  </button>
</div>
<div
  class="h-full w-full bg-black relative overflow-x-hidden overflow-y-clip"
  notifyGestures
  (horizontalSwipe)="handleHorizontalSwipe($event)"
  (touchEnd)="handleTouchEnd()"
>
  <div
    class="smooth h-full w-full !ease-linear !duration-100"
    [ngStyle]="{
      transform: 'translate(0%, 0%) scale(' + profileScale + ')',
      filter: 'blur(' + (100 - profileScale * 100) + 'px)'
    }"
  >
    <notify-profile-view
      [data]="p"
      [publicUrl]="publicUrl"
      [feedbackKey]="feedbackKey"
      (companyAvatarClick)="forceShowCompanyProfile()"
    ></notify-profile-view>
  </div>
  <!--  -->
  <div
    *ngIf="p?.company"
    class="absolute top-0 left-0 smooth z-50 !ease-linear !duration-100"
    [ngStyle]="{ transform: 'translateX(' + companyProfileX + '%)' }"
  >
    <button
      class="fixed top-2 left-2 p-2 z-20 text-white btn btn-ghost hidden lg:flex"
      (click)="forceHideCompanyProfile()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-8 h-8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"
        />
      </svg>
      <span>Indietro</span>
    </button>
    <notify-profile-view
      [data]="p?.company"
      [publicUrl]="publicUrl"
    ></notify-profile-view>
  </div>
</div>
} @else {
<div class="h-[100vh]">
  <notify-loading></notify-loading>
</div>
}
