<div class="max-content-width h-lscreen relative">
  <div class="website-section lg:!justify-center">
    <div
      class="flex flex-col space-y-10 lg:space-y-20 items-center z-10 justify-center h-full lg:py-0"
    >
      <div class="flex flex-col space-y-2 h-[65%]">
        <video
          src="/assets/videos/splash_video.mp4"
          autoplay
          muted
          playsinline
          class="h-[35%] lg:h-[70%]"
        ></video>
        <h1 class="section-title fade-down">
          <p class="text-center whitespace-nowrap">
            Il biglietto da visita
            <br class="lg:hidden" />
            <span
              class="text-accent-color text-[5rem] lg:text-[6rem] font-caveat"
              >smart</span
            >
          </p>
          <p class="text-center leading-[3.5rem] lg:leading-[5rem]">
            per il tuo
            <br class="lg:hidden" />
            <span
              class="text-green-500 underline text-[3.5rem] lg:text-[4rem] font-bitter"
              >business.</span
            >
          </p>
        </h1>

        <div
          class="flex flex-col lg:mx-20 px-2 lg:px-10 space-y-5 lg:space-y-10"
        >
          <div class="splash-subtitle">
            <p class="fade-up-delayed">
              Notify è il SaaS che rivoluziona il modo in cui tu e il tuo team
              <br />
              costruite il vostro network.
            </p>
            <!-- <p class="fade-up-delayed">
            Notify è il primo biglietto da visita costruito con una mentalità
            team-first.
          </p> -->
          </div>
        </div>
      </div>

      <div class="flex flex-col space-y-4 w-full lg:w-96">
        <div class="animate-fade-up w-full">
          <button
            class="splash-cta smooth smooth-slower notify-shadow"
            (click)="goToShop()"
          >
            <div>Sfoglia le cards</div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m8.25 4.5 7.5 7.5-7.5 7.5"
              />
            </svg>
          </button>
          <div class="text-center text-sm lg:text-base opacity-75">
            <small>
              <a class="link animate-fade" (click)="openCalendlyPopup()"
                >Oppure, richiedi una demo gratuita</a
              >
            </small>
          </div>
        </div>
        <notify-funded-by
          class="animate-fade-right animate-delay-150 animate-ease-out"
        ></notify-funded-by>
      </div>
      <!-- 
      <div class="mouse smooth hidden lg:block" id="mouseGlpyh">
        <div class="scroll"></div>
      </div> -->
    </div>
  </div>
</div>
