<div class="max-content-width h-[55lvh] lg:h-[40lvh]">
  <div class="website-section !justify-center">
    <div class="flex flex-col space-y-4 items-center z-10">
      <h1 class="section-title fade-down">
        <p>Il <span class="text-secondary-500">networking</span>,</p>
        <p>
          non è mai stato così
          <span class="text-primary-500 brightness-110">semplice</span>.
        </p>
      </h1>

      <div class="flex flex-col lg:mx-20 px-2 lg:px-10 space-y-10">
        <div class="splash-subtitle fade-up-delayed">
          <p class="">
            Non preoccuparti più di ri-stampare biglietti da visita,
          </p>

          <p>adesso ci pensiamo noi.</p>
        </div>
        <div>
          <button
            class="splash-cta smooth smooth-slower notify-shadow mt-5 2xl:mt-10"
            (click)="goToShop()"
          >
            <div>Acquista ora</div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m8.25 4.5 7.5 7.5-7.5 7.5"
              />
            </svg>
          </button>
          <div class="text-center text-sm lg:text-base">
            <small>
              <a class="link opacity-75" (click)="openCalendlyPopup()"
                >Oppure, richiedi una demo</a
              >
            </small>
          </div>
        </div>
        <notify-funded-by></notify-funded-by>
      </div>
    </div>
  </div>
</div>
