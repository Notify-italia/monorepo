<div class="marquee">
  <ul class="marquee-content" #MarqueeContent>
    @for (item of partners; track $index) {
    <li [title]="item.title">
      <img
        loading="lazy"
        [src]="item.image"
        alt=""
        class=" {{ item.class }} size-24 lg:size-32 object-contain grayscale"
      />
    </li>
    }
  </ul>
</div>
