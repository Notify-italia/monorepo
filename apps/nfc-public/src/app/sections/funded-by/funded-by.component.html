<div class="max-content-width">
  <div class="website-section h-full">
    <h1 class="section-title">Credono in noi...</h1>
    <p class="section-subtitle">
      Queste organizzazioni ci hanno supportato nel nostro progetto e nella
      nostra vision di un mondo più sostenibile.
    </p>

    <div
      class="flex justify-between flex-col lg:flex-row space-y-10 lg:space-y-0 lg:space-x-10 my-20 w-full items-center"
    >
      @for (item of funds; track $index) {
      <a [href]="item.url" target="_blank">
        <img
          src="{{ item.logo }}"
          alt="{{ item.name }}"
          class="h-40 w-40 object-contain mask mask-squircle p-5 shadow bg-gray-100"
        />
      </a>
      }
    </div>
  </div>
</div>
