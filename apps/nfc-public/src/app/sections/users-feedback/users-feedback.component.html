<img
  src="/assets/images/grid-pattern.webp"
  class="object-none size-full absolute left-0 pointer-events-none mt-[10rem] lg:mt-auto"
/>
<div class="max-content-width">
  <div
    class="website-section w-full min-h-screen justify-end lg:justify-center lg:flex-col"
  >
    <div class="flex flex-col justify-center w-full items-center relative">
      <video
        class="size-full h-full rounded-xl shadow-lg"
        autoplay
        muted
        loop
        playsinline
        #ProofVideo
      >
        <source [src]="videoUrl" type="video/webm" />
      </video>

      <img
        src="/assets/users-feedback/outfitter.webp"
        class="drop-shadow intersect:animate-fade-down intersect-once absolute -bottom-10 -left-2 lg:bottom-auto lg:-left-10 lg:-top-10 w-11/12 md:w-8/12 lg:w-auto hover-around"
      />
      <img
        src="/assets/users-feedback/instagram.webp"
        class="drop-shadow intersect:animate-fade-down intersect-once absolute -top-2 -right-2 lg:top-auto lg:-bottom-10 lg:-right-16 rounded-lg shadow-lg w-11/12 lg:w-auto hover-around"
      />
      <img
        src="/assets/users-feedback/google.webp"
        class="drop-shadow intersect:animate-fade-down intersect-once absolute top-10 md:top-20 -left-2 lg:top-auto lg:-bottom-10 lg:-left-20 rounded-lg shadow-lg w-11/12 lg:w-auto hover-around"
      />
    </div>
  </div>
</div>
