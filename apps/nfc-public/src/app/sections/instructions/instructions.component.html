<div class="max-content-width">
  <div class="website-section w-full">
    <!-- <h1 class="section-title z-10"></h1> -->
    <div class="divider z-10"></div>
    <div
      class="flex flex-col lg:flex-row h-full justify-center space-y-2 lg:space-y-0 items-center lg:space-x-4 w-full"
    >
      @for (item of steps; track $index) {

      <div
        class="flex lg:flex-col justify-around space-x-5 lg:space-x-0 items-center h-44 lg:h-96 2xl:h-[30rem] w-full lg:w-auto z-10 p-4 rounded-lg aspect-square intersect-once intersect:animate-fade-left bg-secondary-accent-color hover:brightness-95 cursor-pointer"
        (click)="stepClicked.emit(item.anchor)"
      >
        <b
          class="font-ebGaramond text-center text-[14vh] w-20 text-accent-color intersect-once intersect:animate-fade-right animate-ease-out smooth smooth"
          [ngClass]="{
            'blink -z-1': $index % 2 === 1
          }"
        >
          {{ $index + 1 }}
        </b>

        <span
          class="animate-ease-out opacity-0 intersect-once intersect:opacity-100 smooth space-y-2 lg:h-full lg:space-y-4"
        >
          <h2
            class="font-extrabold lg:font-bold text-3xl lg:text-4xl font-outfit lg:text-center"
          >
            {{ item.title }}
          </h2>
          <div
            class="flex space-x-2 text-xs lg:text-base lg:text-center items-center"
            [innerHTML]="item.description"
          ></div>
        </span>
      </div>

      }
    </div>
    <div class="divider z-10"></div>
  </div>
</div>
