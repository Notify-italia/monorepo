<div class="max-content-width">
  <div class="website-section">
    <h1 class="section-title" id="profile-builder">
      1. scopri il nostro editor
    </h1>
    <p class="section-subtitle">
      Inserisci i tuoi dati in un profilo Notify causale <br />
      e visualizza in anteprima le potenzialità del nostro editor.
    </p>
    <div
      class="flex items-center relative px-5 justify-around w-full"
      [ngClass]="{
        'space-x-4': showProfile
      }"
    >
      <form
        [formGroup]="form"
        class="flex flex-col space-y-4 smooth smooth-slow max-w-[90vw] lg:translate-x-[24%] mt-10 w-full"
        (ngSubmit)="onSubmit()"
        [ngClass]="{
          'lg:!-translate-x-0 2xl:!-translate-x-10': showProfile
        }"
      >
        <!-- <p class="section-subtitle">
          Genera un profilo causale in pochi click, per vedere in anteprima le
          potenzialità del nostro editor.
          <br />
          <small>
            oppure, in alternativa,
            <a href="#instructions" class="link">prova Notify</a> gratuitamente
            e inizia subito a creare il profilo del tuo business.
          </small>
        </p> -->
        <notify-upload
          (fileChanged)="this.form.controls.image.setValue($any($event.blob))"
          acceptedFiles="image/webp,image/jpeg,image/png"
          class="h-48 mt-10"
          uploadLabel="Carica il tuo logo o una tua foto da usare come avatar "
        ></notify-upload>
        <div
          class="flex lg:flex-row flex-col space-y-4 lg:space-y-0 lg:space-x-2 w-full"
        >
          <notify-tailwind-input
            name="name"
            label="Nome"
            placeholder="Mario Rossi"
            [compact]="true"
            [parent]="form"
          ></notify-tailwind-input>
          <notify-tailwind-input
            name="phone"
            label="N. telefono"
            placeholder="333 1234567"
            [compact]="true"
            [parent]="form"
          ></notify-tailwind-input>
          <notify-tailwind-input
            name="email"
            label="email"
            type="email"
            placeholder="email@esempio.dominio"
            [compact]="true"
            [parent]="form"
          ></notify-tailwind-input>
        </div>
        <notify-tailwind-textarea
          [parent]="form"
          name="description"
          [compact]="true"
          [rows]="3"
          label="Parlaci di te"
          placeholder="Inserisci una breve descrizione di te stesso/a"
        ></notify-tailwind-textarea>

        <button class="randomizer-button smooth group/randomizer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="size-10 group-active/randomizer:rotate-180 smooth smooth-fast"
            viewBox="0 0 32 32"
          >
            <path
              fill="currentcolor"
              fill-rule="nonzero"
              stroke="none"
              stroke-width="1"
              d="M7.38 5.555l15.592-1.367A3.419 3.419 0 0126.673 7.3L28.05 23.06a3.422 3.422 0 01-3.106 3.71L9.352 28.137a3.419 3.419 0 01-3.702-3.113L4.275 9.265a3.422 3.422 0 013.106-3.71zm.2 2.274a1.14 1.14 0 00-1.036 1.237l1.375 15.759a1.14 1.14 0 001.234 1.038l15.591-1.368a1.14 1.14 0 001.036-1.236l-1.376-15.76a1.14 1.14 0 00-1.234-1.037L7.58 7.829zm3.254 5.39a1.69 1.69 0 01-1.825-1.545 1.692 1.692 0 011.53-1.84 1.69 1.69 0 011.825 1.546 1.692 1.692 0 01-1.53 1.839zm10.065-.883a1.69 1.69 0 01-1.826-1.545 1.692 1.692 0 011.53-1.84 1.69 1.69 0 011.825 1.546 1.692 1.692 0 01-1.53 1.84zM11.72 23.373a1.69 1.69 0 01-1.825-1.545 1.692 1.692 0 011.53-1.84 1.69 1.69 0 011.825 1.545 1.692 1.692 0 01-1.53 1.84zm10.065-.883a1.69 1.69 0 01-1.825-1.545 1.692 1.692 0 011.53-1.84 1.69 1.69 0 011.825 1.546 1.692 1.692 0 01-1.53 1.84zm-5.476-4.635a1.69 1.69 0 01-1.825-1.546 1.692 1.692 0 011.53-1.839 1.69 1.69 0 011.825 1.545 1.692 1.692 0 01-1.53 1.84zM29.183 6.823l-.015.002A.915.915 0 0128.167 6c-.265-2.544-2.523-4.39-5.045-4.121h-.007a.916.916 0 01-1.002-.824.922.922 0 01.808-1.018h.002l.007-.001a6.387 6.387 0 014.718 1.408 6.498 6.498 0 012.347 4.363.922.922 0 01-.812 1.016zM8.547 32h-.008a6.395 6.395 0 01-4.578-1.818 6.51 6.51 0 01-1.96-4.553.92.92 0 01.895-.942h.016c.503-.008.917.4.926.91.044 2.559 2.134 4.595 4.67 4.55h.006a.918.918 0 01.927.91.92.92 0 01-.894.943z"
            ></path>
          </svg>

          <span class="hidden lg:block">
            {{ showProfile ? 'Cambia stile' : 'Crea un profilo' }}
          </span>
          <span class="lg:hidden"> Mostra profilo </span>
        </button>
      </form>
      <notify-profile-view
        *ngIf="!this.utilsService.isMobile"
        [ngClass]="{
          'translate-y-10 opacity-100 pointer-events-auto ': showProfile
        }"
        class="iphone-15-pro pointer-events-none smooth opacity-0 mx-auto scale-90"
        [data]="currentTemplate"
        [mockup]="true"
        [isRunningOnPlayer]="true"
      ></notify-profile-view>
    </div>
  </div>
</div>
