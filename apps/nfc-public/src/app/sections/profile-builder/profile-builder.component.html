<div class="max-content-width">
  <div class="website-section">
    <h1 class="section-title">Canva, per biglietti da visita.</h1>
    <p class="section-subtitle">
      Abbiamo selezionato per te alcuni stili predefiniti per darti un'anteprima
      delle potenzialità del nostro editor.
      <br />
      Inserisci i tuoi dati e scegli uno stile per scoprire come potrebbe
      apparire il tuo profilo.
    </p>
    <div
      class="flex justify-between items-center relative px-5"
      [ngClass]="{
        'space-x-4': showProfile
      }"
    >
      <form
        [formGroup]="form"
        class="flex flex-col space-y-4 smooth smooth-slow max-w-[90vw] lg:translate-x-[25%] mt-10"
        (ngSubmit)="onSubmit()"
        [ngClass]="{
          'lg:!-translate-x-0 2xl:!-translate-x-10': showProfile
        }"
      >
        <notify-upload
          (fileChanged)="this.form.controls.image.setValue($any($event.blob))"
          acceptedFiles="image/*"
          class="h-48"
          uploadLabel="Carica il tuo logo o una tua foto da usare come avatar "
        ></notify-upload>
        <div class="flex space-x-2 w-full">
          <notify-tailwind-input
            name="name"
            label="Nome"
            placeholder="Mario Rossi"
            [compact]="true"
            [parent]="form"
          ></notify-tailwind-input>
          <notify-tailwind-input
            name="phone"
            label="N. telefono"
            placeholder="333 1234567"
            [compact]="true"
            [parent]="form"
          ></notify-tailwind-input>
          <notify-tailwind-input
            name="email"
            label="email"
            type="email"
            placeholder="email@esempio.dominio"
            [compact]="true"
            [parent]="form"
          ></notify-tailwind-input>
        </div>
        <notify-tailwind-textarea
          [parent]="form"
          name="description"
          [compact]="true"
          [rows]="3"
          label="Parlaci di te"
          placeholder="Inserisci una breve descrizione di te stesso/a"
        ></notify-tailwind-textarea>

        <div class="flex space-x-2 justify-around items-center lg:h-48">
          <button
            [disabled]="form.invalid"
            (click)="this.form.controls.type.setValue('chill')"
            class="style-button smooth bg-cover bg-bottom hover:bg-[url('https://s3-api.vps.notifyapp.it/notify-api/profiles/657f61da3e18748bb264a57e/background/Blu_Scuro_Anime_UI_Scuro_Privacy_Citazione__Frase_Sfondo_per_Cellulare_png.png?c=1717710125550')]"
          >
            GEEK
          </button>
          <button
            [disabled]="form.invalid"
            (click)="this.form.controls.type.setValue('corporate')"
            class="style-button smooth object-contain hover:bg-gradient-to-b from-gray-700 to-black"
          >
            CORPORATE
          </button>
          <button
            [disabled]="form.invalid"
            (click)="this.form.controls.type.setValue('grunge')"
            class="style-button smooth object-contain"
          >
            GRUNGE
          </button>
          <button
            [disabled]="form.invalid"
            (click)="this.form.controls.type.setValue('influencer')"
            class="style-button smooth object-contain"
          >
            SALES
          </button>
        </div>
      </form>
      <notify-profile-view
        [ngClass]="{
          'translate-y-10 lg:-translate-x-0 2xl:-translate-y-20 opacity-100 pointer-events-auto':
            showProfile
        }"
        class="iphone-15-pro absolute lg:static pointer-events-none smooth opacity-0 mx-auto scale-75 2xl:scale-90 mt-20"
        [data]="currentTemplate"
        [mockup]="true"
        [isRunningOnPlayer]="true"
      ></notify-profile-view>
    </div>
  </div>
</div>
