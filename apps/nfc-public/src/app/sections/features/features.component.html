<div class="max-content-width min-h-[100lvh] h-full">
  <div class="website-section relative w-full h-full">
    <!-- <div class="section-title">Dai un'occhiata a quello che ci rende unici</div>
    <div class="section-subtitle">
      Scopri alcune delle funzionalità che rendono Notify a misura delle tue
      esigenze e di quelle dei tuoi clienti.
    </div> -->

    <div
      #FeaturesContainer
      class="w-full flex justify-around mt-20 items-center mb-5 smooth space-x-16 lg:space-x-0"
      [ngStyle]="{
        translate: 'calc(' + selectedFeatureOffset + 'px )'
      }"
    >
      @for (item of features; track $index) {
      <button
        (click)="updateSelected(item.id)"
        class="mask mask-squircle size-16 shrink-0 items-center flex flex-col justify-center smooth hover:scale-110 saturate-0 {{
          item.color
        }}"
        [ngClass]="{
          'pointer-events-none scale-150 !saturate-100': item.id === selectedId
        }"
        id="feature-{{ item.id }}"
        [innerHTML]="item.icon"
      ></button>
      }
    </div>

    <div
      class="flex flex-col lg:space-y-10 w-full lg:max-w-[80vw] items-center relative"
    >
      <div class="space-y-2 mt-1 flex flex-col">
        <p
          class="text-center text-xl font-bold font-outfit"
          [innerHTML]="selectedFeature?.title"
        ></p>
        <small>
          <p class="text-center" [innerHTML]="selectedFeature?.description"></p>
        </small>
      </div>
      <div
        class="mockup-browser bg-gray-200 border border-gray-300 shrink w-full shadow-xl notify-shadow rounded-md hidden lg:block"
      >
        <div class="mockup-browser-toolbar">
          <div class="input !bg-gray-300"></div>
        </div>
        <div class="bg-gray-100">
          <img
            [src]="selectedFeature?.desktopImage"
            alt="Notify Features"
            class="w-full"
          />
        </div>
      </div>

      <div class="flex justify-center items-center -m-10 lg:m-0">
        <div
          *ngIf="selectedFeature?.phoneImage as phoneImage"
          class="mockup-phone iphone-15-pro scale-75 lg:scale-50 2xl:scale-75 shadow-lg lg:absolute -right-32 lg:-bottom-48 2xl:-bottom-24"
        >
          <notify-mockup-fill></notify-mockup-fill>
          <div class="display">
            <img [src]="phoneImage" alt="Notify Features" class="size-full" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
