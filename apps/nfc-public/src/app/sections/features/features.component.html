<div class="max-content-width min-h-[100lvh]">
  <div class="website-section relative">
    <div class="section-title">Dai un'occhiata a quello che ci rende unici</div>
    <div class="section-subtitle">
      Scopri alcune delle funzionalità che rendono Notify a misura delle tue
      esigenze e di quelle dei tuoi clienti.
    </div>

    <div
      class="w-full flex justify-center 2xl:max-w-[60vw] mt-20 items-center space-x-20 pb-5"
    >
      @for (item of features; track $index) {
      <button
        (click)="selectedId = item.id"
        class="mask mask-squircle size-16 shrink-0 items-center flex flex-col justify-center smooth hover:-translate-y-2 {{
          item.color
        }}"
        [ngClass]="{
          'pointer-events-none scale-125': item.id === selectedId
        }"
        [innerHTML]="item.icon"
      ></button>
      }
    </div>

    <div class="flex flex-col space-y-4">
      <p
        class="text-center text-xl font-bold font-outfit"
        [innerHTML]="selectedFeature?.title"
      ></p>
      <small>
        <p class="text-center" [innerHTML]="selectedFeature?.description"></p>
      </small>
      <div
        class="mockup-browser bg-gray-200 shrink w-full shadow-xl rounded-md"
      >
        <div class="mockup-browser-toolbar">
          <div class="input !bg-gray-300"></div>
        </div>
        <div class="bg-gray-100">
          <img
            [src]="selectedFeature?.desktopImage"
            alt="Notify Features"
            class="w-full"
          />
        </div>
      </div>

      <div
        class="mockup-phone iphone-15-pro scale-75 absolute -right-32 2xl:-right-40 -bottom-32 2xl:-bottom-24 shadow-xl"
      >
        <notify-mockup-fill></notify-mockup-fill>
        <div class="display">
          <img
            [src]="selectedFeature?.phoneImage"
            alt="Notify Features"
            class="size-full"
          />
        </div>
      </div>
    </div>
  </div>
</div>
