<div class="max-content-width">
  <div class="website-section">
    <div class="section-title">Dai un'occhiata a quello che ci rende unici</div>
    <div class="section-subtitle">
      Scopri alcune delle funzionalità che rendono Notify a misura delle tue
      esigenze e di quelle dei tuoi clienti.
    </div>

    <div
      class="w-full flex flex-col justify-between 2xl:max-w-[60vw] mt-20 items-center space-y-20 pb-5"
    >
      @for (item of buildFeatures; track $index) {
      <div
        class="cards-container !space-y-10 lg:!space-y-0 lg:space-x-5 !justify-between lg:!flex-row w-"
      >
        <ng-container
          [ngTemplateOutlet]="Card"
          [ngTemplateOutletContext]="{item, half: 'first'}"
        ></ng-container>
      </div>
      }
    </div>
  </div>

  <ng-template let-item="item" let-half="half" #Card>
    <button
      class="group/card flex flex-col h-full pointer-events-none w-full smooth opacity-0 intersect:opacity-100"
      [ngClass]="{
        'intersect:animate-fade-right animate-ease-out': half === 'first',
        'intersect:animate-fade-left animate-ease-out': half === 'second',
    }"
      tabindex="0"
    >
      <div
        class="flex flex-col justify-around w-full"
        [ngClass]="{ 'items-end': half === 'second' }"
      >
        <div class="flex space-x-2 items-center">
          <div
            class="mask mask-squircle h-12 w-12 shrink-0 items-center flex flex-col justify-center {{
              item.color
            }}"
            [innerHTML]="item.icon"
          ></div>
          <span
            [innerHTML]="item.title"
            class="p-2 !pl-0 items-center w-full font-bold text-xl drop-shadow-lg my-auto text-start"
            [ngClass]="{ '!text-end': half === 'second' }"
          ></span>
        </div>
      </div>

      <span
        [innerHTML]="item.description"
        class="px-2 pl-0 text-current/80 overflow-hidden opacity-100 max-h-96 smooth text-justify drop-shadow-md font-light leading-relaxed mt-5"
        [ngClass]="{ 'text-end': half === 'second' }"
      ></span>
    </button>
  </ng-template>
</div>
