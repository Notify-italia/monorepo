<div class="max-content-width">
  <div class="website-section">
    <div
      #FeaturesContainer
      class="w-[50rem] lg:!w-[100rem] flex justify-between items-center mb-5 smooth whitespace-nowrap space-x-16 lg:space-x-0"
    >
      @for (item of features; track $index) {
      <button
        (click)="updateSelected(item.id); carouselTouched$.next()"
        class="mask mask-squircle size-16 shrink-0 items-center flex flex-col justify-center smooth hover:scale-110 saturate-0 bg-gray-200/50 text-gray-400"
        [ngClass]="
          item.id === selectedId ? 'scale-150 !saturate-100 ' + item.color : ''
        "
        id="feature-{{ item.id }}"
        [innerHTML]="item.icon"
      ></button>
      }
    </div>

    <div
      class="flex flex-col lg:space-y-10 max-w-[95vw] items-center relative"
      *ngIf="selectedFeature as f"
    >
      <div
        class="space-y-2 mt-1 flex flex-col min-w-full text-wrap absolute lg:static"
      >
        <p
          class="text-center text-xl font-bold font-outfit"
          [innerHTML]="f.title"
        ></p>
        <small class="text-center mt-3 lg:mt-2"
          ><p [innerHTML]="f.description"></p>
        </small>
      </div>
      <div class="flex">
        <div
          class="mockup-browser bg-gray-300/50 border border-gray-300/40 shrink w-full shadow-xl notify-shadow rounded-md hidden lg:block static"
        >
          <div class="mockup-browser-toolbar">
            <div class="input !bg-gray-200/50"></div>
          </div>
          <div class="bg-gray-100" #FeatureImgContainer>
            <img
              [ngSrc]="f.desktopImage"
              alt="Notify Features"
              loading="eager"
              class="w-full h-[50%]"
              width="{{ 4112 }}"
              height="{{ 2150 }}"
            />
          </div>
        </div>
      </div>
      <div class="flex justify-center items-center -m-10 mt-10 lg:m-0">
        <div
          *ngIf="f.phoneImage as phoneImage"
          class="mockup-phone iphone-15-pro scale-[0.65] lg:scale-50 2xl:scale-75 shadow-lg lg:absolute lg:mt-0 -right-32 lg:-bottom-48 2xl:-bottom-24"
        >
          <notify-mockup-fill></notify-mockup-fill>
          <div class="display">
            <img [src]="phoneImage" alt="Notify Features" class="size-full" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
