<div class="max-content-width">
  <div class="min-h-[80vh] w-full">
    <div class="website-section">
      <h1 class="section-title z-10">{{ title }}</h1>
      <p class="section-subtitle z-10">
        Compila il form sottostante e beviamoci un caffè per scoprire insieme
        come portare il tuo business nello spazio!
      </p>

      <div
        class="flex flex-col lg:flex-row justify-around w-full items-center overflow-visible h-[70vh]"
      >
        <form
          [formGroup]="form"
          (submit)="submit()"
          class="flex flex-col space-y-5 w-full lg:w-8/12 justify-end p-4 px-5 rounded-xl z-10"
        >
          <notify-tailwind-input
            [parent]="form"
            label="Nome e Cognome"
            name="name"
            placeholder="Inserisci il tuo nome e cognome"
          ></notify-tailwind-input>

          <notify-tailwind-input
            [parent]="form"
            label="Email"
            name="email"
            placeholder="Inserisci la tua email"
          ></notify-tailwind-input>

          <div class="flex flex-col space-y-1">
            <label for="message" class="text-sm font-medium"
              >Parlaci di te</label
            >
            <textarea
              formControlName="message"
              cols="30"
              rows="3"
              class="textarea textarea-bordered input-style backdrop-blur"
              placeholder="Descrivi il tuo business e le tue esigenze..."
            ></textarea>
          </div>

          <div
            *ngIf="extraData as item"
            class="rounded-lg input-style backdrop-blur p-4 flex space-x-2 items-center"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="w-8 h-8"
            >
              <path
                fill-rule="evenodd"
                d="M9 1.5H5.625c-1.036 0-1.875.84-1.875 1.875v17.25c0 1.035.84 1.875 1.875 1.875h12.75c1.035 0 1.875-.84 1.875-1.875V12.75A3.75 3.75 0 0 0 16.5 9h-1.875a1.875 1.875 0 0 1-1.875-1.875V5.25A3.75 3.75 0 0 0 9 1.5Zm6.61 10.936a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 14.47a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
                clip-rule="evenodd"
              />
              <path
                d="M12.971 1.816A5.23 5.23 0 0 1 14.25 5.25v1.875c0 .207.168.375.375.375H16.5a5.23 5.23 0 0 1 3.434 1.279 9.768 9.768 0 0 0-6.963-6.963Z"
              />
            </svg>
            <span class="font-medium">{{ item?.title }}</span>
          </div>

          <div class="flex justify-end w-full">
            <button
              class="btn btn-primary"
              data-theme="notifytheme"
              [disabled]="form.invalid"
            >
              <span>Contattaci</span>
            </button>
          </div>
        </form>

        <img
          src="/assets/images/space-rocket.gif"
          class="w-full h-full pointer-events-none lg:scale-75 absolute object-cover"
        />

        <!-- <notify-spline-viewer
        class="w-full h-full pointer-events-none scale-75 lg:scale-100 absolute object-cover"
        sceneId="dk861HTC3-7031NY"
      ></notify-spline-viewer> -->
      </div>
    </div>
  </div>
</div>
