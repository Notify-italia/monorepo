<div class="m-10">
  <div class="section">
    <h1 class="section-title">Ti abbiamo convinto?</h1>
    <p class="section-subtitle">
      Compila il form sottostante e beviamoci una Coca-Cola insieme per scoprire
      insieme come portare il tuo business al prossimo livello!
    </p>
  </div>
  <div
    class="flex flex-col lg:flex-row justify-center space-x-20 w-full h-full my-5 items-center"
  >
    <form
      [formGroup]="form"
      (submit)="submit()"
      class="flex flex-col space-y-5 w-full lg:w-4/12 justify-end !h-full bg-base-100/80 p-4 px-5 rounded-xl"
    >
      <notify-tailwind-input
        [parent]="form"
        label="Nome e Cognome"
        name="name"
        placeholder="Inserisci il tuo nome e cognome"
      ></notify-tailwind-input>

      <notify-tailwind-input
        [parent]="form"
        label="Email"
        name="email"
        placeholder="Inserisci la tua email"
      ></notify-tailwind-input>

      <div class="flex flex-col">
        <label for="message" class="text-sm">Parlaci di te</label>
        <textarea
          formControlName="message"
          cols="30"
          rows="3"
          class="textarea !outline outline-1 !outline-gray-300/20"
          placeholder="Descrivi il tuo business e le tue esigenze..."
        ></textarea>
      </div>

      <div class="flex justify-end w-full">
        <button
          class="btn btn-primary"
          data-theme="notifytheme"
          [disabled]="form.invalid"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6 h-6"

          <span>Invia</span>
