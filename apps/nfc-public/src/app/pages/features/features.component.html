<div class="max-content-width">
  <div class="w-full flex flex-col justify-between items-center">
    <div class="website-section !h-fit">
      <div class="section-title">
        Dai un'occhiata a quello che ci rende unici
      </div>
      <div class="section-subtitle">
        Scopri alcune delle funzionalità che rendono Notify a misura delle tue
        esigenze e di quelle dei tuoi clienti.
      </div>
    </div>
    <div
      class="w-full flex flex-col lg:flex-row justify-between 2xl:max-w-[60vw] mt-20 items-center lg:items-start space-y-10 lg:space-y-0"
    >
      <div class="cards-container space-y-10 !justify-between">
        @for (item of featuresSplit.first; track $index) {
        <ng-container
          [ngTemplateOutlet]="Card"
          [ngTemplateOutletContext]="{item, half: 'first'}"
        ></ng-container>
        }
      </div>
      <div class="cards-container space-y-10 !justify-between">
        @for (item of featuresSplit.second; track $index) {
        <ng-container
          [ngTemplateOutlet]="Card"
          [ngTemplateOutletContext]="{item, half: 'second'}"
        ></ng-container>
        }
      </div>
    </div>
  </div>
</div>

<ng-template let-item="item" let-half="half" #Card>
  <button
    class="group/card flex flex-col h-full pointer-events-none"
    [ngClass]="{
        'intersect:animate-fade-right animate-ease-out': half === 'first',
        'intersect:animate-fade-left animate-ease-out': half === 'second',
    }"
    tabindex="0"
  >
    <div class="flex flex-col justify-around space-y-2">
      <div
        class="mask mask-squircle h-12 w-12 shrink-0 items-center flex flex-col justify-center {{
          item.color
        }}"
      >
        <notify-svg-box-icon [icon]="item.icon"></notify-svg-box-icon>
      </div>
      <span
        [innerHTML]="item.title"
        class="p-2 items-center w-full font-bold text-white text-xl drop-shadow-lg my-auto text-start"
      ></span>
    </div>

    <span
      [innerHTML]="item.description"
      class="px-2 text-gray-300/80 overflow-hidden opacity-100 max-h-96 smooth text-justify drop-shadow-md font-light leading-relaxed"
    ></span>
  </button>
</ng-template>
