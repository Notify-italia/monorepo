@if (!(pageStable$ | async)) {
<div class="fixed w-screen h-screen top-0 left-0 z-[999] bg-gray-700">
  <notify-loading></notify-loading>
</div>
}

<div
  class="w-full min-h-screen flex justify-center overflow-hidden scroll-smooth font-anek bg-slate-50"
>
  <div class="h-full w-full flex flex-col">
    <notify-top-nav></notify-top-nav>

    <div class="divider mx-5"></div>

    <notify-splash
      id="splash"
      (componentStable)="splashSable$.next()"
    ></notify-splash>

    <notify-features id="features"></notify-features>

    <notify-instructions
      (componentStable)="instructionsStable$.next()"
    ></notify-instructions>

    <div class="divider mx-5"></div>

    <notify-partners id="partners"></notify-partners>

    <div class="divider mx-5"></div>

    <notify-contact-us id="contactus"></notify-contact-us>

    <notify-footer></notify-footer>
  </div>
</div>
