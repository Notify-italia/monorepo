<img
  src="/assets/images/noise.svg"
  class="w-[100vw] h-[120vh] lg:h-screen fixed top-0 left-0 object-cover pointer-events-none opacity-50"
  alt=""
/>

<div class="flex justify-center font-poppins overflow-hidden z-20">
  <div
    class="fixed w-full h-lscreen top-0 left-0 z-[999] bg-white smooth"
    [ngClass]="{
      'opacity-0 pointer-events-none':  pageStable$  | async,
    }"
  >
    <notify-loading></notify-loading>
  </div>

  <div
    id="bubbleOutline"
    class="fixed size-[100vh] lg:size-[170lvh] p-2 rounded-full shrink-0 bg-gray-300/30 -top-[0vh] lg:-top-[35vh] smooth"
  ></div>

  <div class="fixed z-50 top-0 left-0 w-full">
    <notify-top-nav (CartClicked)="showCart()"></notify-top-nav>
  </div>

  <div
    class="fixed flex flex-col justify-center items-center size-[90vh] lg:size-[150lvh] p-2 rounded-full shadow-xl shrink-0 bg-white overflow-x-hidden overflow-y-visible smooth top-[5vh] lg:-top-[25vh]"
    id="bubble"
  ></div>

  <div
    #CircleContainer
    class="flex flex-col items-stretch lg:items-center max-w-[100vw] text-slate-800 main-circle scroll-smooth scrollbar-none bg-cover bg-center bg-no-repeat bg-fixed bg-[url('/assets/images/background.webp')]"
  >
    <notify-splash
      id="splash"
      (componentInit)="publishAnchor('splash')"
    ></notify-splash>

    <!-- <notify-spline-viewer
      sceneId="wMo34mvja3Q3wyyS"
      (ready)="splineReady$.next()"
      class="left-0 w-screen h-[90lvh] lg:h-lscreen z-0 pointer-events-none ignore-height -mt-[30vh] lg:-mt-[34vh]"
    ></notify-spline-viewer> -->

    <notify-profile-builder
      id="builder"
      (componentInit)="publishAnchor('builder')"
      class="mt-20"
    ></notify-profile-builder>

    <notify-trusted-by
      id="trustedby"
      (componentInit)="publishAnchor('trustedby')"
      class="z-0 ignore-height my-5 mt-20 lg:mt-5 ignore-padding"
    ></notify-trusted-by>

    <notify-features
      id="features"
      (componentStable)="featuresStable$.next()"
      class="z-10"
      (componentInit)="publishAnchor('features')"
    ></notify-features>

    <notify-instructions
      id="instructions"
      class="mt-20 ignore-height min-h-[90lvh] lg:min-h-[90lvh] 2xl:min-h-[60lvh]"
      (componentInit)="publishAnchor('instructions')"
      (componentStable)="instructionsStable$.next()"
    ></notify-instructions>

    <notify-shop
      class="mt-20 ignore-padding"
      id="cards-shop"
      (componentInit)="publishAnchor('shop')"
      (handleItemClicked)="showItemDetail($event)"
    ></notify-shop>

    <div class="divider ignore-height"></div>

    <notify-questions
      class="ignore-height mt-20"
      id="questions"
      (componentInit)="publishAnchor('questions', {
          ignoreBlur: true,
        })"
    ></notify-questions>
    <notify-footer
      class="z-10 mt-20 ignore-height ignore-padding !w-screen -mb-5 lg:-mb-2"
    ></notify-footer>
  </div>
</div>
