<div class="flex justify-center font-poppins">
  <div
    class="fixed w-full h-lscreen top-0 left-0 z-[999] bg-slate-50 smooth"
    [ngClass]="{
      'opacity-0 pointer-events-none': pageStable$ | async,
    }"
  >
    <notify-loading></notify-loading>
  </div>
  <!-- <notify-cursor></notify-cursor> -->

  <div
    class="h-full w-full flex flex-col overflow-hidden text-slate-900 bg-slate-50"
  >
    <!-- SPLASH E TOP NAV -->
    <div class="w-full h-full flex flex-col relative">
      <notify-top-nav class="p-5"></notify-top-nav>

      <notify-splash id="splash" class="p-5"></notify-splash>

      <notify-features
        id="features"
        (componentStable)="featuresStable$.next()"
        class="p-5 pb-10 mt-10 z-10"
      ></notify-features>

      <notify-trusted-by id="trustedby" class="-mt-10 z-0"></notify-trusted-by>

      <notify-instructions
        id="instructions"
        class="p-5 -mt-20"
      ></notify-instructions>

      <notify-shop class="mt-20 p-5" id="shop"></notify-shop>

      <div class="divider p-5"></div>

      <notify-questions class="p-5" id="questions"></notify-questions>

      <notify-footer class="z-10 mt-20"></notify-footer>
    </div>
  </div>
</div>
