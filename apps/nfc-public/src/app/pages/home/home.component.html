<img
  src="/assets/images/background.svg"
  class="w-[100vw] h-lscreen fixed top-0 left-0 object-cover z-0"
  alt=""
/>

<img
  src="/assets/images/noise.svg"
  class="w-[100vw] h-lscreen fixed top-0 left-0 object-cover pointer-events-none opacity-50"
  alt=""
/>

<div class="flex justify-center font-poppins bg-slate-50 overflow-hidden z-20">
  <div
    class="fixed w-full h-lscreen top-0 left-0 z-[999] bg-slate-50 smooth"
    [ngClass]="{
      'opacity-0 pointer-events-none':  pageStable$  | async,
    }"
  >
    <notify-loading></notify-loading>
  </div>

  <div
    id="bubbleOutline"
    class="fixed size-[120vh] lg:size-[170lvh] p-2 rounded-full shrink-0 bg-gray-300/50 -top-[10vh] lg:-top-[35vh] smooth"
  ></div>
  <notify-top-nav class="p-5 w-full fixed z-10"></notify-top-nav>

  <div
    class="fixed flex flex-col justify-center items-center size-[100vh] lg:size-[150lvh] p-2 rounded-full shadow-xl shrink-0 bg-white/40 overflow-x-hidden overflow-y-visible smooth glassmorph -top-0 lg:-top-[25vh]"
    id="bubble"
  ></div>

  <div
    #CircleContainer
    class="flex flex-col items-center w-screen p-2 text-slate-800 main-circle scroll-smooth scrollbar-none"
  >
    <notify-splash
      id="splash"
      (componentInit)="publishAnchor('splash')"
    ></notify-splash>

    <notify-features
      id="features"
      (componentStable)="featuresStable$.next()"
      class="z-10 mt-10"
      (componentInit)="publishAnchor('features')"
    ></notify-features>

    <notify-instructions
      id="instructions"
      (componentInit)="publishAnchor('instructions')"
      (componentStable)="instructionsStable$.next()"
    ></notify-instructions>

    <notify-trusted-by
      id="trustedby"
      (componentInit)="publishAnchor('trustedby')"
      class="z-0 mt-20 ignore-height"
    ></notify-trusted-by>

    <notify-shop
      class="mt-20 p-5"
      id="shop"
      (componentInit)="publishAnchor('shop')"
    ></notify-shop>

    <notify-questions
      class="p-5 ignore-height"
      id="questions"
      (componentInit)="publishAnchor('questions', {
          ignoreBlur: true,
        })"
    ></notify-questions>

    <notify-footer class="z-10 mt-20 w-full ignore-height"></notify-footer>
  </div>
</div>
