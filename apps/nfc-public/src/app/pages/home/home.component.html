<div class="flex justify-center scroll-smooth font-poppins">
  <div
    class="fixed w-full h-full top-0 left-0 z-[999] bg-black smooth"
    [ngClass]="{
      'opacity-0 pointer-events-none': pageStable$ | async,
    }"
  >
    <notify-loading></notify-loading>
  </div>
  <!-- <notify-cursor></notify-cursor> -->

  <div
    class="h-full w-full flex flex-col overflow-hidden scroll-smooth text-slate-900 bg-slate-50"
  >
    <!-- SPLASH E TOP NAV -->
    <div class="w-full h-full flex flex-col relative">
      <notify-top-nav class="p-5"></notify-top-nav>

      <notify-splash id="splash" class="p-5"></notify-splash>

      <notify-features
        (componentStable)="featuresStable$.next()"
        class="p-5 pb-10 mt-10"
      ></notify-features>

      <notify-trusted-by></notify-trusted-by>

      <notify-instructions class="p-5 -mt-20"></notify-instructions>

      <notify-shop class="mt-20 p-5"></notify-shop>

      <div class="divider p-5"></div>

      <notify-questions></notify-questions>

      <!-- <notify-profile-builder></notify-profile-builder>

      <div class="divider"></div>
      <notify-features
        id="features"
        (componentStable)="featuresStable$.next()"
      ></notify-features>
    </div>

    <div class="divider"></div>

    <notify-partners id="partners"></notify-partners>

    <div class="divider"></div>

    <notify-questions></notify-questions>

    <notify-contact-us id="contactus" class="mt-20"></notify-contact-us> -->

    </div>
  </div>
</div>
