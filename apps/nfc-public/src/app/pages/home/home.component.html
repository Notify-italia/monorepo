@if (!(pageStable$ | async)) {
<div class="fixed w-screen h-screen top-0 left-0 z-[999] bg-gray-700">
  <notify-loading></notify-loading>
</div>
}

<div
  class="w-full min-h-screen flex justify-center overflow-hidden scroll-smooth font-mulish bg-gradient-to-b from-[#704ca5] to-[#23074d] text-slate-200"
>
  <div class="h-full w-full flex flex-col max-w-[1920px] overflow-visible">
    <notify-top-nav></notify-top-nav>

    <div class="divider"></div>

    <notify-splash
      id="splash"
      (componentStable)="splashSable$.next()"
    ></notify-splash>

    <div class="divider"></div>

    <notify-features id="features"></notify-features>

    <notify-sustainability
      (componentStable)="sustainabilityStable$.next()"
    ></notify-sustainability>

    <div class="divider"></div>

    <notify-partners id="partners"></notify-partners>

    <div class="divider"></div>

    <notify-instructions
      (componentStable)="instructionsStable$.next()"
    ></notify-instructions>

    <div class="divider"></div>

    <notify-questions></notify-questions>

    <notify-contact-us id="contactus" class="mt-20"></notify-contact-us>
  </div>
</div>
<notify-footer class="z-10"></notify-footer>
