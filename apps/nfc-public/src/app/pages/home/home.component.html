<div class="flex justify-center scroll-smooth font-poppins">
  <div
    class="fixed w-full h-full top-0 left-0 z-[999] bg-black smooth"
    [ngClass]="{
      'opacity-0 pointer-events-none': pageStable$ | async
    }"
  >
    <notify-loading></notify-loading>
  </div>
  <!-- <notify-cursor></notify-cursor> -->

  <div
    class="h-full w-full flex flex-col overflow-hidden scroll-smooth text-slate-900 bg-slate-50"
  >
    <!-- SPLASH E TOP NAV -->
    <div class="w-full h-full flex flex-col relative p-5 space-y-14">
      <notify-top-nav></notify-top-nav>

      <notify-splash
        id="splash"
        (componentStable)="splashStable$.next()"
      ></notify-splash>

      <notify-features></notify-features>

      <div class="divider" id="shop"></div>

      <notify-shop></notify-shop>

      <div class="divider"></div>

      <notify-questions></notify-questions>
    </div>

      <notify-features

        (componentStable)="featuresStable$.next()"
      ></notify-features>
    </div>

    <div class="divider"></div>

    <notify-partners id="partners"></notify-partners>

    <div class="divider"></div>

    <notify-questions></notify-questions>

    <notify-contact-us id="contactus" class="mt-20"></notify-contact-us> -->

  </div>
</div>
