<div
  class="flex flex-col lg:justify-center min-h-[100vh] w-full overflow-hidden"
>
  <div
    class="flex flex-col justify-start lg:flex-row lg:justify-around w-full flex-nowrap items-center lg:px-5"
  >
    <div class="scale-90 lg:scale-100">
      <h1 class="text-2xl lg:text-[56px] font-bold text-center">
        Regala un effetto
        <div class="neonText">WOW!</div>
        ai tuoi clienti.
      </h1>

      <h2 class="text-center text-gray-300 lg:text-xl mt-1">
        Modernizza il tuo Networking
      </h2>
    </div>

    @if (demoProfile$ | async;as demoProfile) {
    <notify-profile-view
      *SSR
      [mockup]="true"
      class="iphone-15-pro scale-[80%] lg:scale-[70%] 2xl:scale-100"
      [data]="demoProfile"
      (componentReady)="componentStable.emit(); isProfileReady = true"
    ></notify-profile-view>
    }
  </div>
</div>
