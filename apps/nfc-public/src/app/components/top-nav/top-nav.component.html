<div class="topnav-menu h-16 lg:h-20 lg:px-5">
  <a routerLink="/" class="h-full p-4">
    <img
      src="https://s3-api.vps.notifyapp.it/assets/Primary%20Logo.png"
      alt=""
      class="h-full w-3/12 lg:size-full object-contain"
    />
  </a>
  <div>
    @if (ecommerce.cart.items.length; as items) {
    <button
      class="relative text-[#033669] smooth smooth-faster active:scale-95"
    >
      <div
        class="absolute size-6 bg-white rounded-full p-2 -top-2 -right-2 z-10 flex justify-center items-center font-medium font-outfit"
      >
        {{ items }}
      </div>
      <svg
        class="size-10"
        fill="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M21.312 7.94a1.49 1.49 0 0 0-1.062-.44h-3v-.75a5.25 5.25 0 1 0-10.5 0v.75h-3A1.5 1.5 0 0 0 2.25 9v10.125c0 1.828 1.547 3.375 3.375 3.375h12.75c.884 0 1.734-.346 2.366-.963a3.256 3.256 0 0 0 1.009-2.353V9a1.489 1.489 0 0 0-.438-1.06ZM8.25 6.75a3.75 3.75 0 0 1 7.5 0v.75h-7.5v-.75Z"
        ></path>
      </svg>
    </button>
    } @else {

    <svg
      class="size-10 text-gray-500"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="1"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M3.75 8.25A.75.75 0 0 0 3 9v10.125c0 1.418 1.207 2.625 2.625 2.625h12.75c1.418 0 2.625-1.149 2.625-2.566V9a.75.75 0 0 0-.75-.75H3.75Z"
        clip-rule="evenodd"
      ></path>
      <path
        d="M7.5 8.25v-1.5a4.5 4.5 0 0 1 4.5-4.5v0a4.5 4.5 0 0 1 4.5 4.5v1.5"
      ></path>
    </svg>

    }
  </div>
</div>
<div class="backdrop z-0"></div>
