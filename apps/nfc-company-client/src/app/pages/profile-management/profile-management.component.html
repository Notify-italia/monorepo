<div class="page-layout">
  <notify-page-header
    [title]="
      providedProfile ? 'Modifica Profilo Utente' : 'Gestione Profilo Aziendale'
    "
    [subtitle]="
      providedProfile
        ? 'Modifica e condividi il profilo di un tuo utente'
        : 'Modifica e condividi il tuo profilo aziendale'
    "
  ></notify-page-header>

  @if (profile$ | async; as profile) {
  <div>
    <div>
      <!-- BACK TO LIST -->
      <button
        *ngIf="providedProfile"
        [disabled]="loading"
        type="button"
        class="btn w-28 lg:w-44 lg:space-x-2 flex items-center justify-center border-none flex-nowrap hover:brightness-150 whitespace-nowrap !bg-complimentary-400/30 smooth"
        routerLink="/pages/users"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          class="w-6 h-6"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"
          />
        </svg>
        <span>Torna alla lista</span>
      </button>
      <div>
        <notify-share-profile
          [profile]="profile"
          [baseUrl]="baseUrl"
        ></notify-share-profile>
      </div>
      <div
        class="lg:flex justify-around lg:space-x-4 space-y-4 lg:space-y-0 items-start w-full"
      >
        <notify-profile-form
          [profile]="profile"
          [savedRedirects]="savedRedirects"
          [loading]="loading"
          (value)="updateProfileSubject($event)"
          (submitForm)="saveProfile($event)"
          (removeSavedRedirect)="removeSavedRedirect($event)"
          class="w-full 2xl:w-6/12"
        ></notify-profile-form>

        <div class="w-6/12 p-2 flex justify-center relative">
          <notify-profile-view
            *ngIf="!profile.config.redirectEnabled"
            [data]="profile"
            [mockup]="true"
            class="iphone-15-pro hidden lg:block absolute scale-75 2xl:scale-100 top-10"
          ></notify-profile-view>

          <div
            class="hidden lg:flex absolute scale-75 2xl:scale-100 top-10 flex-col"
            *ngIf="profile.config.redirectEnabled"
          >
            <iframe
              [src]="normalizeURL(profile.redirectUrl)"
              class="iphone-15-pro phone mockup-phone pointer-events-none"
              frameborder="0"
            ></iframe>
            <small class="w-full text-center mx-auto">
              Alcuni siti web potrebbero non essere visualizzati correttamente
            </small>
          </div>
        </div>
      </div>

      <div
        class="fixed bottom-5 right-5 lg:hidden z-50"
        *ngIf="!profile.config.redirectEnabled"
      >
        <button class="floating-button" (click)="previewProfile(profile)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6 h-6"
          >
            <path
              fill-rule="evenodd"
              d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
  } @else {
  <div class="loading-container">
    <notify-loading></notify-loading>
  </div>
  }
</div>
<div
  class="fixed bottom-0 left-0 lg:left-auto lg:right-0 scale-[0.4] opacity-50"
  *ngIf="loading"
>
  <notify-loading></notify-loading>
</div>
