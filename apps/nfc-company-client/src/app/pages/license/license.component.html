<div class="w-full h-full space-y-4 flex flex-col items-center">
  <notify-page-header
    class="w-full"
    title="Licenza"
    subtitle="Visualizza le informazioni sulla tua licenza"
    [buttons]="[
        {
          label: 'Richiedi rinnovo',
          disabled: daysLeft > 30,
          icon: ['M4.755 10.059a7.5 7.5 0 0112.548-3.364l1.903 1.903h-3.183a.75.75 0 100 1.5h4.992a.75.75 0 00.75-.75V4.356a.75.75 0 00-1.5 0v3.18l-1.9-1.9A9 9 0 003.306 9.67a.75.75 0 101.45.388zm15.408 3.352a.75.75 0 00-.919.53 7.5 7.5 0 01-12.548 3.364l-1.902-1.903h3.183a.75.75 0 000-1.5H2.984a.75.75 0 00-.75.75v4.992a.75.75 0 001.5 0v-3.18l1.9 1.9a9 9 0 0015.059-4.035.75.75 0 00-.53-.918z'],
          eventName: 'refresh',
        },
      ]"
  ></notify-page-header>

  <div class="h-94 w-full xl:w-10/12">
    <notify-license-info
      [license]="license"
      (daysLeft)="daysLeft = $event"
    ></notify-license-info>
  </div>
</div>
