<div class="flex flex-col lg:flex-row font-work min-h-screen overflow-hidden">
  <notify-nav
    class="lg:scale-[0.965] lg:px-2 z-[999]"
    [topItems]="nav"
    [bottomItems]="bottomNav"
    subtitle="Dashboard"
    [versionInfo]="{
      currentVersion: currentVersionLabel,
      currentVersionDate: currentVersionDate,
    }"
    (versionClick)="handleVersionClick()"
  ></notify-nav>

  <div class="lg:pr-3 2xl:p-1 h-full lg:max-h-screen lg:w-screen">
    <router-outlet class="w-full h-full"></router-outlet>
  </div>
</div>
