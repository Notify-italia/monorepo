<div class="w-full space-y-4">
  <notify-page-header title="Gestione utenti"></notify-page-header>
  <div
    class="flex flex-col pb-5 lg:px-5 space-y-4 w-full"
    *ngIf="profiles$ | async as p"
  >
    <div class="flex justify-end">
      <button
        class="btn btn-wide btn-primary"
        data-theme="notifytheme"
        [disabled]="maxAgents <= p.length"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-6 h-6"
        >
          <path
            fill-rule="evenodd"
            d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zM12.75 9a.75.75 0 00-1.5 0v2.25H9a.75.75 0 000 1.5h2.25V15a.75.75 0 001.5 0v-2.25H15a.75.75 0 000-1.5h-2.25V9z"
            clip-rule="evenodd"
          />
        </svg>

        <span>Aggiungi</span>
      </button>
    </div>
    <div class="box w-full h-full p-4">
      <div class="overflow-x-auto">
        <table class="table">
          <!-- head -->
          <thead>
            <tr>
              <th>
                <label>
                  <input type="checkbox" class="checkbox" />
                </label>
              </th>
              <th>Nome</th>
              <th>Ruolo</th>
              <th>Aggiunto il</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <!-- row 1 -->
            @for (user of p; track user._id) {
            <tr>
              <th>
                <label>
                  <input type="checkbox" class="checkbox" />
                </label>
              </th>
              <td>
                <div class="flex items-center gap-3">
                  <div class="avatar">
                    <div class="mask mask-squircle w-14 h-14">
                      <img
                        *ngIf="user.profile?.avatar || placeholderAvatar as src"
                        [src]="src"
                        alt="Avatar Tailwind CSS Component"
                      />
                    </div>
                  </div>
                  <div>
                    <div class="font-bold">
                      {{ user.profile?.name }} {{ user.profile?.surname }}
                    </div>
                    <div class="text-sm opacity-50">{{ user.email }}</div>
                  </div>
                </div>
              </td>
              <td>
                <div class="flex justify-center">
                  <span class="badge badge-ghost badge-sm px-4 py-3 w-full">{{
                    user.profile?.role
                  }}</span>
                </div>
              </td>
              <td>{{ user.createdAt | date : 'dd/MM/yyyy HH:mm' }}</td>
              <th class="space-x-4">
                <button
                  class="action-btn action-primary"
                  data-theme="notifytheme"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    class="w-6 h-6"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M10.5 3.75a6.75 6.75 0 100 13.5 6.75 6.75 0 000-13.5zM2.25 10.5a8.25 8.25 0 1114.59 5.28l4.69 4.69a.75.75 0 11-1.06 1.06l-4.69-4.69A8.25 8.25 0 012.25 10.5z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </button>
                <button
                  class="action-btn action-secondary"
                  data-theme="notifytheme"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    class="w-6 h-6"
                  >
                    <path
                      d="M21.731 2.269a2.625 2.625 0 00-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 000-3.712zM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 00-1.32 2.214l-.8 2.685a.75.75 0 00.933.933l2.685-.8a5.25 5.25 0 002.214-1.32L19.513 8.2z"
                    />
                  </svg>
                </button>
                <button
                  class="action-btn action-error"
                  data-theme="notifytheme"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    class="w-6 h-6"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </button>
              </th>
            </tr>
            }
          </tbody>
          <!-- foot -->
        </table>
      </div>
    </div>
  </div>
</div>
