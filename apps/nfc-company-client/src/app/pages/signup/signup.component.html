<div class="h-screen w-screen overflow-hidden">
  <button class="floating-button m-2 absolute z-50" routerLink="/signin">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
      class="w-6 h-6"
    >
      <path
        fill-rule="evenodd"
        d="M9.53 2.47a.75.75 0 0 1 0 1.06L4.81 8.25H15a6.75 6.75 0 0 1 0 13.5h-3a.75.75 0 0 1 0-1.5h3a5.25 5.25 0 1 0 0-10.5H4.81l4.72 4.72a.75.75 0 1 1-1.06 1.06l-6-6a.75.75 0 0 1 0-1.06l6-6a.75.75 0 0 1 1.06 0Z"
        clip-rule="evenodd"
      />
    </svg>
    <span class="hidden lg:block">Torna al Log-In</span>
  </button>
  <notify-auth
    [config]="config"
    [loading]="loading"
    (formSubmitted)="signup($event)"
  ></notify-auth>
</div>
