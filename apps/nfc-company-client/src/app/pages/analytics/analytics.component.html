<div class="page-layout">
  <notify-page-header
    title="Analytics"
    subtitle="Visualizza le statistiche relative ai tuoi utenti"
    [buttons]="[
      {
        label: 'Statistiche per Utente',
        icon: [
          'M8.25 6.75a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0ZM15.75 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM2.25 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM6.31 15.117A6.745 6.745 0 0 1 12 12a6.745 6.745 0 0 1 6.709 7.498.75.75 0 0 1-.372.568A12.696 12.696 0 0 1 12 21.75c-2.305 0-4.47-.612-6.337-1.684a.75.75 0 0 1-.372-.568 6.787 6.787 0 0 1 1.019-4.38Z',
          'M5.082 14.254a8.287 8.287 0 0 0-1.308 5.135 9.687 9.687 0 0 1-1.764-.44l-.115-.04a.563.563 0 0 1-.373-.487l-.01-.121a3.75 3.75 0 0 1 3.57-4.047ZM20.226 19.389a8.287 8.287 0 0 0-1.308-5.135 3.75 3.75 0 0 1 3.57 4.047l-.01.121a.563.563 0 0 1-.373.486l-.115.04c-.567.2-1.156.349-1.764.441Z'
        ],
        eventName: 'details'
      }
    ]"
    (buttonClicked)="goToDetails()"
  ></notify-page-header>

  @if (dashboard$ | async; as data) {
  <div>
    <div>
      <div class="dashboard-cards-container h-spacing">
        <notify-widget-counter
          class="dashboard-card"
          title="Visite totali"
          backgroundColor="transparent"
          elementsColor="#008FFB"
          [icon]="totalScansIcon"
          [count]="data.totalVisits"
          countSuffix="Visite"
        ></notify-widget-counter>
        <notify-widget-counter
          class="dashboard-card"
          title="Salvati in rubrica"
          backgroundColor="transparent"
          elementsColor="#876756"
          [icon]="savedContactsIcon"
          [count]="data.totalSaved"
          countSuffix="Contatti"
        ></notify-widget-counter>
        <notify-widget-counter
          class="dashboard-card"
          title="Impatto ambientale"
          backgroundColor="transparent"
          elementsColor="#5EC866"
          [icon]="co2SavedIcon"
          [count]="data.totalCO2Saved"
          countSuffix="Kg di CO2 risparmiati"
          tooltip="Dati basati su una media di {{
            classicBusinessCardCO2
          }} kg di CO2 risparmiati su ogni scansione, sottratti di {{
            nfcBusinessCardCO2
          }} kg di CO2 per ogni biglietto da visita digitale posseduto."
        ></notify-widget-counter>
      </div>
      <div class="divider"></div>

      <div
        class="flex flex-col lg:flex-row w-full min-h-screen lg:min-h-[60vh] h-spacing"
      >
        <notify-widget-bar-chart
          class="w-full h-full"
          title="Visite per utente"
          [series]="data.agentsPerVisitSeries"
        >
        </notify-widget-bar-chart>
        <div class="flex flex-col lg:w-5/12 2xl:w-3/12 items-stretch v-spacing">
          <notify-widget-feedback
            title="Valutazione media"
            [value]="data.totalAverageFeedbackRating"
            [totalFeedbacksCount]="data.totalFeedbackCount"
          ></notify-widget-feedback>

          <div class="divider"></div>
          <h2
            class="text-2xl text-white font-bold"
            *ngIf="data.bestUser?.profile || data.worstUser?.profile"
          >
            Top/Worst Pick di {{ currentMonth | titlecase }}
          </h2>

          <notify-widget-profile-card
            [baseUrl]="baseUrl"
            *ngIf="data.bestUser as bestUser"
            [profile]="bestUser.profile"
            [rating]="bestUser.averageRating"
            [ratingItems]="bestUser.count"
            title="Miglior utente ({{ currentMonth }})"
            backgroundColor="#40ff00"
          ></notify-widget-profile-card>
          <notify-widget-profile-card
            *ngIf="data.worstUser as worstUser"
            [baseUrl]="baseUrl"
            [profile]="worstUser.profile"
            [rating]="worstUser.averageRating"
            [ratingItems]="worstUser.count"
            title="Peggior utente ({{ currentMonth }})"
            backgroundColor="#ff0000"
          ></notify-widget-profile-card>
        </div>
      </div>
    </div>
  </div>
  } @else {
  <div class="loading-container">
    <notify-loading></notify-loading>
  </div>
  }
</div>
