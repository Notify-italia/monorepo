<div class="page-layout">
  <notify-page-header
    title="Colleghi"
    subtitle="Mostra i e condividi il profilo dei tuoi colleghi"
  ></notify-page-header>

  <notify-accounts-table
    [users$]="colleagues$"
    [maxAgents]="null"
    [config]="{
      disabledRows: ['createdAt', 'select-item', 'actions'],
      clickableRow: true
    }"
    (rowClicked)="inspectProfile($event.profile)"
  ></notify-accounts-table>
</div>
