<div class="page-layout">
  <notify-page-header
    title="Colleghi"
    subtitle="Mostra i e condividi il profilo dei tuoi colleghi"
  ></notify-page-header>

  <notify-accounts-table
    [users$]="colleagues$"
    [maxAgents]="null"
    [config]="{
      allowedActions: [],
      hiddenColumns: ['createdAt', 'select-item', 'actions', 'role'],
      clickableRow: true
    }"
    [noItemsMessages]="{
      title: 'Nessun collega',
      subtitle:
        'Non hai ancora colleghi o la tua ricerca non ha prodotto risultati'
    }"
    (rowClicked)="inspectProfile($event.profile)"
  ></notify-accounts-table>
</div>
