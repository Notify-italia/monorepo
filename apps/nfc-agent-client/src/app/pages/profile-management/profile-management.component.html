<div class="w-full space-y-4">
  <notify-page-header
    title="Gestione Profilo"
    subtitle="Modifica e condividi il tuo profilo personale"
  ></notify-page-header>

  @if (profile$ | async; as profile) {
  <div class="flex flex-col pb-5 lg:px-5 space-y-4 w-full">
    <div class="fixed bottom-5 right-5 lg:hidden z-50">
      <button class="floating-button" (click)="previewProfile(profile)">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-6 h-6"
        >
          <path
            fill-rule="evenodd"
            d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
    <div>
      <notify-share-profile
        [profile]="profile"
        [playerUrl]="playerUrl(profile)"
      ></notify-share-profile>
    </div>
    <div
      class="lg:flex justify-around lg:space-x-4 space-y-4 lg:space-y-0 items-start w-full"
    >
      <notify-profile-form
        [profile]="profile"
        [loading]="loading"
        (value)="updateProfileSubject($event)"
        (submitForm)="saveProfile(profile)"
        (reloadForm)="reloadForm()"
        class="w-full 2xl:w-6/12"
      ></notify-profile-form>
      <!-- TODO preview mobile -->
      <div class="w-6/12 p-2 flex justify-center relative">
        <notify-profile-view
          [data]="profile"
          [mockup]="true"
          [publicUrl]="''"
          class="w-[405px] h-[800px] hidden lg:block absolute scale-75 2xl:scale-100 top-10"
        ></notify-profile-view>
      </div>
    </div>
  </div>
  } @else {
  <div class="h-[80vh]">
    <notify-loading></notify-loading>
  </div>
  }
</div>
