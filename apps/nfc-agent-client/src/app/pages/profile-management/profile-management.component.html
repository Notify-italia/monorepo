<div class="w-full space-y-4">
  <notify-page-header title="Gestione Profilo"></notify-page-header>

  <div
    class="flex flex-col pb-5 lg:px-5 space-y-4 w-full"
    *ngIf="profile$ | async as profile"
  >
    <div>
      <notify-share-profile
        [profile]="profile"
        [publicProfileUrl]="publicProfileUrl(profile)"
      ></notify-share-profile>
    </div>
    <div
      class="lg:flex justify-around lg:space-x-4 space-y-4 lg:space-y-0 items-start w-full"
    >
      <notify-profile-form
        [profile]="profile"
        (value)="updateProfileSubject($event)"
        (submitForm)="saveProfile(profile)"
        (reloadForm)="reloadForm()"
        class="w-full 2xl:w-6/12"
      ></notify-profile-form>
      <!-- TODO preview mobile -->
      <div class="w-6/12 p-2 flex justify-center relative">
        <notify-profile-view
          [data]="profile"
          [mockup]="true"
          [publicUrl]="''"
          class="w-[405px] h-[800px] hidden lg:block absolute scale-75 2xl:scale-100 top-10"
        ></notify-profile-view>
      </div>
    </div>
  </div>
</div>
