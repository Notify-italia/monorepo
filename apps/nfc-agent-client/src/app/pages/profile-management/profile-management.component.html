<div class="flex flex-col w-full space-y-4 items-center">
  <div class="pt-4 w-full">
    <span class="text-4xl font-medium text-secondary"> Modifica profilo </span>
    <div class="divider"></div>
  </div>

  <div class="flex flex-col pb-5 lg:px-5 space-y-4 w-full">
    <div>
      <notify-share-profile></notify-share-profile>
    </div>
    <div
      class="lg:flex justify-around lg:space-x-4 space-y-4 lg:space-y-0 items-start"
    >
      <notify-profile-form
        (value)="formValue = $event"
        class="w-full"
      ></notify-profile-form>

      <notify-profile-view
        [data]="formValue"
        [mockup]="true"
        class="max-w-[560px] w-[560px] h-[750px] hidden lg:block"
      ></notify-profile-view>
    </div>
  </div>
</div>
