<div class="page-layout">
  <notify-page-header
    title="Dashboard"
    subtitle="Visualizza le informazioni principali del tuo account"
  ></notify-page-header>
  @if (dashboardReady$ | async; as data) {
  <div>
    <div>
      <div class="flex flex-col lg:flex-row lg:justify-between h-spacing">
        <div class="v-spacing lg:w-full">
          <div class="dashboard-cards-container h-spacing">
            <notify-widget-counter
              class="dashboard-card"
              title="Visite totali"
              bgColor="#31A17C"
              elementsColor="#FFFEFC"
              [icon]="totalScansIcon"
              [count]="data.user.statsMapped.totalVisits"
              countSuffix="Visite"
            >
              >TOTAL_RETURNS</notify-widget-counter
            >
            <notify-widget-counter
              class="dashboard-card"
              title="Salvati in rubrica"
              bgColor="#F9FAFB"
              elementsColor="#1F2937"
              [icon]="savedContactsIcon"
              [count]="data.user.statsTotals?.['profile:save'] || 0"
              countSuffix="Contatti"
              >TOTAL_SAVES</notify-widget-counter
            >
            <notify-widget-counter
              class="dashboard-card"
              title="Visite da rubrica"
              bgColor="#0286FF"
              elementsColor="#FFFEFE"
              [icon]="returnFromContactBookIcon"
              [count]="data.user.statsMapped.percentReturn"
              countSuffix="% sul totale"
            >
            </notify-widget-counter>
            <!-- <notify-widget-counter
              class="dashboard-card"
              title="Impatto ambientale"
              bgColor="#5EC866"
              elementsColor="#FFFEFC"
              [icon]="co2SavedIcon"
              [count]="1.5"
              countSuffix="Kg di CO2 risparmiati"
              >TOTAL_CO2_SAVED</notify-widget-counter
            > -->
          </div>

          <div class="divider"></div>

          <div
            class="flex flex-col lg:flex-row w-full lg:h-[22rem] 2xl:h-[40rem] h-spacing"
          >
            <notify-widget-area-chart
              class="flex w-full h-full justify-center items-center"
              title="Visite"
              [series]="data.areaChart"
              (timespanChange)="getProfileVisits($event).subscribe()"
            >
            </notify-widget-area-chart>
            <div class="flex flex-col lg:w-4/12 h-full items-center v-spacing">
              <div class="flex w-full h-48 justify-center border items-center">
                AVERAGE_FEEDBACK
              </div>
              <div
                class="w-full h-full border items-center flex flex-col justify-center p-2"
              >
                USED_INTEGRATIONS_PIE_CHART
              </div>
            </div>
          </div>
          <div class="dashboard-cards-container h-spacing"></div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="dashboard-cards-container h-spacing">
        <notify-share-profile
          class="w-full"
          [profile]="data.profile"
          [baseUrl]="baseUrl"
        ></notify-share-profile>

        <div class="w-full h-full border p-2 items-center flex justify-center">
          LATEST_EDITED_NOTE
        </div>
      </div>
    </div>
  </div>
  } @else {
  <div class="loading-container">
    <notify-loading></notify-loading>
  </div>
  }
</div>
