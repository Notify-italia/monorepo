<div class="fixed bottom-0 right-0 scale-[0.4] opacity-50 z-50" *ngIf="loading">
  <notify-loading></notify-loading>
</div>

<div class="page-layout">
  <notify-page-header
    title="Gestisci nota"
    subtitle="Visualizza e modifica i dati della nota"
  ></notify-page-header>

  @if (note$ | async; as n) {
  <div>
    <div>
      <div class="flex justify-between w-full">
        <!-- BACK TO LIST -->
        <button
          [disabled]="loading"
          type="button"
          class="utils-button !bg-complimentary-400/30 smooth"
          (click)="goBack()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"
            />
          </svg>
          <span>Torna alla lista</span>
        </button>

        <!-- DELETE NOTE -->
        <button
          [disabled]="loading"
          (click)="deleteNote()"
          type="button"
          class="utils-button !bg-red-500 !text-white smooth"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z"
              clip-rule="evenodd"
            />
          </svg>

          <span>Elimina Nota</span>
        </button>
      </div>

      <notify-note-detail
        [note]="n"
        (noteChanged)="saveNote($event)"
        (addOwner)="addOwner(n)"
        (manageOwners)="manageOwners(n)"
      ></notify-note-detail>
    </div>
  </div>
  } @else {
  <div class="h-[80vh]">
    <notify-loading></notify-loading>
  </div>
  }
</div>
