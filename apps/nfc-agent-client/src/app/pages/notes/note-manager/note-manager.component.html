<div class="fixed bottom-0 right-0 scale-[0.4] opacity-50" *ngIf="loading">
  <notify-loading [interval]="40"></notify-loading>
</div>

<div class="page-layout">
  <notify-page-header
    title="Gestisci nota"
    subtitle="Visualizza e modifica i dati della nota"
  ></notify-page-header>

  @if (note$ | async; as n) {
  <div>
    <div>
      <div class="flex justify-around space-x-2 scale-[0.85] lg:scale-100">
        <button
          type="button"
          class="utils-button !bg-complimentary-400/30 smooth"
          (click)="goBack()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"
            />
          </svg>
          <span>Indietro</span>
        </button>
        <button
          type="button"
          class="utils-button !bg-complimentary-400/30 smooth"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"
            />
          </svg>

          <span>Colleghi</span>
        </button>
        <button
          type="button"
          class="utils-button !bg-red-500 !text-white smooth"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z"
              clip-rule="evenodd"
            />
          </svg>

          <span>Elimina nota</span>
        </button>
      </div>
      <notify-note-detail
        [note]="n"
        (noteChanged)="saveNote($event)"
      ></notify-note-detail>
    </div>
  </div>
  } @else {
  <div class="h-[80vh]">
    <notify-loading></notify-loading>
  </div>
  }
</div>
