<div class="fixed bottom-0 right-0 scale-[0.4] opacity-50" *ngIf="loading">
  <notify-loading [interval]="10"></notify-loading>
</div>

<div class="page-layout">
  <notify-page-header
    title="Gestisci nota"
    subtitle="Visualizza e modifica i dati della nota"
    [buttons]="[
      {
        label: 'Indietro',
        eventName: 'back',
        icon: [
          'M9.53 2.47a.75.75 0 0 1 0 1.06L4.81 8.25H15a6.75 6.75 0 0 1 0 13.5h-3a.75.75 0 0 1 0-1.5h3a5.25 5.25 0 1 0 0-10.5H4.81l4.72 4.72a.75.75 0 1 1-1.06 1.06l-6-6a.75.75 0 0 1 0-1.06l6-6a.75.75 0 0 1 1.06 0Z'
        ]
      }
    ]"
    (buttonClicked)="handleHeaderAction($event)"
  ></notify-page-header>
  @if (note$ | async; as n) {
  <div>
    <div>
      <notify-note-form
        [note]="n"
        (formValueChange)="saveNote($event)"
      ></notify-note-form>
    </div>
  </div>
  } @else {
  <div class="h-[80vh]">
    <notify-loading></notify-loading>
  </div>
  }
</div>
