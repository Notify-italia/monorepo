<div class="page-layout">
  <notify-page-header
    title="Note"
    subtitle="Crea, visualizza e modifica le tue note"
    [buttons]="[
      {
        icon: [
          'M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zM12.75 9a.75.75 0 00-1.5 0v2.25H9a.75.75 0 000 1.5h2.25V15a.75.75 0 001.5 0v-2.25H15a.75.75 0 000-1.5h-2.25V9z'
        ],
        label: 'Aggiungi',
        eventName: 'addNote'
      }
    ]"
    (buttonClicked)="handleHeaderAction($event)"
  ></notify-page-header>
  @if (notes$ | async; as notes) {
  <div>
    <div>
      <notify-notes-list
        [notes]="notes"
        (editNote)="editNote($event)"
        (deleteNote)="deleteNote($event)"
      ></notify-notes-list>
    </div>
  </div>
  } @else {
  <div class="h-[80vh]">
    <notify-loading></notify-loading>
  </div>
  }
</div>
