<button
  class="btn btn-primary w-full"
  data-theme="notifytheme"
  (click)="openLicenseForm()"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="currentColor"
    class="w-6 h-6"
  >
    <path
      fill-rule="evenodd"
      d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 9a.75.75 0 0 0-1.5 0v2.25H9a.75.75 0 0 0 0 1.5h2.25V15a.75.75 0 0 0 1.5 0v-2.25H15a.75.75 0 0 0 0-1.5h-2.25V9Z"
      clip-rule="evenodd"
    />
  </svg>

  <span> Crea una nuova licenza </span>
</button>

<notify-custom-table
  [iterable$]="licenses$"
  (actionClicked)="actionClicked($event)"
  (rowClick)="rowClicked($event)"
  [config]="{
    searchBar: {
      filterableFields: ['publicKey','company.profile.name',
    'company.profile.surname',
    'company.email', 'allowedAgents', 'boughtCards'],
    },
    skeletonRows: 20,
    defaultSorter: 'assignedTo',
    style:{
      transparentBackground:true,
      alternateRows:true
    },
    clickableRows: true,
    columns: [
      {
        id: 'public-key',
        label: 'Chiave Pubblica',
        hidden,
        value: {
          valueType: 'field',
          fieldName: 'publicKey',
          skeletonLength: 35
        }
      },
      {
        id:'copy',
        label: ' ',
        hidden,
        value: {
          valueType: 'actions',
          actions: [
            {
              eventName: 'copyPublicKey',
              path:['M17.663 3.118c.225.015.45.032.673.05C19.876 3.298 21 4.604 21 6.109v9.642a3 3 0 0 1-3 3V16.5c0-5.922-4.576-10.775-10.384-11.217.324-1.132 1.3-2.01 2.548-2.114.224-.019.448-.036.673-.051A3 3 0 0 1 13.5 1.5H15a3 3 0 0 1 2.663 1.618ZM12 4.5A1.5 1.5 0 0 1 13.5 3H15a1.5 1.5 0 0 1 1.5 1.5H12Z',
              'M3 8.625c0-1.036.84-1.875 1.875-1.875h.375A3.75 3.75 0 0 1 9 10.5v1.875c0 1.036.84 1.875 1.875 1.875h1.875A3.75 3.75 0 0 1 16.5 18v2.625c0 1.035-.84 1.875-1.875 1.875h-9.75A1.875 1.875 0 0 1 3 20.625v-12Z',
              'M10.5 10.5a5.23 5.23 0 0 0-1.279-3.434 9.768 9.768 0 0 1 6.963 6.963 5.23 5.23 0 0 0-3.434-1.279h-1.875a.375.375 0 0 1-.375-.375V10.5Z'],
              svgType: 'solid',
              color: 'accent'
            }
          ]
        }
      },
      {
        id: 'boughtCards',
        label: 'Tessere',
        sorter: sortBoughtCards,
                hidden,

        value: {
          transformer: numberTransform,
          valueType: 'field',
          fieldName: 'boughtCards',
          skeletonLength: 2
        }
      },
      {
        id: 'allowedAgents',
        sorter: sortAllowedAgents,
        label: 'Utenti Abilitati',
        hidden,

        value: {
          transformer: numberTransform,
          valueType: 'field',
          fieldName: 'allowedAgents',
          skeletonLength: 2
        }
      },
      {
        id: 'expirationDate',
        label: 'Data Scadenza',
        sorter: sortExpirationDate,
        hidden,

        value: {
          minWidth: 8,
          valueType: 'badge',
          style: [
            {
              condition: isExpired,
              text: '#fffff',
              bg: '#f44336'
            },
            {
              condition: isExpiring,
              text: '#fffff',
              bg: '#ff9800'
            },
            {
              condition: isNotExpired,
              text: '#fffff',
              bg: '#4caf50'
            }
          ],
          fieldName: 'expirationDate',
          transformer: dateTransform
        },
      },
      {
        id: 'assignedTo',
        label: 'Assegnato a',
        hidden,
        sorter: sortAssignedTo,
        
        value: {
          valueType: 'avatar',
          avatarSize: '14',
          computedValues: computeAvatar,
        }
      },
      {
        id: 'createdAt',
        label: 'Data Creazione',
        hidden,

        sorter: sortCreationDate,
        value: {
          valueType: 'field',
          fieldName: 'createdAt',
          transformer: dateTransform,
          skeletonLength: 16
        }
      },
      {
        id: 'enavled',
        label: 'Abilitata',
        hidden,

        value: {
          valueType: 'field',
          fieldName: 'enabled',
          transformer: booleanTransform,
          skeletonLength: 2
        }
      }
    ]
  }"
></notify-custom-table>
