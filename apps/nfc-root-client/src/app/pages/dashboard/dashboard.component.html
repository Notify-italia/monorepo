<notify-page-header
  [title]="'Dashboard'"
  [subtitle]="'Benvenuto nella dashboard principale'"
></notify-page-header>

@if ( dashboard$ | async; as dashboard ) {
<div class="flex flex-col space-y-4 justify-center items-center h-full">
  <div class="flex justify-around space-x-4 w-full">
    <div class="flex flex-col space-y-4 w-full">
      <notify-widget-counter
        [backgroundColor]="'cyan'"
        title="Aziende Totali"
        [icon]="{
          name: 'office-building',
          set: 'hero-solid'
        }"
        elementsColor="'white'"
        [count]="dashboard.companies"
      ></notify-widget-counter>
      <notify-widget-counter
        [backgroundColor]="'#42f593'"
        title="Aziende Attive"
        [icon]="{
          name: 'euro',
          set: 'materialui'
        }"
        elementsColor="'white'"
        [count]="dashboard.activeCompanies"
      ></notify-widget-counter>
      <notify-widget-counter
        [backgroundColor]="'green'"
        title="Tessere Vendute"
        [icon]="{
          name: 'identification',
          set: 'hero-solid'
        }"
        elementsColor="'white'"
        [count]="dashboard.boughtCards"
      ></notify-widget-counter>
    </div>
    <div class="flex flex-col justify-center h-full space-y-4 w-full">
      <notify-widget-counter
        [backgroundColor]="'yellow'"
        title="Utenti Totali"
        [icon]="{
          name: 'user-group',
          set: 'hero-solid'
        }"
        elementsColor="'white'"
        [count]="dashboard.totalAgents"
      ></notify-widget-counter>
      <notify-widget-counter
        [backgroundColor]="'green'"
        title="Utenti Attivi"
        [icon]="{
          name: 'user-group',
          set: 'hero-solid'
        }"
        elementsColor="'white'"
        [count]="dashboard.agents"
      ></notify-widget-counter>
    </div>
  </div>

  <div class="divider"></div>

  <div class="flex justify-around space-x-4 w-full">
    <notify-widget-counter
      class="w-full"
      [backgroundColor]="'purple'"
      title="Profili visitati"
      [icon]="{
        name: 'show_chart',
        set: 'materialui'
      }"
      elementsColor="'white'"
      [count]="dashboard.profileVisit"
    ></notify-widget-counter>

    <notify-widget-counter
      class="w-full"
      [backgroundColor]="'red'"
      title="Profili Salvati"
      [icon]="{
        name: 'save',
        set: 'hero-solid'
      }"
      elementsColor="'white'"
      [count]="dashboard.provileSave"
    ></notify-widget-counter>
  </div>

  <div class="divider"></div>

  <div class="flex flex-col items-start w-full space-y-4">
    <div
      class="flex items-center space-x-4 box p-2 !w-6/12 justify-between !rounded-2xl"
      *ngIf="dashboard.latestVisit.user.profile as p"
    >
      <div class="flex space-x-4 items-center">
        <notify-avatar
          [avatarConfig]="
            profileService.getProfileAvatarComponentConfig(p, '24')
          "
        ></notify-avatar>
        <div class="flex flex-col justify-center">
          <h2 class="text-lg font-bold mb-1 text-gray-300">
            Ultimo profilo visitato
          </h2>

          <span class="font-medium">
            {{ profileService.getContactName(p) }}
          </span>
          <span class="text-sm">
            {{ dashboard.latestVisit.date | date : 'dd/MM/yyyy HH:mm' }}
          </span>
        </div>
      </div>

      <button
        class="btn btn-ghost"
        routerLink="/pages/customer/"
        [queryParams]="{
          id: getCustomerRedirectUrl(dashboard.latestVisit.user)
        }"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m5.25 4.5 7.5 7.5-7.5 7.5m6-15 7.5 7.5-7.5 7.5"
          />
        </svg>
      </button>
    </div>
  </div>

  <div class="flex space-x-4 items-center" *ngIf="isPolling">
    <notify-loading class="scale-50"></notify-loading>
    <span>Ricarico...</span>
  </div>
</div>

} @else {
<div class="loading-container">
  <notify-loading></notify-loading>
</div>
}
