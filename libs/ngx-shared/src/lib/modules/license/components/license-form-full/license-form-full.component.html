<div class="modal-container" (click)="close()">
  <div>
    <div (click)="$event.stopPropagation()" class="modal-content">
      <div class="modal-icon">
        <div>
          <div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
              />
            </svg>
          </div>
        </div>
        <h2>Gestione Licenza</h2>
        <p>Modifica o crea una nuova licenza</p>
        <div class="divider"></div>
      </div>
      <form [formGroup]="form" class="w-full" (ngSubmit)="save()">
        <div class="flex w-full space-x-5 justify-around">
          <div class="flex flex-col space-y-2">
            <div class="flex space-x-2 items-center">
              <notify-tailwind-datepicker
                [parent]="form"
                name="expirationDate"
                label="Data di scadenza"
                [compact]="true"
              ></notify-tailwind-datepicker>

              <button
                [disabled]="!form.controls['expirationDate'].value"
                class="btn btn-warning btn-sm"
                (click)="form.controls['expirationDate'].setValue(null)"
              >
                No scadenza
              </button>
            </div>
            <div class="divider"></div>
            <button
              class="btn btn-sm w-full btn-primary"
              data-theme="notifytheme"
              (click)="addFeature()"
            >
              Aggiungi feature
            </button>
            <div class="flex flex-col justify-center space-y-2">
              @for (item of $any(form.controls['features']).controls; track
              $index) {
              <div class="flex space-x-2">
                <notify-tailwind-select
                  class="w-full"
                  [compact]="true"
                  [parent]="item"
                  name="name"
                  label="Nome"
                  [options]="featuresSelectOptions"
                ></notify-tailwind-select>
                <notify-tailwind-select
                  class="w-full"
                  [compact]="true"
                  [parent]="item"
                  name="type"
                  label="Tipo"
                  [options]="featuresTypeSelectOptions"
                ></notify-tailwind-select>
              </div>
              }
            </div>
          </div>
          <div class="flex flex-col space-y-2">
            <notify-tailwind-input
              [compact]="true"
              [parent]="form"
              name="allowedAgents"
              label="Utenti"
              type="number"
              placeholder="10"
            ></notify-tailwind-input>
            <notify-tailwind-input
              [compact]="true"
              [parent]="form"
              name="boughtCards"
              label="Tessere Notify Acquistate"
              type="number"
              placeholder="10"
            ></notify-tailwind-input>
            <notify-tailwind-checkbox
              [parent]="form"
              name="enabled"
              [compact]="true"
              label="Abilitato"
            ></notify-tailwind-checkbox>
          </div>
        </div>
        <div class="divider"></div>
        <div class="flex justify-between w-full">
          <button
            class="btn btn-error"
            *ngIf="license"
            [disabled]="license.company"
            data-theme="notifytheme"
            type="button"
            (click)="deleteLicense.next(license._id); close()"
          >
            Elimina Licenza
          </button>
          <button
            class="btn btn-primary"
            [disabled]="!form.valid"
            data-theme="notifytheme"
            type="submit"
          >
            Conferma
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
