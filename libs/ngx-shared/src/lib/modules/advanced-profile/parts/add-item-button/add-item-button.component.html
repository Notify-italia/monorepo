<button
  class="absolute pointer-events-none w-0 h-0 opacity-0"
  #loseFocus
  tabindex="0"
></button>

<div class="group flex flex-col items-center" tabindex="0">
  <div tabindex="0" class="sm-btn smooth">
    <button
      #AddItemButton
      id="add-item-button"
      type="button"
      tabindex="0"
      (click)="
        activeElement === AddItemButton ? closeMenu() : toggleState($event)
      "
      class="flex justify-center space-x-4 items-center pointer-events-none group-focus-within:pointer-events-auto group-focus-within:w-full active:scale-95 smooth"
    >
      <svg
        tabindex="0"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6 group-focus-within:opacity-0 group-focus-within:h-0 smooth smooth-fast"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 4.5v15m7.5-7.5h-15"
        />
      </svg>
      <span
        tabindex="0"
        class="group-focus-within:opacity-0 group-focus-within:h-0 focus"
      >
        Aggiungi un blocco
      </span>
      <!-- <span tabindex="0" class="hidden group-focus-within:lock"> Chiudi</span> -->
    </button>

    <div
      tabindex="0"
      class="flex flex-col w-full opacity-0 h-0 pointer-events-none group-focus-within:h-80 group-focus-within:opacity-100 group-focus-within:pointer-events-auto smooth smooth-fast z-50 min-h-0"
    >
      <notify-available-items
        tabindex="0"
        (addItem)="addItem.emit($event); closeMenu()"
      ></notify-available-items>
    </div>
  </div>
</div>
