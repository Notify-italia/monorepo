<div
  class="modal-container !overflow-y-scroll !items-start !justify-stretch"
  *ngIf="selectedHierarchyItem"
  (click)="close()"
  [ngClass]="{
    'modalFadeOut': isClosing,
  }"
>
  <div class="!justify-start p-3 !items-stretch w-full mt-safe">
    <notify-right-panel
      (click)="$event.stopPropagation()"
      class="size-full"
      [loading]="loading"
      [profile]="profile"
      [form]="form"
      [selectedHierarchyItem]="selectedHierarchyItem"
      [environment]="environment"
      (forceSave)="forceSave.emit($event)"
      (closePanel)="closePanel.emit($event)"
      (removeItem)="removeItem.emit($event)"
    ></notify-right-panel>
  </div>
</div>
