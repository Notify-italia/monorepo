<div class="menu menu-large">
  <div class="flex flex-col size-full items-center smooth">
    <div
      class="overflow-y-auto shrink-0 flex flex-col w-full text-center desktop-only"
    >
      <notify-share-item
        [config]="shareConfig"
        [compact]="true"
      ></notify-share-item>

      <notify-save-indicator
        [isSaving]="loading"
        [lastSave]="profile.updatedAt || TEMP_today"
        [followPage]="false"
        [compact]="true"
        (save)="forceSave.emit()"
      ></notify-save-indicator>
    </div>

    <div class="mobile-only w-full">
      <button
        (click)="closePanel.emit()"
        class="btn btn-sm w-full btn-error text-white"
        data-theme="notifytheme"
      >
        <span>&#x2715;</span>
        <span>Chiudi</span>
      </button>
    </div>

    <div class="divider"></div>
    <div
      class="overflow-y-auto overflow-x-hidden min-h-10 w-full notify-scrollbar px-2 grow-0 h-full"
      *ngIf="form as f"
    >
      <notify-part-settings
        [form]="f"
        [profile]="profile"
        [environment]="environment"
        [selectedHierarchyItem]="selectedHierarchyItem"
        (removeItem)="removeItem.emit($event)"
      ></notify-part-settings>
    </div>
  </div>
</div>
