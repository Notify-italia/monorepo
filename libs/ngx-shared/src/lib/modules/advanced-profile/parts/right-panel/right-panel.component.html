<div class="menu menu-large">
  <div class="flex flex-col size-full items-center">
    <div
      class="overflow-y-auto shrink-0 flex flex-col w-full text-center space-y-1"
    >
      <notify-share-item
        [config]="shareConfig"
        [compact]="true"
      ></notify-share-item>

      <notify-save-indicator
        [isSaving]="loading"
        [lastSave]="profile.updatedAt || TEMP_today"
        [followPage]="false"
        [compact]="true"
        (save)="forceSave.emit()"
      ></notify-save-indicator>
    </div>

    <div class="divider"></div>
    <div
      class="overflow-y-auto overflow-x-hidden min-h-10 w-full notify-scrollbar"
      *ngIf="form"
    >
      <notify-part-settings
        [form]="form"
        [selectedHierarchyItem]="selectedHierarchyItem"
      ></notify-part-settings>
    </div>
  </div>
</div>
