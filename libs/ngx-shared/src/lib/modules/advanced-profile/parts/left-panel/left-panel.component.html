<div class="menu flex !flex-col flex-nowrap justify-between">
  <notify-redirect-toggle-button
    [redirectEnabled]="profile.config.redirectEnabled"
    (toggleProfileRedirect)="toggleProfileRedirect.emit($event)"
  ></notify-redirect-toggle-button>
  <div class="divider"></div>
  <div class="size-full flex flex-col min-h-40 items-start">
    <div>
      <h2>Gerarchia</h2>
      <small>
        Fai clic su un blocco per selezionarlo. Trascina e rilascia per
        riordinare
      </small>
    </div>

    <div
      class="overflow-y-auto overflow-x-hidden min-h-10 mt-2 w-full notify-scrollbar"
    >
      <notify-hierarchy
        [hierarchy]="hierarchy || []"
        [requiredItems]="requiredItems || []"
        [selectedHierarchyItem]="selectedHierarchyItem"
        (hierarchyChanged)="hierarchyChanged.emit($event)"
        (selectedHierarchyItemChanged)="
          selectedHierarchyItemChanged.emit($event)
        "
        [redirectEnabled]="profile.config.redirectEnabled"
      ></notify-hierarchy>
    </div>
  </div>
  <div class="divider"></div>
  <div
    [ngClass]="{
      'pointer-events-none opacity-50': profile.config.redirectEnabled
    }"
  >
    <h2>Blocchi</h2>
    <small> Fai clic su un blocco per aggiungerlo al profilo </small>
    <notify-available-items
      (addItem)="addItem.emit($event)"
    ></notify-available-items>
  </div>
</div>
