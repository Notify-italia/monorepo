<div class="p-2 w-full h-full flex flex-col flex-nowrap text-sm space-y-2">
  <div>
    <h2>Gerarchia</h2>
    <small>
      Fai tap su un blocco per selezionarlo. Trascina e rilascia per riordinare
    </small>
  </div>
  <!-- <div class="divider"></div> -->
  <notify-hierarchy
    [hierarchy]="hierarchy || []"
    [requiredItems]="requiredItems || []"
    [selectedHierarchyItem]="selectedHierarchyItem"
    (hierarchyChanged)="hierarchyChanged.emit($event)"
    (selectedHierarchyItemChanged)="selectedHierarchyItemChanged.emit($event)"
  ></notify-hierarchy>
</div>
