<div class="p-2 w-full h-full flex flex-col flex-nowrap text-sm space-y-2">
  <div>
    <h2>Gerarchia</h2>
    <small>
      Fai tap su un blocco per selezionarlo. Trascina e rilascia per riordinare
    </small>
  </div>
  <div class="grid grid-flow-col">
    <div
      class="flex flex-col justify-center items-center p-2 rounded-xl bg-[#2a2a2a] col-span-1"
    >
      <svg
        width="46"
        height="46"
        fill="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0Zm4.5 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"
        ></path>
        <path
          d="m12 20.38-4.2-4.192-1.05 1.065 5.25 5.25 5.25-5.25-1.058-1.058L12 20.38Z"
        ></path>
        <path
          d="M12 3.623 16.185 7.8l1.065-1.05L12 1.5 6.75 6.75l1.058 1.058L12 3.622Z"
        ></path>
      </svg>
    </div>

    <notify-hierarchy
      class="col-span-11"
      [hierarchy]="hierarchy || []"
      [requiredItems]="requiredItems || []"
      [selectedHierarchyItem]="selectedHierarchyItem"
      (hierarchyChanged)="hierarchyChanged.emit($event)"
      [redirectEnabled]="profile.config.redirectEnabled"
      (selectedHierarchyItemChanged)="selectedHierarchyItemChanged.emit($event)"
    ></notify-hierarchy>
  </div>
</div>
