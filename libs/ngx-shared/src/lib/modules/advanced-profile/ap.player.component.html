<div
  class="w-full h-full"
  notify-ap-player-page
  *ngIf="advancedProfile?.pageSettings as ps"
  [pageSettings]="ps"
>
  <div
    (click)="
      apItemOutputs.onItemClicked({
        eventName: 'ITEM_CLICKED',
        item: $any({
          _id: 'background'
        })
      })
    "
    class="size-full overflow-y-auto notify-scrollbar scrollbar-absolute"
    [ngClass]="{
      '!pt-14': contained,
    }"
    [ngStyle]="{
      'padding-left': ps.padding + 'rem',
      'padding-right': ps.padding + 'rem',

    }"
  >
    <div
      class="flex flex-col"
      [ngClass]="{
        'min-h-screen': !contained
      }"
    >
      @for (i of advancedProfileItems; track i.data._id) {
      <div
        *ngIf="i.data.visible"
        (click)="$event.stopPropagation()"
        class="mx-2"
        [ngStyle]="{
        'margin-top': verticalSpacing,
        'margin-bottom': verticalSpacing,
        
      }"
      >
        <div
          class="flex flex-col"
          (click)="
            apItemOutputs.onItemClicked({
              item: i.data,
              eventName: 'ITEM_CLICKED'
            })
          "
          [ngClass]="{
            'rounded-lg hover:outline-2 hover:outline-dashed cursor-pointer hover:scale-95 smooth smooth-fast active:scale-90 active:brightness-75':
              !isRunningOnPlayer
          }"
        >
          <div
            class="my-3 mt-0"
            *ngIf="i.data.title?.length && i.data.showTitle"
          >
            <small>
              {{ i.data.title }}
            </small>
            <div class="notify-divider opacity-25 !my-0"></div>
          </div>

          <ng-container
            *ngIf="i.manifest.playerComponent as pc"
            [ngComponentOutlet]="pc"
            [ngComponentOutletInputs]="{
              profile: this.profile,
              currentItem: i.data,
              manifest: i.manifest,
              isRunningOnPlayer,
              environment
            }"
          ></ng-container>
        </div>
      </div>
      }
    </div>
    <div [innerHTML]="footer" *ngIf="!contained" class="my-10"></div>
  </div>
</div>
