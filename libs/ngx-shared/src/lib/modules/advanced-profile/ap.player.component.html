<div
  class="w-full h-full"
  notify-ap-player-background
  *ngIf="advancedProfile?.pageSettings as ps"
  [pageSettings]="ps"
>
  <div
    class="max-h-screen size-full overflow-y-auto flex flex-col notify-scrollbar scrollbar-absolute"
    [ngClass]="{
      '!pt-16 ': contained,
      '': !contained
    }"
    [ngStyle]="{
      'padding-left': ps.padding + 'rem',
      'padding-right': ps.padding + 'rem',

    }"
  >
    @for (i of advancedProfileItems; track i.data._id) {

    <div
      class="flex flex-col"
      *ngIf="i.data.visible"
      [ngStyle]="{
        'margin-top': this.verticalSpacing,
        'margin-bottom': this.verticalSpacing,
      }"
    >
      <div class="my-3 mt-0" *ngIf="i.data.title?.length && i.data.showTitle">
        <small>
          {{ i.data.title }}
        </small>
        <div class="notify-divider opacity-25 !my-0"></div>
      </div>

      <ng-container
        *ngIf="i.manifest.playerComponent as pc"
        [ngComponentOutlet]="pc"
        [ngComponentOutletInputs]="{
          profile: this.profile,
          currentItem: i.data,
          manifest: i.manifest
        }"
      ></ng-container>
    </div>
    }
    <div [innerHTML]="footer" class="pb-3"></div>
  </div>
</div>
