<div class="h-full">
  <notify-search-bar
    [array$]="availableItems$"
    (filteredArray)="availableItems = $event"
    [filterableFields]="['label', 'type']"
    helpLabel=""
    placeholder="Cerca..."
    inputClass=" w-full rounded-lg input text-xs bg-[#191C21]/80 !h-10 mt-1 !pl-12"
  ></notify-search-bar>

  <div
    class="flex flex-col h-60 lg:h-32 2xl:h-60 overflow-y-auto notify-scrollbar lg:px-2"
  >
    @if (availableItems.length) { @for (item of availableItems; track $index) {
    <button
      (click)="emitAddItem(item.type)"
      class="item-button group/btn available-item"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-5 text-[#202020] text-current"
      >
        @for (path of item.icon; track $index) {
        <path fill-rule="evenodd" [attr.d]="path" clip-rule="evenodd" />
        }
      </svg>
      <span>{{ item.label }}</span>
    </button>
    } } @else { @for (item of availableItemsSkeleton; track $index) {
    <button
      class="item-button group/btn available-item animate-pulse"
      [ngStyle]="{ 'animation-delay': ($index + 1) / 3 + 's' }"
    ></button>
    } }
  </div>
</div>
