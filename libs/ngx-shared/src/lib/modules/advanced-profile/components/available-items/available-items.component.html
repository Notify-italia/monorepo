<div class="w-full h-full flex flex-col">
  <notify-search-bar
    [array$]="availableItems$"
    (filteredArray)="availableItems = $event"
    [filterableFields]="['label', 'type']"
    helpLabel=""
    placeholder="Cerca..."
    inputClass=" w-full rounded-lg input text-xs bg-[#202020] !h-10 mt-1 !pl-12"
  ></notify-search-bar>

  <div
    class="flex flex-col justify-start space-y-4 h-fit mb-10 overflow-y-auto mt-2"
  >
    @for (item of availableItems; track $index) {
    <button class="item-button group/btn smooth smooth-faster">
      <div class="flex items-center space-x-4">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-6 h-6"
        >
          @for (path of item.icon; track $index) {
          <path fill-rule="evenodd" [attr.d]="path" clip-rule="evenodd" />
          }
        </svg>
        <span>{{ item.label }}</span>
      </div>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6 opacity-0 group-hover/btn:opacity-100 group-active/btn:!opacity-0"
      >
        <path
          fill-rule="evenodd"
          d="M12 3.75a.75.75 0 0 1 .75.75v6.75h6.75a.75.75 0 0 1 0 1.5h-6.75v6.75a.75.75 0 0 1-1.5 0v-6.75H4.5a.75.75 0 0 1 0-1.5h6.75V4.5a.75.75 0 0 1 .75-.75Z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
    <!-- <div class="divider last:hidden mx-4"></div> -->
    }
  </div>
</div>
