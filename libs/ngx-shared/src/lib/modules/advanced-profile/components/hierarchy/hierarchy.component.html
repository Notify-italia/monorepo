<div class="flex flex-col items-start w-full !text-sm">
  <ng-container
    [ngTemplateOutlet]="HierarchyItem"
    [ngTemplateOutletContext]="{
      item: {
        label: 'Sfondo',
        _id: 'background',
        visible: true
      },
      noLines: true
    }"
  ></ng-container>
  <div
    class="flex flex-col items-start mx-2"
    cdkDropList
    (cdkDropListDropped)="dropMainList($event)"
  >
    @if(hierarchyItems.length) { @for (item of hierarchyItems;let i = $index;
    track i) {
    <div
      cdkDrag
      class="cdkDrag w-full h-full overflow-y-hidden overflow-x-clip px-3"
    >
      <ng-container
        [ngTemplateOutlet]="HierarchyItem"
        [ngTemplateOutletContext]="{item, i}"
      ></ng-container>
    </div>
    } } @else {
    <small class="text-[#8C8C8C] mx-2 px-1 border-l hierarchy-line">
      Nessun elemento
    </small>
    }
  </div>

  <ng-container
    [ngTemplateOutlet]="HierarchyItem"
    [ngTemplateOutletContext]="{
      item: {
        label: 'Impostazioni',
        _id: 'footer',
        visible: true
      },
      noLines: true
    }"
  ></ng-container>

  <ng-template #HierarchyItem let-item="item" let-noLines="noLines" let-i="i">
    <button
      class="flex w-full border-l hierarchy-line items-start"
      [ngClass]="{
        'border-l-0': noLines
      }"
    >
      @if(item.subItems?.length) {
      <div
        class="h-5 w-5 flex p-0.5 border rounded hierarchy-line shrink-0 -ml-2.5 mt-2 items-center bg-[#141416]"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-5 h-5"
          [ngClass]="{
            'rotate-90': item._id === selectedHierarchyItem
          }"
        >
          <path
            fill-rule="evenodd"
            d="M16.28 11.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 0 1-1.06-1.06L14.69 12 7.72 5.03a.75.75 0 0 1 1.06-1.06l7.5 7.5Z"
            clip-rule="evenodd"
          />
        </svg>
      </div>
      } @else {
      <div
        class="w-2 border-b h-1 hierarchy-line mt-3.5"
        *ngIf="!noLines"
      ></div>
      }

      <div class="flex flex-col w-full">
        <button
          (click)="item._id ? selectHierarchyItem(item._id) : undefined"
          class="item-button !font-normal group/btn item-noactive space-x-3 !justify-start truncate"
          [ngClass]="{
            'selected-item': item._id && item._id === selectedHierarchyItem,
            'opacity-25': !item.visible
          }"
        >
          <svg
            *ngIf="item.icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            @for (path of item.icon; track $index) {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              [attr.d]="path"
            />
            }
          </svg>
          <span>{{ item.label }}</span>
        </button>

        <div
          *ngIf="item._id === selectedHierarchyItem && item.subItems?.length"
          class="flex-col items-start ml-6 flex"
          cdkDropList
          (cdkDropListDropped)="dropSubList($event, i)"
        >
          @for (subitem of item.subItems; track $index) {
          <div cdkDrag class="cdkDrag overflow-hidden w-full">
            <ng-container
              [ngTemplateOutlet]="HierarchyItem"
              [ngTemplateOutletContext]="{ item: subitem, }"
            ></ng-container>
          </div>
          }
        </div>
      </div>
    </button>
  </ng-template>
</div>
