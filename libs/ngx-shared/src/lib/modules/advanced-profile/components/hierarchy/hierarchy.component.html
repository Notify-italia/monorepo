<div class="flex flex-col items-stretch w-full !text-sm">
  <ng-container
    [ngTemplateOutlet]="HierarchyItem"
    [ngTemplateOutletContext]="{
      item: {
        label: 'Pagina',
        _id: 'background',
        visible: true
      },
      noLines: true
    }"
  ></ng-container>
  <div
    class="flex flex-col items-start mx-2"
    cdkDropList
    (cdkDropListDropped)="dropMainList($event)"
  >
    @if(hierarchyItems.length) { @for (item of hierarchyItems;let i = $index;
    track i) {
    <div
      cdkDrag
      class="cdkDrag w-full lg:h-full overflow-y-hidden overflow-x-clip px-3"
    >
      <ng-container
        [ngTemplateOutlet]="HierarchyItem"
        [ngTemplateOutletContext]="{item, i}"
      ></ng-container>
    </div>
    } } @else {
    <small class="text-[#8C8C8C] mx-2 px-1 border-l hierarchy-line">
      Nessun blocco
    </small>
    }
  </div>

  <ng-template #HierarchyItem let-item="item" let-noLines="noLines" let-i="i">
    <button
      class="flex w-full border-l hierarchy-line items-start"
      [ngClass]="{
        'border-l-0': noLines
      }"
    >
      @if(item.subItems?.length) {
      <div
        class="h-5 w-5 flex p-0.5 border rounded hierarchy-line shrink-0 -ml-2.5 mt-2 items-center bg-[#141416] rotate-90 lg:rotate-0"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-5 h-5"
          [ngClass]="{
            'rotate-90': item._id === selectedHierarchyItem
          }"
        >
          <path
            fill-rule="evenodd"
            d="M16.28 11.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 0 1-1.06-1.06L14.69 12 7.72 5.03a.75.75 0 0 1 1.06-1.06l7.5 7.5Z"
            clip-rule="evenodd"
          />
        </svg>
      </div>
      } @else {
      <div
        class="w-2 border-b h-1 hierarchy-line mt-3.5 pr-2.5"
        *ngIf="!noLines"
      ></div>
      }

      <div class="flex flex-col w-full h-full">
        <button
          (click)="item._id ? selectHierarchyItem(item._id) : undefined"
          class="item-button !font-normal group/btn item-noactive space-x-3 !justify-start truncate !pr-0 w-full"
          [ngClass]="{
            'selected-item': item._id && item._id === selectedHierarchyItem,
            'opacity-25': !item.visible
          }"
        >
          <svg
            *ngIf="item.icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5 shrink-0"
          >
            @for (path of item.icon; track $index) {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              [attr.d]="path"
            />
            }
          </svg>
          <span>{{ item.label }}</span>
          <div class="flex w-full justify-end opacity-70" *ngIf="item.required">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="w-4 h-4"
            >
              <path
                fill-rule="evenodd"
                d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z"
                clip-rule="evenodd"
              />
            </svg>
          </div>
        </button>

        @if(item.subItems?.length) {
        <div
          [ngClass]="{
            'lg:opacity-100 lg:h-auto': item._id === selectedHierarchyItem
          }"
          class="flex-col flex items-start ml-6 lg:opacity-0 lg:h-0"
          cdkDropList
          (cdkDropListDropped)="dropSubList($event, i)"
        >
          @for (subitem of item.subItems; track $index) {
          <div
            cdkDrag
            class="cdkDrag overflow-hidden w-full"
            [ngClass]="{
              'opacity-25': !item.visible
            }"
          >
            <ng-container
              [ngTemplateOutlet]="HierarchyItem"
              [ngTemplateOutletContext]="{ item: subitem, }"
            ></ng-container>
          </div>
          }
        </div>
        }
      </div>
    </button>
  </ng-template>
</div>
