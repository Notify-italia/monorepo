<!-- <pre>{{ form.controls?.['items']?.value | json }}</pre> -->

<div *ngIf="currentItem as item" class="p-2 pt-0">
  <form [formGroup]="item.form" class="flex flex-col space-y-4">
    <div
      class="flex space-x-2 tooltip-bottom text-sm"
      [ngClass]="{
        tooltip: isRequired
      }"
      data-tip="Elemento obbligatorio"
    >
      <button
        class="btn btn-error btn-outline w-full btn-sm shrink disabled:!bg-transparent"
        data-theme="notifytheme"
        (click)="deleteItem()"
        [disabled]="isRequired"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-5 h-5"
        >
          <path
            fill-rule="evenodd"
            d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z"
            clip-rule="evenodd"
          />
        </svg>

        <span>Elimina</span>
      </button>

      <notify-tailwind-checkbox
        [parent]="item.form"
        name="visible"
        [compact]="true"
        [disabled]="isRequired"
        label=" "
        [overrideToggleIcon]="showHiddenToggleWithButton"
      ></notify-tailwind-checkbox>
    </div>
    <div
      class="w-full smooth"
      [ngClass]="{
        'opacity-50 pointer-events-none scale-90 ':
          !item.form.get('visible')?.value
      }"
    >
      <div class="flex items-end space-x-2 relative">
        <notify-tailwind-input
          [parent]="item.form"
          name="title"
          label="Titolo elemento"
          [compact]="true"
          class="w-full"
          [maxLength]="30"
          [showClearInput]="false"
          [placeholder]="item.manifest.localizedName || 'Titolo'"
        ></notify-tailwind-input>
        <notify-tailwind-checkbox
          [parent]="item.form"
          name="showTitle"
          label=" "
          [disabled]="!item.form.get('title')?.value"
          class="mb-2 absolute right-2"
          [overrideToggleIcon]="showHiddenToggle"
        ></notify-tailwind-checkbox>
      </div>
      @if(item.manifest.formComponent; as cf) {

      <div class="divider"></div>
      <ng-container
        [ngComponentOutlet]="cf"
        [ngComponentOutletInputs]="{
          form: item.form,
          manifest: item.manifest,
          formContext: form,
          isRequired: isRequired,
          profile,
        }"
      ></ng-container>
      }
    </div>
    <pre>{{ item.form.value | json }}</pre>
  </form>
</div>
