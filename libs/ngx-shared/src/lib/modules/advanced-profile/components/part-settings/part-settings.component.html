<div class="p-2 px-1.5 text-white">
  <notify-page-form
    *ngIf="selectedHierarchyItem === 'background'"
    [profile]="profile"
    [form]="form"
    [environment]="environment"
    (profileIdentifierChanged)="profileIdentifierChanged.emit($event)"
  ></notify-page-form>

  @if(currentItem; as item) {
  <form
    *ngIf="settingsHostVisible"
    [formGroup]="item.form"
    class="flex flex-col space-y-4"
    [ngClass]="{
      'pointer-events-none opacity-50': profile.config.redirectEnabled
    }"
  >
    <div
      class="flex space-x-2 tooltip-bottom text-sm justify-end"
      [ngClass]="{
        tooltip: isRequired
      }"
      data-tip="Blocco obbligatorio"
    >
      <notify-confirm-button
        [disabled]="isRequired"
        [compact]="true"
        (confirm)="deleteItem()"
      ></notify-confirm-button>

      <notify-tailwind-checkbox
        [parent]="item.form"
        name="visible"
        [compact]="true"
        [disabled]="isRequired"
        label=" "
        [overrideToggleIcon]="showHiddenToggleWithButton"
      ></notify-tailwind-checkbox>
    </div>
    <div
      class="w-full smooth flex flex-col space-y-4"
      [ngClass]="{
        'opacity-50 pointer-events-none scale-90 ':
          !item.form.get('visible')?.value
      }"
    >
      <div
        class="flex items-end space-x-2 relative"
        *ngIf="!item.manifest.formOptions?.hideTitle"
      >
        <notify-tailwind-input
          [parent]="item.form"
          name="title"
          label="Titolo elemento"
          [compact]="true"
          class="w-full"
          [maxLength]="40"
          [showClearInput]="false"
          [placeholder]="item.manifest.localizedName || 'Titolo'"
        ></notify-tailwind-input>
        <notify-tailwind-checkbox
          [parent]="item.form"
          name="showTitle"
          label=" "
          [disabled]="!item.form.get('title')?.value"
          class="mb-2 absolute right-2"
          [overrideToggleIcon]="showHiddenToggle"
        ></notify-tailwind-checkbox>
      </div>

      @if (!item.manifest.formOptions?.hideTextSettings) {
      <div
        class="flex flex-col space-y-2 smooth"
        *ngIf="item.form.controls.textConfig as tc"
      >
        <notify-tailwind-checkbox
          [compact]="true"
          [parent]="tc"
          name="enabled"
          label="Personalizza stile"
        ></notify-tailwind-checkbox>

        <div
          class="h-40 smooth flex flex-col space-y-2 px-4"
          [ngClass]="{
            'opacity-0 pointer-events-none -translate-y-2 !h-0 ':
              !tc.get('enabled')?.value,
            
          }"
        >
          <button
            class="btn btn-sm smooth"
            (click)="syncStyleWithPage()"
            [disabled]="areStylesSynced"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"
              />
            </svg>
            <span>Sincronizza col profilo</span>
          </button>

          <div class="flex justify-around space-x-2 items-center">
            <notify-icon-selector
              [iconSet]="fontsIconSet"
              [icon]="
                item.form.value.textConfig?.font ||
                form.value?.pageSettings?.font
              "
              title="Carattere"
              [openSelectorOnBoot]="false"
              [showIconLabel]="true"
              iconLabelPosition="right"
              (iconChange)="setFont($event.new?.name || 'poppins')"
            ></notify-icon-selector>
            <notify-tailwind-color-picker
              [parent]="tc"
              name="textColor"
              class="w-7/12"
              [compact]="true"
            ></notify-tailwind-color-picker>
          </div>

          <notify-tailwind-slider
            [parent]="tc"
            name="fontSize"
            [compact]="true"
            [steps]="fontSizeSettings.steps"
            [min]="fontSizeSettings.min"
            [max]="fontSizeSettings.max"
            [label]="fontSizeSettings.label"
            [stepsLabels]="{
              stepSuffix: fontSizeSettings.stepSuffix,
              showCurrentStep: true,
              stepPosition: 'bottom'
            }"
          ></notify-tailwind-slider>
        </div>
      </div>

      <div class="divider"></div>

      } @if(item.manifest.formComponent; as cf) {
      <ng-container
        [ngComponentOutlet]="cf"
        [ngComponentOutletInputs]="{
          form: item.form,
          manifest: item.manifest,
          formContext: form,
          profile,
          environment
        }"
      ></ng-container>
      } @else {
      <div
        class="h-full flex flex-col justify-center items-center w-full text-sm mt-4"
      >
        Nessuna impostazione disponibile
      </div>
      }
    </div>
  </form>
  }
</div>
