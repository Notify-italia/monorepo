<div class="flex flex-col justify-center h-[99vh]">
  <div class="flex right-0 absolute h-full overflow-y-auto z-[9999] bg-black">
    <!-- <pre>{{ form?.value | json }}</pre> -->
  </div>
  <div class="root-element">
    @if(profile$ | async; as profile) {
    <div class="flex justify-between size-full items-stretch">
      <notify-left-panel
        [hierarchy]="form?.value.items || []"
        [requiredItems]="requiredItems"
        (addItem)="addItem($event)"
        [selectedHierarchyItem]="selectedHierarchyItem"
        (hierarchyChanged)="hierarchyChanged($event)"
        (selectedHierarchyItemChanged)="selectedHierarchyItem = $event"
      ></notify-left-panel>

      <div
        class="size-full flex flex-col justify-center items-center 2xl:my-auto"
      >
        <notify-profile-view
          [data]="
            $any({
              advancedProfile: form?.value,
              type: profile.type,
              company: profile.company,
            })
          "
          [mockup]="true"
          [isRunningOnPlayer]="false"
          class="iphone-15-pro scale-75 2xl:scale-100"
        ></notify-profile-view>
      </div>
      <notify-right-panel
        [loading]="loading"
        [profile]="profile"
        [form]="form"
        [selectedHierarchyItem]="selectedHierarchyItem"
        [environment]="environment"
      ></notify-right-panel>
    </div>
    } @else {
    <div class="h-[97vh]">
      <notify-loading></notify-loading>
    </div>
    }
  </div>
</div>
