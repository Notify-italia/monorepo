<div class="flex flex-col justify-center h-[85vh] lg:h-[99vh] relative">
  <div class="root-element">
    @if(profile$ | async; as profile) {

    <div
      class="flex flex-col lg:flex-row justify-between size-full items-stretch"
    >
      <notify-info-panel
        class="mobile-only z-[999]"
        [loading]="loading"
        [profile]="profile"
        [form]="form"
        [selectedHierarchyItem]="selectedHierarchyItem"
        [environment]="environment"
        (forceSave)="saveProfile(form?.value)"
        (closePanel)="selectedHierarchyItem = ''"
        (removeItem)="removeItem($event)"
      ></notify-info-panel>

      <notify-add-item-button
        class="mobile-only"
        (addItem)="addItem($event)"
      ></notify-add-item-button>

      <notify-left-panel
        class="desktop-only"
        [hierarchy]="form?.value.items || []"
        [requiredItems]="requiredItems"
        (addItem)="addItem($event)"
        [selectedHierarchyItem]="selectedHierarchyItem"
        (hierarchyChanged)="hierarchyChanged($event)"
        (selectedHierarchyItemChanged)="selectedHierarchyItem = $event"
        (toggleReviewProfile)="toggleProfileRedirect($event, profile)"
        [profile]="profile"
      ></notify-left-panel>

      <div
        class="size-full flex flex-col justify-center items-center 2xl:my-auto"
      >
        @if(profile.config.redirectEnabled) {
        <div
          class="flex scale-90 lg:scale-75 2xl:scale-100 top-10 flex-col h-fit w-full"
          *ngIf="profile.config.redirectEnabled"
        >
          <iframe
            [cachedSrc]="
              normalizeURL(
                form?.value?.pageSettings?.redirectUrl || profile.redirectUrl
              )
            "
            class="iphone-15-pro phone mockup-phone pointer-events-none"
            frameborder="0"
          ></iframe>
          <small class="w-full text-center mx-auto">
            Alcuni siti web potrebbero non essere visualizzati correttamente
          </small>
        </div>
        } @else {
        <notify-profile-view
          [data]="
            $any({
              advancedProfile: form?.value,
              type: profile.type,
              company: profile.company,
            })
          "
          [mockup]="true"
          [isRunningOnPlayer]="false"
          class="iphone-15-pro scale-50 lg:scale-75 2xl:scale-100"
        ></notify-profile-view>
        }
      </div>

      <notify-right-panel
        class="desktop-only"
        [loading]="loading"
        [profile]="profile"
        [form]="form"
        [selectedHierarchyItem]="selectedHierarchyItem"
        [environment]="environment"
        (forceSave)="saveProfile(form?.value)"
        (removeItem)="removeItem($event)"
      ></notify-right-panel>
    </div>
    } @else {
    <div class="h-[97vh]">
      <notify-loading></notify-loading>
    </div>
    }
  </div>
</div>
