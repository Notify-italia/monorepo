<div class="flex flex-col justify-center h-[99vh]">
  <div class="root-element">
    @if(profile$ | async; as profile) {
    <div class="flex justify-between size-full items-stretch">
      <notify-left-panel [profile]="profile"></notify-left-panel>

      <div
        class="size-full flex flex-col justify-center items-center 2xl:my-auto"
      >
        <notify-profile-view
          [data]="profile"
          [mockup]="true"
          class="iphone-15-pro shrink-0 grow-0 scale-75 2xl:scale-100"
        ></notify-profile-view>
      </div>
      <notify-right-panel
        [loading]="loading"
        [profile]="profile"
        [baseUrl]="environment.profilesUrl"
      ></notify-right-panel>
    </div>
    } @else {
    <div class="h-[97vh]">
      <notify-loading></notify-loading>
    </div>
    }
  </div>
</div>
