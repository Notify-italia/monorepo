<div
  class="flex flex-col justify-center xs:h-[85vh] sm:h-[90vh] lg:h-[99vh] relative"
>
  <div class="root-element mt-2 lg:mt-auto">
    @if(profile$ | async; as profile) {

    <div class="mobile-only-flex flex-col">
      <notify-info-panel
        class="mobile-only"
        [loading]="loading"
        [profile]="profile"
        [form]="form"
        [selectedHierarchyItem]="selectedHierarchyItem"
        [environment]="environment"
        (forceSave)="saveProfile(form?.value)"
        (closePanel)="selectedHierarchyItem = ''"
        (removeItem)="removeItem($event)"
      ></notify-info-panel>
      <notify-share-item
        *ngIf="shareConfig"
        [config]="shareConfig"
        [compact]="true"
      ></notify-share-item>
      <notify-save-indicator
        [isSaving]="loading"
        [lastSave]="profile.updatedAt"
        [compact]="true"
      ></notify-save-indicator>

      <div class="divider"></div>

      <notify-redirect-toggle-button
        [redirectEnabled]="profile.config.redirectEnabled"
        (toggleProfileRedirect)="toggleProfileRedirect($event, profile)"
      ></notify-redirect-toggle-button>
      <notify-add-item-button
        class="w-full my-2"
        (addItem)="addItem($event)"
      ></notify-add-item-button>

      <notify-hierarchy-button
        class="h-full"
        [hierarchy]="form?.value.items || []"
        [requiredItems]="requiredItems"
        (addItem)="addItem($event)"
        [selectedHierarchyItem]="selectedHierarchyItem"
        (hierarchyChanged)="hierarchyChanged($event)"
        (selectedHierarchyItemChanged)="selectedHierarchyItem = $event"
        (toggleReviewProfile)="toggleProfileRedirect($event, profile)"
        [profile]="profile"
      ></notify-hierarchy-button>
    </div>

    <div
      class="flex flex-col lg:flex-row justify-between size-full items-stretch desktop-only-flex"
    >
      <notify-left-panel
        [hierarchy]="form?.value.items || []"
        [requiredItems]="requiredItems"
        (addItem)="addItem($event)"
        [selectedHierarchyItem]="selectedHierarchyItem"
        (hierarchyChanged)="hierarchyChanged($event)"
        (selectedHierarchyItemChanged)="selectedHierarchyItem = $event"
        (toggleProfileRedirect)="toggleProfileRedirect($event, profile)"
        [profile]="profile"
      ></notify-left-panel>

      <div
        class="size-full flex flex-col justify-center items-center 2xl:my-auto -mt-16"
      >
        @if(profile.config.redirectEnabled) {
        <div
          class="flex top-10 flex-col h-fit w-full"
          *ngIf="profile.config.redirectEnabled"
        >
          <iframe
            [cachedSrc]="
              normalizeURL(
                form?.value?.pageSettings?.redirectUrl || profile.redirectUrl
              )
            "
            class="iphone-15-pro phone mockup-phone pointer-events-none mockup-responsive"
            frameborder="0"
          ></iframe>
          <small class="w-full text-center mx-auto">
            Alcuni siti web potrebbero non essere visualizzati correttamente
          </small>
        </div>
        } @else {
        <notify-profile-view
          [data]="
            $any({
              advancedProfile: form?.value,
              type: profile.type,
              company: profile.company,
              _id: profile._id,
              owner: profile.owner
            })
          "
          [mockup]="true"
          [isRunningOnPlayer]="false"
          class="iphone-15-pro mockup-responsive"
        ></notify-profile-view>
        }
      </div>

      <notify-right-panel
        *ngIf="shareConfig"
        [loading]="loading"
        [profile]="profile"
        [form]="form"
        [shareConfig]="shareConfig"
        [selectedHierarchyItem]="selectedHierarchyItem"
        [environment]="environment"
        (forceSave)="saveProfile(form?.value)"
        (removeItem)="removeItem($event)"
      ></notify-right-panel>
    </div>

    <div class="fixed bottom-5 right-5 lg:hidden z-50 mobile-only">
      <button
        class="floating-button"
        (click)="showProfile(profile)"
        [disabled]="loading"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-6 h-6"
        >
          <path
            fill-rule="evenodd"
            d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
    } @else {
    <div class="h-[97vh]">
      <notify-loading></notify-loading>
    </div>
    }
  </div>
</div>
