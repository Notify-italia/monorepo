<button
  class="box w-full p-5 hover:cursor-pointer hover:brightness-150 text-start smooth"
  (click)="clicked.emit()"
>
  <div class="flex justify-between items-center">
    <div class="flex items-center space-x-5">
      <notify-device-icon [deviceType]="user.deviceType"></notify-device-icon>
      <div class="flex flex-col space-y-1">
        <h1 class="font-bold truncate text-white">
          {{ user.device }} | {{ user.browser }}
        </h1>
        <div>
          <p class="text-sm">
            {{ user.connectionTimestamp | date : 'dd/MM/yyyy HH:mm' }}
          </p>

          <p class="text-xs opacity-75">
            {{ user.id }}
          </p>
        </div>
      </div>
    </div>
    <div>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z"
        />
      </svg>
    </div>
  </div>
</button>
