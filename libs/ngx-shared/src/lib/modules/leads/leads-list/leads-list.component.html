<div class="page-layout h-[90vh] lg:h-[95vh] notify-scrollbar" #MainContainer>
  <notify-page-header
    title="Contatti"
    subtitle="Visualizza e gestisci i coontatti ottenuti tramite digitalizzazione o form di contato"
    [buttons]="availableButtons"
    (buttonClicked)="scanBusinessCard()"
  ></notify-page-header>
  <div class="h-full">
    <div class="h-full">
      <notify-search-bar
        placeholder="Cerca tramite nome, email, telefono, social ecc..."
        helpLabel="Cerca contatto"
        [array$]="leadsSubject$"
        (filteredArray)="onFilteredLeadsChange($event)"
        [filterableFields]="[
          'name',
          'emails',
          'phones',
          'socials.name',
          'socials.url',
          'createdBy.email',
          'createdBy.profile.name'
        ]"
      ></notify-search-bar>
      @if(chunkedLeads$ | async; as leads) {

      <div
        infiniteScroll
        [infiniteScrollDistance]="1"
        [infiniteScrollThrottle]="50"
        [scrollWindow]="false"
        (scrolled)="triggerInfiniteScroll()"
        [infiniteScrollContainer]="MainContainer"
        class="flex flex-col lg:flex-row lg:flex-wrap justify-start lg:justify-center"
      >
        @for (lead of leads; track lead._id) {
        <div class="m-2 lg:m-5">
          <notify-lead-card [lead]="lead"></notify-lead-card>
        </div>
        }
      </div>

      } @else {
      <notify-loading></notify-loading>
      }
    </div>
  </div>
</div>

<div
  *ngIf="isScanning"
  class="fixed h-screen w-screen backdrop-brightness-50 top-0 left-0 z-[999] flex flex-col justify-center items-center space-y-6"
>
  <notify-loading></notify-loading>
  <span> Ottengo informazioni...</span>
</div>
