<div
  class="relative"
  [ngStyle]="{
    color: colors['color']
  }"
>
  <div
    class="business-card smooth"
    [ngStyle]="{
      'background-color': colors['background-color'],
      
    }"
  >
    <div
      class="flex justify-between w-full h-1/6 items-center"
      [ngClass]="{
        '!justify-end': !isPerson
      }"
    >
      <div *ngIf="isPerson">{{ lead.company }}</div>
      <div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m8.25 4.5 7.5 7.5-7.5 7.5"
          />
        </svg>
      </div>
    </div>
    <div class="flex flex-col justify-center h-2/6 items-center">
      <span class="text-2xl font-bold">
        {{ mainAlias }}
      </span>
      <span>
        {{ lead.role || '' }}
      </span>
    </div>
    <div class="h-2/6"></div>
  </div>
  <div class="flex justify-between space-x-2 absolute w-full bottom-2 px-2">
    <button
      data-theme="notifytheme"
      class="action-button smooth smooth-fast"
      [disabled]="!mainPhoneNumber"
      (click)="executeCardAction(mainPhoneNumber, 'tel')"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-6"
      >
        <path
          fill-rule="evenodd"
          d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z"
          clip-rule="evenodd"
        />
      </svg>

      <span>Chiama</span>
    </button>
    <button
      data-theme="notifytheme"
      class="action-button smooth smooth-fast"
      [disabled]="!mainEmail"
      (click)="executeCardAction(mainEmail, 'mailto')"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-6"
      >
        <path
          d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z"
        />
        <path
          d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z"
        />
      </svg>

      <span>Invia email</span>
    </button>
  </div>
</div>
