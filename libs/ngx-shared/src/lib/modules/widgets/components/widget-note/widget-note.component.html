<div class="box w-full h-full flex items-center">
  @if (note) {

  <div
    class="flex items-center space-x-4 h-full px-5 w-full smooth hover:brightness-150 cursor-pointer"
    routerLink="/pages/notes/inspect"
    [queryParams]="{ id: note._id }"
  >
    <div
      class="w-8 h-8 rounded-full p-2 shrink-0"
      [ngStyle]="{ 'background-color': note.color }"
    ></div>

    <div class="flex flex-col">
      <h1 class="text-lg font-bold truncate text-white/80 w-full">
        {{ note.title || '‎ ' }}
      </h1>
      <div>
        <p class="text-sm text-gray-400">
          {{ note.items.length || 0 }} elementi |
          {{ note.updatedAt | date : 'short' : '' : 'it' }}
        </p>
      </div>
    </div>
  </div>

  } @else {
  <div class="flex !lex-col !justify-center w-full h-full items-center">
    <div class="flex shrink-0 space-x-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m21 7.5-2.25-1.313M21 7.5v2.25m0-2.25-2.25 1.313M3 7.5l2.25-1.313M3 7.5l2.25 1.313M3 7.5v2.25m9 3 2.25-1.313M12 12.75l-2.25-1.313M12 12.75V15m0 6.75 2.25-1.313M12 21.75V19.5m0 2.25-2.25-1.313m0-16.875L12 2.25l2.25 1.313M21 14.25v2.25l-2.25 1.313m-13.5 0L3 16.5v-2.25"
        />
      </svg>
      <h2>Nessun progetto</h2>
    </div>
  </div>

  }
</div>
