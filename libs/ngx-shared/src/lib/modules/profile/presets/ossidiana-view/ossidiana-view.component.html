<div class="flex justify-center p-4 z-10" *ngIf="isFeedbackEnabled">
  <!-- FEEDBACK -->
  <notify-feedback-button
    [data]="data"
    [cssElementsColor]="cssElementsColor"
    (feedbackClicked)="feedbackClicked.emit()"
    [isAgent]="isAgent"
    [feedbackKey]="feedbackKey"
  ></notify-feedback-button>
</div>
<div class="main-child z-10" [class.opacity-50]="!data">
  <div class="section h-fit w-full space-y-8">
    <div class="section space-y-2">
      <notify-profile-user-info
        [data]="data"
        [cssElementsColor]="cssElementsColor"
        [isAgent]="false"
        (subAvatarClick)="subAvatarClick.emit()"
      ></notify-profile-user-info>

      <!-- STATIC LINKS -->
      <notify-profile-static-links
        [data]="data"
        class="w-full"
        [color]="cssElementsColor"
      ></notify-profile-static-links>
    </div>
  </div>

  <img
    (click)="mockup ? null : subAvatarClick.emit()"
    src="/assets/ossidiana-logo-white.png"
    class="w-full h-full object-contain my-5 cursor-pointer"
  />

  <notify-profile-integrations
    [data]="data?.customFields"
    [color]="cssElementsColor"
    (integrationClicked)="integrationClicked.emit($event)"
  ></notify-profile-integrations>

  <div
    class="section w-full"
    *ngIf="profileService.buildCompanyLocation(data?.address) as p"
  >
    <div
      class="module module-blur !py-2 text-center my-1.5 text-sm"
      [ngStyle]="{ color: cssElementsColor }"
    >
      {{ p | titlecase }}
    </div>
    <notify-google-maps [address]="p" class="!w-[90%]"></notify-google-maps>
  </div>
</div>
