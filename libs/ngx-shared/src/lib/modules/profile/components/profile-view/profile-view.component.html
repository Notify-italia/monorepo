<div
  class="relative font-poppins translate-x-0 !size-full"
  [ngClass]="{
    'mockup-phone border-gray-400 p-2 shrink-0 grow-0':
      mockup,
    
  }"
>
  <!-- MOCKUP FILL -->
  <notify-mockup-fill
    *ngIf="mockup && !data?.advancedProfile?.enabled"
    class="w-full"
  ></notify-mockup-fill>

  @if(!data?.advancedProfile?.enabled) {
  <div
    *ngIf="!isOssidiana && !isNewEra"
    notify-profile-default-view
    class="main-container py-10 pb-20 px-2"
    [ngStyle]="{
      background: 'linear-gradient(' + cssGradientStops + ')'
    }"
    [ngClass]="viewNgClass"
    [cssGradientStops]="cssGradientStops"
    [data]="data"
    [cssElementsColor]="cssElementsColor"
    [isAgent]="isAgent"
    [isFeedbackEnabled]="isFeedbackEnabled"
    [feedbackKey]="environment['feedbackKey']"
    (feedbackClicked)="feedbackClicked.emit()"
    (subAvatarClick)="subAvatarClick.emit()"
    (integrationClicked)="integrationClicked.emit($event)"
  ></div>

  <div
    *ngIf="isOssidiana"
    notify-profile-ossidiana-view
    class="main-container py-10 pb-20 px-2"
    style="
      background: url('/assets/ossidiana-card-bg.png');
      background-size: cover;
    "
    [ngClass]="viewNgClass"
    [cssGradientStops]="cssGradientStops"
    [data]="data"
    [cssElementsColor]="cssElementsColor"
    [isAgent]="isAgent"
    [isFeedbackEnabled]="isFeedbackEnabled"
    [feedbackKey]="environment['feedbackKey']"
    [mockup]="mockup"
    (feedbackClicked)="feedbackClicked.emit()"
    (subAvatarClick)="subAvatarClick.emit()"
    (integrationClicked)="integrationClicked.emit($event)"
  ></div>
  <div
    *ngIf="isNewEra"
    notify-profile-newera-view
    class="main-container py-10 pb-20 px-2"
    [ngStyle]="{
      background: 'linear-gradient(' + cssGradientStops + ')'
    }"
    [ngClass]="viewNgClass"
    [cssGradientStops]="cssGradientStops"
    [data]="data"
    [cssElementsColor]="cssElementsColor"
    [isAgent]="isAgent"
    [isFeedbackEnabled]="isFeedbackEnabled"
    [feedbackKey]="environment['feedbackKey']"
    [mockup]="mockup"
    (feedbackClicked)="feedbackClicked.emit()"
    (subAvatarClick)="subAvatarClick.emit()"
    (integrationClicked)="integrationClicked.emit($event)"
  ></div>
  } @else {
  <div
    *ngIf="data"
    notify-advanced-view
    [data]="data"
    [footer]="footer"
    [mockup]="mockup"
    [environment]="environment"
    [isRunningOnPlayer]="isRunningOnPlayer"
    class="size-full top-0 left-0"
    [class.fixed]="mockup"
  ></div>
  }
</div>
