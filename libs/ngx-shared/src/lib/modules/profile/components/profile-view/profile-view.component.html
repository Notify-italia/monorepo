<div
  class="relative font-poppins"
  [ngClass]="{
    'h-full !w-full mockup-phone ': mockup,
    'min-h-screen w-full ': !mockup
  }"
>
  <!-- MOCKUP FILL -->
  <notify-mockup-fill *ngIf="mockup" class="w-full"></notify-mockup-fill>

  <div
    *ngIf="!isOssidiana && !isNewEra"
    notify-profile-default-view
    class="main-container py-10 pb-20 px-2"
    [ngStyle]="{
      background: 'linear-gradient(' + cssGradientStops + ')'
    }"
    [ngClass]="{
      'display pt-20 ': mockup,
      'h-full  min-h-screen  w-screen': !mockup,
    }"
    [cssGradientStops]="cssGradientStops"
    [data]="data"
    [cssElementsColor]="cssElementsColor"
    [isAgent]="isAgent"
    [isFeedbackEnabled]="isFeedbackEnabled"
    [feedbackKey]="feedbackKey"
    [mockup]="mockup"
    (feedbackClicked)="feedbackClicked.emit()"
    (subAvatarClick)="subAvatarClick.emit()"
    (integrationClicked)="integrationClicked.emit($event)"
  ></div>

  <div
    *ngIf="isOssidiana"
    notify-profile-ossidiana-view
    class="main-container py-10 pb-20 px-2"
    style="
      background: url('/assets/ossidiana-card-bg.png');
      background-size: cover;
    "
    [ngClass]="{
      'display pt-20  ': mockup,
      'h-full min-h-screen  w-screen': !mockup,
    }"
    [cssGradientStops]="cssGradientStops"
    [data]="data"
    [cssElementsColor]="cssElementsColor"
    [isAgent]="isAgent"
    [isFeedbackEnabled]="isFeedbackEnabled"
    [feedbackKey]="feedbackKey"
    [mockup]="mockup"
    (feedbackClicked)="feedbackClicked.emit()"
    (subAvatarClick)="subAvatarClick.emit()"
    (integrationClicked)="integrationClicked.emit($event)"
  ></div>
  <div
    *ngIf="isNewEra"
    notify-profile-newera-view
    class="main-container py-10 pb-20 px-2"
    [ngStyle]="{
      background: 'linear-gradient(' + cssGradientStops + ')'
    }"
    [ngClass]="{
      'display pt-20  ': mockup,
      'h-full min-h-screen  w-screen': !mockup,
    }"
    [cssGradientStops]="cssGradientStops"
    [data]="data"
    [cssElementsColor]="cssElementsColor"
    [isAgent]="isAgent"
    [isFeedbackEnabled]="isFeedbackEnabled"
    [feedbackKey]="feedbackKey"
    [mockup]="mockup"
    (feedbackClicked)="feedbackClicked.emit()"
    (subAvatarClick)="subAvatarClick.emit()"
    (integrationClicked)="integrationClicked.emit($event)"
  ></div>
</div>
