<div
  class="relative font-work"
  [ngClass]="{
    'h-full !w-full mockup-phone': mockup,
    'min-h-screen w-full ': !mockup
  }"
>
  <!-- MOCKUP FILL -->
  <notify-mockup-fill *ngIf="mockup" class="w-full"></notify-mockup-fill>

  <div
    class="main-container py-10 pb-20"
    [ngStyle]="{
      background: 'linear-gradient(' + cssGradientStops + ')'
    }"
    [ngClass]="{
      'display h-full pt-20': mockup,
      'h-full  min-h-screen  w-screen': !mockup,
    }"
  >
    <div class="flex justify-center p-4" *ngIf="isFeedbackEnabled">
      <!-- FEEDBACK -->
      <notify-feedback-button
        [data]="data"
        [cssElementsColor]="cssElementsColor"
        (feedbackClicked)="feedbackClicked.emit($event)"
        [isAgent]="isAgent"
        [feedbackKey]="feedbackKey"
      ></notify-feedback-button>
    </div>
    <div class="main-child" [class.opacity-50]="!data">
      <div class="section h-fit w-full space-y-8">
        <div class="section space-y-2">
          <notify-profile-user-info
            [data]="data"
            [cssElementsColor]="cssElementsColor"
            [isAgent]="isAgent"
            (subAvatarClick)="subAvatarClick.emit()"
          ></notify-profile-user-info>

          <!-- STATIC LINKS -->
          <notify-profile-static-links
            [data]="data"
            class="w-full"
            [color]="cssElementsColor"
          ></notify-profile-static-links>
        </div>
      </div>

      <div class="section w-full mb-2">
        <div class="divider mx-5" *ngIf="data?.customFields?.length"></div>
        <notify-profile-integrations
          class="w-full"
          [data]="data?.customFields"
          [color]="cssElementsColor"
          (integrationClicked)="integrationClicked.emit($event)"
        ></notify-profile-integrations>

        @if (!isAgent) {
        <div
          class="section w-full"
          *ngIf="profileService.buildCompanyLocation(data?.address) as p"
        >
          <div
            class="module module-blur !py-2 text-center my-1.5 text-sm"
            [ngStyle]="{ color: cssElementsColor }"
          >
            {{ p | titlecase }}
          </div>
          <notify-google-maps
            [address]="p"
            class="!w-[90%]"
          ></notify-google-maps>
        </div>
        }
      </div>
    </div>
  </div>
</div>
