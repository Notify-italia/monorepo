<div
  class="relative font-poppins translate-x-0 !size-full"
  [ngClass]="{
    'mockup-phone border-gray-400 !p-0 shrink-0 grow-0':
      mockup,
    
  }"
>
  <!-- MOCKUP FILL -->
  <notify-mockup-fill
    *ngIf="mockup"
    class="w-full"
    [statusBarColor]="mockupThemeColor"
  ></notify-mockup-fill>

  @if(data?.advancedProfile?.enabled) {
  <div
    *ngIf="data"
    notify-advanced-view
    [data]="data"
    [footer]="footer"
    [mockup]="mockup"
    [environment]="environment"
    [isRunningOnPlayer]="isRunningOnPlayer"
    class="size-full top-14 left-0"
    [class.fixed]="mockup"
  ></div>
  } @else {
  <div
    notify-profile-default-view
    class="main-container py-10 pb-20 px-2"
    [ngStyle]="{
      background: 'linear-gradient(' + cssGradientStops + ')'
    }"
    [ngClass]="viewNgClass"
    [cssGradientStops]="cssGradientStops"
    [data]="data"
    [cssElementsColor]="cssElementsColor"
    [isAgent]="isAgent"
    [isFeedbackEnabled]="isFeedbackEnabled"
    [feedbackKey]="environment['feedbackKey']"
    (feedbackClicked)="feedbackClicked.emit()"
    (subAvatarClick)="subAvatarClick.emit()"
    (integrationClicked)="integrationClicked.emit($event)"
  ></div>
  }
</div>
