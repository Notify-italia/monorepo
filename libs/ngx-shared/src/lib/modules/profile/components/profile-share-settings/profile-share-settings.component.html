<div class="modal-container">
  <div>
    <div class="my-1 w-full flex justify-end">
      <button
        class="btn btn-secondary btn-circle btn-ghost"
        data-theme="notifytheme"
        [disabled]="loading"
        (click)="close()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-10 h-10"
        >
          <path
            fill-rule="evenodd"
            d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
    <div class="modal-content">
      <div class="modal-icon">
        <div>
          <div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M9 4.5a.75.75 0 0 1 .721.544l.813 2.846a3.75 3.75 0 0 0 2.576 2.576l2.846.813a.75.75 0 0 1 0 1.442l-2.846.813a3.75 3.75 0 0 0-2.576 2.576l-.813 2.846a.75.75 0 0 1-1.442 0l-.813-2.846a3.75 3.75 0 0 0-2.576-2.576l-2.846-.813a.75.75 0 0 1 0-1.442l2.846-.813A3.75 3.75 0 0 0 7.466 7.89l.813-2.846A.75.75 0 0 1 9 4.5ZM18 1.5a.75.75 0 0 1 .728.568l.258 1.036c.236.94.97 1.674 1.91 1.91l1.036.258a.75.75 0 0 1 0 1.456l-1.036.258c-.94.236-1.674.97-1.91 1.91l-.258 1.036a.75.75 0 0 1-1.456 0l-.258-1.036a2.625 2.625 0 0 0-1.91-1.91l-1.036-.258a.75.75 0 0 1 0-1.456l1.036-.258a2.625 2.625 0 0 0 1.91-1.91l.258-1.036A.75.75 0 0 1 18 1.5ZM16.5 15a.75.75 0 0 1 .712.513l.394 1.183c.15.447.5.799.948.948l1.183.395a.75.75 0 0 1 0 1.422l-1.183.395c-.447.15-.799.5-.948.948l-.395 1.183a.75.75 0 0 1-1.422 0l-.395-1.183a1.5 1.5 0 0 0-.948-.948l-1.183-.395a.75.75 0 0 1 0-1.422l1.183-.395c.447-.15.799-.5.948-.948l.395-1.183A.75.75 0 0 1 16.5 15Z"
                clip-rule="evenodd"
              />
            </svg>
          </div>
        </div>
        <h2>Personalizza questo URL</h2>
        <p>
          è importante avere un URL iconico e facile da ricordare per il tuo
          profilo Notify!
        </p>
        <div class="divider"></div>
      </div>

      <div class="flex flex-col justify-center h-full mt-3 w-full">
        <form
          [formGroup]="form"
          (submit)="submit()"
          class="w-full flex flex-col justify-center items-center space-y-4 relative"
        >
          <notify-tailwind-input
            [prefix]="displayFriendlyUrl"
            name="profileIdentifier"
            [placeholder]="profile._id"
            label=" "
            [showClearInput]="false"
            [parent]="form"
            [validationErrors]="validationErrors"
            class="w-full"
          ></notify-tailwind-input>
          <div class="absolute right-3 top-0">
            <ng-container
              *ngIf="!valid"
              [ngTemplateOutlet]="None"
            ></ng-container>
            <ng-container
              *ngIf="valid === 'error'"
              [ngTemplateOutlet]="Error"
            ></ng-container>
            <ng-container
              *ngIf="valid === 'pending'"
              [ngTemplateOutlet]="Pending"
            ></ng-container>
            <ng-container
              *ngIf="valid === 'success'"
              [ngTemplateOutlet]="Success"
            ></ng-container>
          </div>
          <div class="divider"></div>
          <div class="flex justify-end items-center w-full">
            <button
              class="btn btn-primary w-full"
              [disabled]="
                !form.valid ||
                !form.dirty ||
                !this.trimmedProfileIdentifier ||
                ['pending', 'error', ''].includes(valid)
              "
              data-theme="notifytheme"
              type="submit"
            >
              @if(loading) {
              <span class="loading loading-spinner"></span>
              } @else {
              <span> Conferma </span>}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<ng-template #Error>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2"
    class="{{ iconClass }} text-red-500"
  >
    <path
      fill-rule="evenodd"
      d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
      clip-rule="evenodd"
    />
  </svg>
</ng-template>

<ng-template #Pending>
  <div class="relative">
    <div
      class="animate-spin inline-block {{
        iconClass
      }} border-[3px] border-current border-t-transparent text-yellow-500 rounded-full animate-slower"
      role="status"
      aria-label="loading"
    >
      <span class="sr-only">Loading...</span>
    </div>
    <div class="center absolute h-full w-full top-0">
      <div class="rounded-full p-1 h-1 w-1 bg-yellow-500 mb-[0.4rem]"></div>
    </div>
    <div class="center absolute h-full w-full top-0">
      <div
        class="rounded-full p-1 h-1 w-1 bg-yellow-500 mb-[0.4rem] animate-ping"
      ></div>
    </div>
  </div>
</ng-template>

<ng-template #Success>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="2"
    class="{{ iconClass }} text-green-500"
  >
    <path
      fill-rule="evenodd"
      d="M19.916 4.626a.75.75 0 01.208 1.04l-9 13.5a.75.75 0 01-1.154.114l-6-6a.75.75 0 011.06-1.06l5.353 5.353 8.493-12.739a.75.75 0 011.04-.208z"
      clip-rule="evenodd"
    />
  </svg>
</ng-template>

<ng-template #None>
  <div class="{{ iconClass }}"></div>
</ng-template>
