<div class="rating">
  <input
    *ngIf="rating === 0"
    type="radio"
    name="rating-10"
    class="hidden absolute pointer-events-none"
    [checked]="true"
  />
  @for (item of availableItems; track rating) {

  <input
    #ItemInput
    type="radio"
    name="rating-8 "
    class="mask mask-star-2 {{ colorClass }} mx-1"
    [checked]="rating >= item.value"
    (change)="setRating(item.value)"
    [ngStyle]="{
      width: starSize + 'rem',
      height: starSize + 'rem'
    }"
  />

  }
</div>
