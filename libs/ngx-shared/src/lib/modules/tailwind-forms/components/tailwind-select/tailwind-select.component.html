<div [formGroup]="parent" class="mb-4">
  <label [for]="name" class="block text-sm font-medium" id="select-label">
    {{ label | titlecase }}
  </label>
  <div class="relative mt-1">
    <select
      [id]="name"
      [name]="name"
      [formControlName]="name"
      class="select select-bordered w-full text-sm input-style"
      [ngClass]="{
        'border-red-500 text-red-900 focus:border-red-500 focus:ring-red-500':
          showValidationErrors,

        '!text-gray-500': !value?.length
      }"
    >
      <option value="" class="">{{ placeholder }}</option>
      <option
        *ngFor="let option of options"
        [selected]="false"
        [value]="option.value"
      >
        {{ option.name }}
      </option>
    </select>
  </div>

  <p
    class="mt-2 text-sm text-red-600 absolute"
    [id]="name + '-error'"
    *ngIf="showValidationErrors"
  >
    {{ validationErrorMessage }}
  </p>
</div>
