<div
  class="modal-container overflow-y-auto sm:overflow-hidden"
  (click)="close()"
>
  <div>
    <div
      class="modal-content !bg-base-100/80"
      (click)="$event.stopPropagation()"
    >
      <div class="hero-content text-center h-full w-full">
        <div class="h-full flex flex-col justify-center w-full space-y-2 hf">
          <div class="modal-icon">
            <h2>Lascia il tuo contatto</h2>
            <p>
              Inserisci i tuoi dati e il tuo messaggio per essere ricontattato
              al più presto
            </p>
            <div class="divider"></div>
          </div>
          <div class="flex flex-col space-y-4 text-start">
            <div class="flex space-x-2 w-full">
              <notify-tailwind-input
                [validationErrors]="validationErrors"
                class="w-full"
                *ngIf="isVisible('name')"
                [label]="getFieldName('name')"
                placeholder="Mario"
                [parent]="form"
                [compact]="true"
                name="name"
              ></notify-tailwind-input>
              <notify-tailwind-input
                [validationErrors]="validationErrors"
                class="w-full"
                *ngIf="isVisible('surname')"
                [label]="getFieldName('surname')"
                placeholder="Rossi"
                [parent]="form"
                [compact]="true"
                name="surname"
              ></notify-tailwind-input>
            </div>
            <notify-tailwind-input
              [validationErrors]="validationErrors"
              class="w-full"
              *ngIf="isVisible('email')"
              [label]="getFieldName('email')"
              placeholder="email@esempio.dominio"
              [parent]="form"
              [compact]="true"
              name="email"
            ></notify-tailwind-input>
            <notify-tailwind-input
              [validationErrors]="validationErrors"
              class="w-full"
              *ngIf="isVisible('phone')"
              [label]="getFieldName('phone')"
              placeholder="012 345 6789"
              [parent]="form"
              [compact]="true"
              name="phone"
              [mask]="
                form.value.phone?.startsWith('0')
                  ? '0000 000 009'
                  : '000 000 0000'
              "
            ></notify-tailwind-input>
            <notify-tailwind-textarea
              [validationErrors]="validationErrors"
              [label]="getFieldName('acceptanceMessage')"
              placeholder="Inserisci il tuo messaggio"
              [parent]="form"
              [compact]="true"
              [rows]="5"
              name="acceptanceMessage"
            ></notify-tailwind-textarea>
            <notify-tailwind-checkbox
              [validationErrors]="validationErrors"
              [parent]="form"
              [compact]="true"
              name="privacy"
              label="Acconento al trattamento dei mei dati personali per <a href='https://notifyapp.it' target='_blank' class='link'>finalità promozionali</a>"
            >
            </notify-tailwind-checkbox>
            <div class="flex w-full justify-center space-x-2">
              <button
                (click)="close()"
                class="btn btn-accent w-full shrink"
                data-theme="notifytheme"
              >
                Annulla
              </button>
              <button
                [disabled]="form.invalid || !form.value.privacy"
                class="btn btn-primary w-full shrink"
                data-theme="notifytheme"
                (click)="submit()"
              >
                Invia
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
