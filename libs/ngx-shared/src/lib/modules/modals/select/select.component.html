<div
  class="background"
  [@modal]="isClosing ? 'void' : '*'"
  (click)="close({ timeout: 200 })"
>
  <div class="column h-full justify-center items-center space-y-4">
    <div class="column space-y-1 text-white" (click)="$event.stopPropagation()">
      <p class="select-title">{{ title }}</p>
      <div class="select-subtitle" *ngIf="subtitle.length">{{ subtitle }}</div>
    </div>

    <div class="column space-y-1" (click)="$event.stopPropagation()">
      @for (option of fullOptions; track $index) {
      <button
        class="select-button smooth {{ option.style }}"
        (click)="
          option.style === 'cancel'
            ? close({ timeout: 200 })
            : submitted.next(option)
        "
      >
        {{ option.label }}
      </button>
      }
    </div>
  </div>
</div>
