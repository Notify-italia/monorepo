<div class="modal-container" (click)="close()">
  <div>
    <div (click)="$event.stopPropagation()" class="modal-content">
      <div class="flex flex-col items-center space-y-3">
        <!-- Modal content -->
        <h2 class="text-3xl font-bold text-left text-white">
          {{ config.title }}
        </h2>

        <p class="text-base text-center px-4">
          {{ config.description }}
        </p>
      </div>
      <div class="divider"></div>
      <div class="flex justify-end space-x-4 w-full">
        <button class="btn btn-neutral btn-outline" (click)="close()">
          {{ config.cancelText }}
        </button>

        <button
          [ngClass]="
            config.confirmClass ? config.confirmClass : 'btn btn-primary'
          "
          (click)="confirm()"
          [class.pointer-events-none]="loading"
          data-theme="notifytheme"
        >
          @if (loading) {
          <span class="loading loading-spinner"></span>
          } @else {
          <span>{{ config.confirmText }}</span>
          }
        </button>
      </div>
    </div>
  </div>
</div>
