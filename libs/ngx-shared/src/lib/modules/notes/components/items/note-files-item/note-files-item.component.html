<div class="note-module !flex-row group/linkPadlock !w-full">
  <form [formGroup]="form" class="main-container !w-full">
    <div class="flex flex-col w-full space-y-5 h-full mt-1">
      <input
        class="note-title max-w-[95%]"
        type="text"
        placeholder="Titolo Checklist..."
        formControlName="title"
        [maxlength]="100"
      />

      <notify-tailwind-dropzone
        class="w-full h-full"
        name="files"
        [parent]="form"
        [cdnConfig]="{
          postEndpoint: cdnPostEndpoint,
          authorization: authService.authHeaders,
          body: {item: item._id || '', note: note._id || ''},
          responseSchema: {
            value: 'url',
          }
        }"
      ></notify-tailwind-dropzone>
    </div>
  </form>
</div>
