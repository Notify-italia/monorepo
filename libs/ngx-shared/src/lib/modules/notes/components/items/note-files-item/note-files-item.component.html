<div class="note-module !flex-row group/linkPadlock !w-full">
  <form [formGroup]="form" class="main-container !w-full" *ngIf="formVisible">
    <div class="flex flex-col w-full space-y-2 items-center h-full">
      <notify-tailwind-input
        [parent]="form"
        name="title"
        class="w-full"
        label="Titolo"
        placeholder="Inserisci un titolo"
      ></notify-tailwind-input>
      <notify-tailwind-dropzone
        class="w-full h-full"
        [parent]="files"
        [cdnConfig]="{
          postEndpoint: cdnPostEndpoint,
          authorization: authService.authHeaders
        }"
      ></notify-tailwind-dropzone>
    </div>
  </form>

  <div
    class="flex justify-end my-auto h-full items-end text-gray-300 absolute right-2 -top-2"
  >
    <button
      class="btn btn-ghost btn-square lg:pointer-events-none lg:group-hover/linkPadlock:pointer-events-auto lg:translate-x-10 group-hover/linkPadlock:translate-x-0 lg:opacity-0 group-hover/linkPadlock:opacity-100 smooth"
      (click)="formVisible = !formVisible"
    >
      @if (!formVisible) {

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          fill-rule="evenodd"
          d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z"
          clip-rule="evenodd"
        />
      </svg>

      } @else {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          d="M18 1.5c2.9 0 5.25 2.35 5.25 5.25v3.75a.75.75 0 0 1-1.5 0V6.75a3.75 3.75 0 1 0-7.5 0v3a3 3 0 0 1 3 3v6.75a3 3 0 0 1-3 3H3.75a3 3 0 0 1-3-3v-6.75a3 3 0 0 1 3-3h9v-3c0-2.9 2.35-5.25 5.25-5.25Z"
        />
      </svg>
      }
    </button>
  </div>
</div>
