<div class="p-4">
  <notify-search-bar
    [array$]="notes$"
    [filterableFields]="[
      'title',
      'createdAt',
      'updatedAt',
      'items.value.content.content.content.text',
      'items.value.title',
      'items.value.url',
      'items.value.items.description'
    ]"
    helpLabel="Cerca Note"
    placeholder="Cerca per titolo o contenuto della nota"
    (filteredArray)="notes = $event"
  ></notify-search-bar>

  <!-- TODO FILTERS -->
</div>
<div class="w-full flex flex-col justify-center space-y-4">
  @for (note of notes; track note._id) {
  <div
    class="flex justify-between w-full box p-4 min-h-16 hover:brightness-150 smooth cursor-pointer"
    (click)="editNote.emit(note._id); $event.stopPropagation()"
  >
    <div class="flex items-center space-x-4">
      <div
        class="w-8 h-8 rounded-full p-2"
        [ngStyle]="{ 'background-color': note.color }"
      ></div>
      <div class="flex flex-col">
        <h1 class="text-lg font-bold truncate w-40 lg:w-96 xl:w-[50rem]">
          {{ note.title || '‎ ' }}
        </h1>
        <div>
          <p class="text-sm text-gray-500">
            {{ note.items.length || 0 }} elementi |
            {{ note.updatedAt | date : 'short' : '' : 'it' }}
          </p>
        </div>
      </div>
    </div>

    <div class="flex items-center z-10">
      <!-- DELETE NOTE -->
      <button
        class="action-btn action-error"
        data-theme="notifytheme"
        (click)="deleteNote.emit(note._id); $event.stopPropagation()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-8 h-8"
        >
          <path
            fill-rule="evenodd"
            d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
  </div>
  } @if (!notes) {
  <div class="h-[40vh] md:h-[60vh]">
    <notify-loading></notify-loading>
  </div>

  } @else if (notes && !notes.length) {
  <notify-no-items
    class="h-[40vh]"
    title="Nessuna Nota"
    subtitle="Usa il pulsante 'Aggiungi' per creare una nuova nota."
  ></notify-no-items>
  }
</div>
