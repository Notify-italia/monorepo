<div class="p-4">
  <notify-search-bar
    [array$]="notes$"
    [filterableFields]="[
      'title',
      'createdAt',
      'updatedAt',
      'items.value.content.content.content.text',
      'items.value.title',
      'items.value.url',
      'items.value.items.description',
      'items.value.files.name',
      'items.value.files.url'
    ]"
    helpLabel="Cerca Progetti"
    placeholder="Cerca per titolo o contenuto del progetto"
    (filteredArray)="notes = $event"
  ></notify-search-bar>
</div>
<div class="w-full flex flex-col justify-center space-y-4">
  @for (note of notes; track note._id) {
  <div
    [class]="cssClasses.rows.item"
    (click)="editNote.emit(note._id); $event.stopPropagation()"
  >
    <div [class]="cssClasses.rows.flexRowSpaced">
      <div
        [class]="cssClasses.rows.color"
        [ngStyle]="{ 'background-color': note.color }"
      ></div>
      <div [class]="cssClasses.rows.flexCol">
        <h1 [class]="cssClasses.rows.h1">
          {{ note.title || '‎ ' }}
        </h1>
        <div>
          <p [class]="cssClasses.rows.subtitle">
            {{ note.items.length || 0 }} elementi |
            {{ note.updatedAt | date : 'short' : '' : 'it' }}
          </p>
        </div>
      </div>
    </div>

    <div class="flex items-center z-10">
      <!-- DELETE NOTE -->
      <button
        class="action-btn action-error"
        data-theme="notifytheme"
        (click)="deleteNote.emit(note._id); $event.stopPropagation()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-8 h-8"
        >
          <path
            fill-rule="evenodd"
            d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
  </div>
  } @if (!notes) {
  <div class="w-full flex flex-col justify-center space-y-4">
    @for (item of skeletonRows; track $index) {
    <div [class]="cssClasses.rows.item">
      <div [class]="cssClasses.rows.flexRowSpaced">
        <div class="{{ cssClasses.rows.color }} skeleton !rounded-full "></div>
        <div class="{{ cssClasses.rows.flexCol }} space-y-4">
          <h1 class="{{ cssClasses.rows.h1 }} skeleton h-4 p-2.5 lg:!w-80"></h1>
          <div>
            <p
              class="{{ cssClasses.rows.subtitle }} skeleton h-3 w-[12.4rem]"
            ></p>
          </div>
        </div>
      </div>
    </div>
    }
  </div>

  } @else if (notes && !notes.length) {
  <notify-no-items
    class="h-[40vh]"
    title="Nessun Progetto"
    subtitle="Usa il pulsante 'Aggiungi' per creare una nuovo progetto."
  ></notify-no-items>
  }
</div>
