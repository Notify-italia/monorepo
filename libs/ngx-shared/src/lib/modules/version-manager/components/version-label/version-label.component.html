<button
  (click)="versionClick.emit()"
  class="box p-2 px-4 !shadow-none !rounded-lg flex justify-between items-center w-full hover:brightness-150 smooth border border-cyan-600"
>
  <span class="font-medium">
    {{ currentVersion }}
  </span>
  <span class="text-sm">
    {{ currentVersionDate | date : 'dd/MM/yyyy' }}
  </span>
</button>
