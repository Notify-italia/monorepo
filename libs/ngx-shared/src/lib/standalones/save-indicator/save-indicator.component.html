<div
  class="w-full h-54 p-3 flex items-center justify-between box backdrop-blur-md backdrop-brightness-95 my-2 z-[50]"
  [ngClass]="{
    'sticky ': followPage
  }"
>
  <div class="flex items-center space-x-4">
    <button
      (click)="save.emit()"
      class="rounded-full size-7 lg:size-8 shrink-0 text-white p-1 lg:p-2 flex flex-col justify-center smooth items-center"
      [ngClass]="{
        'bg-green-500': !isSaving,
        'bg-yellow-500 pointer-events-none': isSaving,
    }"
    >
      @if (isSaving) {
      <span class="spinner"></span>

      } @else {
      <svg
        class="size-8"
        fill="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          d="M20.048 6.352a1.2 1.2 0 0 1 0 1.696l-9.6 9.6a1.2 1.2 0 0 1-1.696 0l-4.8-4.8a1.2 1.2 0 0 1 1.696-1.696L9.6 15.103l8.752-8.751a1.2 1.2 0 0 1 1.696 0Z"
          clip-rule="evenodd"
        ></path>
      </svg>
      }
    </button>
    <small class="text-xs lg:text-base whitespace-nowrap">
      {{ isSaving ? 'Salvataggio...' : 'Salvato' }}
    </small>
  </div>
  <div
    class="flex items-center space-x-1 lg:space-x-4 whitespace-nowrap mt-0.5"
  >
    <small
      class="text-white text-xs lg:text-sm flex space-x-1 mix-blend-difference"
    >
      <span>Modificato il </span>
      <span>
        {{ lastSave | date : 'dd/MM/yyyy HH:mm' }}
      </span>
    </small>
  </div>
</div>
