<div
  class="w-full h-54 p-3 flex items-center justify-between box backdrop-blur-md backdrop-brightness-95 my-2 z-[50]"
  [ngClass]="{
    'h-12 !bg-white/5 my-0 !rounded-xl !rounded-t-sm !shadow-none': compact,
    'sticky ': followPage
  }"
>
  <div
    class="flex items-center space-x-4"
    [ngClass]="{
    '!space-x-2': compact,
  }"
  >
    <button
      (click)="save.emit()"
      class="rounded-full size-7 lg:size-8 shrink-0 text-white p-1 lg:p-2 flex flex-col justify-center smooth items-center"
      [ngClass]="{
        'bg-green-500': !isSaving,
        'bg-yellow-500 pointer-events-none': isSaving,
        '!size-6 !p-1': compact
      }"
    >
      @if (isSaving) {
      <span
        class="spinner"
        [ngClass]="{
          'spinner-sm': compact
        }"
      ></span>

      } @else {
      <svg
        class="size-8"
        [ngClass]="{
          'size-6': compact,
        }"
        fill="currentColor"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          d="M20.048 6.352a1.2 1.2 0 0 1 0 1.696l-9.6 9.6a1.2 1.2 0 0 1-1.696 0l-4.8-4.8a1.2 1.2 0 0 1 1.696-1.696L9.6 15.103l8.752-8.751a1.2 1.2 0 0 1 1.696 0Z"
          clip-rule="evenodd"
        ></path>
      </svg>
      }
    </button>
    <small
      class="text-xs lg:text-base whitespace-nowrap"
      [ngClass]="{
        '!text-xs': compact
      }"
    >
      {{ isSaving ? 'Salvataggio...' : 'Salvato' }}
    </small>
  </div>
  <div
    class="flex items-center space-x-1 lg:space-x-4 whitespace-nowrap mt-0.5"
  >
    <small
      class="text-white text-xs lg:text-sm flex space-x-1 mix-blend-difference"
      [ngClass]="{
        '!text-xs': compact
      }"
    >
      <span *ngIf="!compact">Modificato il </span>
      <span>
        {{ lastSave | date : (compact ? 'dd/MM HH:mm' : 'dd/MM/yyyy HH:mm') }}
      </span>
    </small>
  </div>
</div>
