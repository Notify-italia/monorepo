<header class="w-full box !bg-secondary-300/30 my-4 mb-0">
  <div class="mx-auto max-w-[100vw] p-5 sm:px-6 sm:py-12 lg:px-8">
    <div class="sm:flex items-center sm:justify-between w-full">
      <div
        class="text-center sm:text-left flex space-x-2 justify-between lg:justify-start items-center"
        [ngClass]="{
            'flex-col space-x-0 items-start': !buttons.length,
        }"
      >
        <h1 class="text-3xl font-bold text-white sm:text-4xl">
          {{ title }}
        </h1>

        <span *ngIf="!buttons.length">{{ subtitle }}</span>

        <div
          class="tooltip tooltip-left tooltip-info"
          [attr.data-tip]="subtitle"
          *ngIf="buttons.length"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"
            />
          </svg>
        </div>
      </div>

      <div class="mt-5 flex flex-col gap-2 sm:mt-0" *ngIf="buttons.length">
        @for(btn of buttons; track btn.disabled; let i = $index) {
        <button
          (click)="onButtonClicked(btn)"
          [disabled]="btn.disabled"
          class="btn btn-{{
            btn.buttonColor || 'primary'
          }} justify-between space-x-2"
          type="button"
          data-theme="notifytheme"
          [class.btn-primary]="i === 0"
          [ngClass]="{ 'btn-accent brightness-90': i > 0 }"
        >
          @if (btn.icon; as i) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6 h-6"
          >
            @for (path of i; track path) {
            <path fill-rule="evenodd" [attr.d]="path" clip-rule="evenodd" />
            }
          </svg>

          }

          <span> {{ btn.label }}</span>
        </button>
        }
      </div>
    </div>
  </div>
</header>
