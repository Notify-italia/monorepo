<div
  class="modal-container"
  [ngClass]="{
  'modalFadeOut': isClosing,
}"
>
  <div>
    <div class="modal-content">
      <h1 class="text-2xl font-bold w-full text-start text-white">
        Ritaglia immagine
      </h1>

      <div class="divider"></div>

      <div
        class="h-[400px] w-[400px]"
        [ngClass]="{
          'opacity-0 pointer-events-none absolute': loading
        }"
      >
        <img #IMGCropper [src]="this.config.imageData" />
      </div>
      <div class="flex justify-around w-full mt-4">
        <button
          class="btn btn-ghost btn-circle"
          data-theme="notifytheme"
          (click)="flipHorizontal()"
        >
          <notify-svg-box-icon
            [size]="8"
            [icon]="{ name: 'flip', set: 'materialui' }"
          ></notify-svg-box-icon>
        </button>
        <button
          class="btn btn-ghost btn-circle"
          data-theme="notifytheme"
          (click)="flipVertical()"
        >
          <notify-svg-box-icon
            class="rotate-90"
            [size]="8"
            [icon]="{ name: 'flip', set: 'materialui' }"
          ></notify-svg-box-icon>
        </button>

        <div class="divider divider-vertical"></div>

        <button
          class="btn btn-ghost btn-circle"
          data-theme="notifytheme"
          (click)="rotateRight()"
        >
          <notify-svg-box-icon
            class="rotate-90"
            [size]="8"
            [icon]="{ name: 'rotate_right', set: 'materialui' }"
          ></notify-svg-box-icon>
        </button>
        <button
          class="btn btn-ghost btn-circle"
          data-theme="notifytheme"
          (click)="rotateLeft()"
        >
          <notify-svg-box-icon
            class="rotate-90"
            [size]="8"
            [icon]="{ name: 'rotate_left', set: 'materialui' }"
          ></notify-svg-box-icon>
        </button>
      </div>

      @if(loading){
      <div class="flex justify-center items-center h-96 w-96">
        <notify-loading></notify-loading>
      </div>
      }

      <div class="divider"></div>

      <div class="flex w-full justify-end space-x-4">
        <button
          class="btn btn-accent brightness-90"
          data-theme="notifytheme"
          (click)="close()"
        >
          Annulla
        </button>
        <button
          data-theme="notifytheme"
          class="btn btn-primary"
          (click)="submit()"
        >
          Conferma
        </button>
      </div>
    </div>
  </div>
</div>
