<div class="modal-container">
  <div>
    <div class="modal-content">
      <h1 class="text-2xl font-bold w-full text-start text-white">
        Ritaglia immagine
      </h1>

      <div class="divider"></div>

      <div
        class="min-h-[400px] min-w-[400px]"
        [ngClass]="{
          'opacity-0 pointer-events-none absolute': loading
        }"
      >
        <img-cropper
          #IMGCropper
          class="rounded !w-full !h-full"
          *ngIf="cropperSettings as c"
          [settings]="cropperSettings"
          [image]="value"
          (imageSet)="loading = false"
        ></img-cropper>
      </div>

      @if(loading){
      <div class="flex justify-center items-center h-96 w-96">
        <notify-loading></notify-loading>
      </div>
      }

      <div class="divider"></div>

      <div class="flex w-full justify-end space-x-4">
        <button
          class="btn btn-accent brightness-90"
          data-theme="notifytheme"
          (click)="close()"
        >
          Annulla
        </button>
        <button
          data-theme="notifytheme"
          class="btn btn-primary"
          (click)="submit()"
        >
          Conferma
        </button>
      </div>
    </div>
  </div>
</div>
