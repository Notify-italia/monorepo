<button
  class="absolute pointer-events-none w-0 h-0 opacity-0"
  #LoseBlur
></button>
<button
  tabindex="0"
  #Button
  type="button"
  [disabled]="disabled"
  class="btn w-full items-center focus-within:!pr-0 transition-all text-red-500 rounded-xl relative disabled:bg-[#151619] bg-[#191C21] hover:bg-[#1a1d21] btn-sm group focus-within:active:scale-100"
  data-theme="notifytheme"
>
  <span [innerHTML]="sanitizedIcon"></span>
  <span *ngIf="label.length">{{ label }}</span>

  <div
    class="smooth confirm-cancel-container flex items-center justify-center space-x-4"
    [ngClass]="
  {
    'group-focus-within:p-2': compact,
  }
  "
  >
    <button
      type="button"
      class="btn btn-circle btn-xs text-green-500 border border-gray-700"
      (click)="onConfirm()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="svg-size"
        [ngClass]="{
          compact: compact
        }"
      >
        <path
          fill-rule="evenodd"
          d="M19.916 4.626a.75.75 0 0 1 .208 1.04l-9 13.5a.75.75 0 0 1-1.154.114l-6-6a.75.75 0 0 1 1.06-1.06l5.353 5.353 8.493-12.74a.75.75 0 0 1 1.04-.207Z"
          clip-rule="evenodd"
        />
      </svg>
    </button>

    <button
      type="button"
      class="btn btn-circle btn-xs text-red-500 border border-gray-700"
      (click)="LoseBlur.click(); LoseBlur.focus(); changeStateFeedback()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="svg-size"
        [ngClass]="{
          compact: compact
        }"
      >
        <path
          fill-rule="evenodd"
          d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>
</button>
