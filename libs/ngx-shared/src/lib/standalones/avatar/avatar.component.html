<div class="flex relative" *ngIf="cleanedConfigs as c">
  <ng-container
    [ngTemplateOutlet]="AvatarRenderer"
    [ngTemplateOutletContext]="{ config: c.main, avatarType: 'main' }"
  ></ng-container>

  <!-- SUB AVATAR -->
  <button
    *ngIf="
      (c.sub.src?.length || c.sub.placeholderSeed?.length) &&
      avatarConfig?.src?.length
    "
    class="absolute lg:pointer-events-none {{
      c.sub.placement
    }} active:scale-90 smooth smooth-fast"
    ontouchstart
    (click)="subAvatarClick.emit()"
  >
    <ng-container
      [ngTemplateOutlet]="AvatarRenderer"
      [ngTemplateOutletContext]="{ config: c.sub, avatarType: 'sub' }"
    ></ng-container>
  </button>
</div>

<ng-template #AvatarRenderer let-config="config" let-avatarType="avatarType">
  <div class="overflow-hidden relative shrink-0">
    <div
      *ngIf="config.src || placeholderAvatar[avatarType] as avatar"
      [ngClass]="{
      'mask  ': config.mask?.length,
      'opacity-0 absolute': !loaded[avatarType],
    }"
      [ngStyle]="{
      width: config.size / 4 + 'rem',
      height: config.size / 4 + 'rem',
    }"
      class="mask-{{ config.mask }}  smooth"
    >
      <img
        (load)="setLoaded(avatarType)"
        [src]="config.isBase64 ? avatar : avatar"
        alt="User Avatar"
        loading="lazy"
        class="w-full h-full object-contain"
        [style.background-color]="config?.mask ? config.backgroundColor : ''"
      />
    </div>
    <div
      *ngIf="!loaded[avatarType]"
      class="mask mask-{{
        config.mask
      }} object-contain smooth bg-gray-600 animate-pulse "
      [ngStyle]="{
      width: config.size/4 + 'rem',
      height: config.size/4 + 'rem',
    }"
    ></div>
  </div>
</ng-template>
