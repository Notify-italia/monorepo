<apx-chart
  *ngIf="chartOptions as c"
  [chart]="c.chart || $any({})"
  [series]="c.series || []"
  [labels]="c.labels || []"
  [colors]="c.colors || []"
  [legend]="c.legend || $any({})"
  [dataLabels]="c.dataLabels || $any({})"
  [stroke]="c.stroke || $any({})"
  [fill]="c.fill || $any({})"
  [tooltip]="c.tooltip || $any({})"
  [plotOptions]="c.plotOptions || $any({})"
  [responsive]="c.responsive || $any([])"
  [xaxis]="c.xaxis || $any({})"
  [yaxis]="c.yaxis || $any({})"
  [grid]="c.grid || $any({})"
  [theme]="c.theme || $any({})"
  [title]="c.title || $any({})"
  [subtitle]="c.subtitle || $any({})"
  [noData]="c.noData || $any({})"
  class="h-full !block"
></apx-chart>
