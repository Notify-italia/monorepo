<div class="h-full w-full relative" *ngIf="location$ | async as l">
  <div class="absolute inset-0 bg-white {{ mapClass }}" *ngIf="!loaded">
    <notify-loading></notify-loading>
  </div>
  <iframe
    title="Google Maps Location"
    [class]="mapClass"
    loading="lazy"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
    [src]="l"
    (load)="loaded = true"
  >
  </iframe>
</div>
