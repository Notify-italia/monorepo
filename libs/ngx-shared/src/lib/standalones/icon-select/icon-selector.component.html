<div class="group/icons w-fit" #SelectContainer>
  <div
    class="flex flex-col items-center space-y-1"
    [ngClass]="{
    '!flex-row space-y-0 space-x-2': iconLabelPosition === 'right',
  }"
  >
    <button (click)="hideSelector = false" class="icon-button">
      <notify-svg-box-icon
        [icon]="currentIcon"
        *ngIf="MANUAL_REFRESH"
      ></notify-svg-box-icon>
    </button>
    <label
      class="text-xs truncate w-12 text-center"
      *ngIf="showIconLabel"
      [ngClass]="{
      '!w-24 text-start': iconLabelPosition === 'right',
    }"
    >
      {{ currentIcon.expanded }}
    </label>
  </div>

  <div
    class="selector-container"
    *ngIf="!hideSelector"
    (click)="closeSelector()"
    (mousemove)="onMouseMove($event)"
  >
    <div class="flex flex-col justify-center items-center h-full w-full">
      <div
        (click)="$event.stopPropagation()"
        class="flex justify-between font-bold text-xl lg:text-3xl tracking-wider my-4 items-center w-11/12 lg:w-5/12"
      >
        <div class="flex flex-col space-y-4 w-full">
          <p class="my-auto">{{ title }}</p>
          <span class="relative w-full">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="w-6 h-6 absolute left-3 top-1/2 transform -translate-y-1/2"
            >
              <path
                fill-rule="evenodd"
                d="M10.5 3.75a6.75 6.75 0 100 13.5 6.75 6.75 0 000-13.5zM2.25 10.5a8.25 8.25 0 1114.59 5.28l4.69 4.69a.75.75 0 11-1.06 1.06l-4.69-4.69A8.25 8.25 0 012.25 10.5z"
                clip-rule="evenodd"
              />
            </svg>

            <input
              type="text"
              [formControl]="searchValue"
              placeholder="Cerca.."
              class="input input-bordered input-style w-full pl-10 placeholder-secondary-50/20 !text-base"
            />
          </span>
        </div>
      </div>

      <div class="h-4/6 lg:h-3/6 overflow-y-auto">
        <div class="cards">
          @for (item of filteredIcons$ | async; track item.name) {

          <button
            class="card"
            (click)="setIcon(item)"
            #card
            [ngClass]="{ ' brightness-150': item.name === currentIcon.name }"
          >
            <div class="card-content">
              <notify-svg-box-icon [icon]="item"></notify-svg-box-icon>
              <label class="text-sm truncate w-28 text-center">
                {{ item.expanded }}
              </label>
            </div>
          </button>

          }
        </div>
      </div>
    </div>
  </div>
</div>
