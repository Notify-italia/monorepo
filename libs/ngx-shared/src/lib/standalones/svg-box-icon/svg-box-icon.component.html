@if (visible &&isPlatformBrowser(_platformId)) {
<svg
  [attr.data-src]="icon?.data ? '' : iconUrl"
  fill="currentColor"
  class="w-{{ size }} h-{{ size }} text-xl"
  [innerHTML]="sanitizedData"
  [ngStyle]="pixelSizeStyle"
></svg>
} @else {
<div
  [ngStyle]="{
  width: size /4+ 'rem',
  height: size /4+ 'rem',
}"
  class="shrink-0 mask mask-squircle skeleton"
></div>
}
