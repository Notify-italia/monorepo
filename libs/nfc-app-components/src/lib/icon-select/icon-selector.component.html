<div class="group/icons w-fit" #SelectContainer>
  <div class="flex flex-col items-center space-y-1">
    <button (click)="hideSelector = false">
      <svg
        [attr.data-src]="genIconUrl(currentIcon)"
        fill="currentColor"
        *ngIf="MANUAL_REFRESH"
      ></svg>
    </button>
    <label class="text-xs truncate w-12 text-center">
      {{ currentIcon.expanded }}
    </label>
  </div>
  <div
    *ngIf="!hideSelector"
    class="fixed w-screen h-screen top-0 backdrop-blur left-0 z-[999] flex flex-col justify-center items-center backdrop-brightness-50"
  >
    <div class="text-center font-bold text-3xl tracking-wider my-4">
      Seleziona un'icona
    </div>
    <div
      class="p-1 rounded-xl w-11/12 lg:w-6/12 flex-wrap justify-around m-1 h-3/6 overflow-y-auto flex transition-all"
    >
      <div
        *ngFor="let item of availableIcons"
        class="flex flex-col items-center m-4 space-y-1"
      >
        <button
          class="flex flex-col smooth hover:scale-125"
          (click)="setIcon(item)"
        >
          <svg
            [attr.data-src]="genIconUrl(item)"
            fill="currentColor"
            class="icon-item p-1"
          ></svg>
        </button>
        <label class="text-xs truncate w-16 text-center">
          {{ item.expanded }}
        </label>
      </div>
    </div>
  </div>
</div>
