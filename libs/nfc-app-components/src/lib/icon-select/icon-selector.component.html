<div class="group/icons w-fit" #SelectContainer>
  <div class="flex flex-col items-center space-y-1">
    <button (click)="hideSelector = false" class="icon-button">
      <notify-svg-box-icon
        [icon]="currentIcon"
        *ngIf="MANUAL_REFRESH"
      ></notify-svg-box-icon>
    </button>
    <label class="text-xs truncate w-12 text-center">
      {{ currentIcon.expanded }}
    </label>
  </div>
  <div *ngIf="!hideSelector" class="selector-container">
    <div
      class="flex justify-between font-bold text-3xl tracking-wider my-4 items-center w-11/12 lg:w-6/12"
    >
      <p>Servizio</p>
      <button class="btn btn-circle btn-ghost" (click)="hideSelector = true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-10 h-10"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
    <div
      class="p-1 rounded-xl w-11/12 lg:w-6/12 flex-wrap justify-around m-1 h-3/6 overflow-y-auto flex transition-all"
    >
      <div
        *ngFor="let item of availableIcons"
        class="flex flex-col items-center m-4 space-y-1"
      >
        <button class="icon-button smooth" (click)="setIcon(item)">
          <notify-svg-box-icon [icon]="item"></notify-svg-box-icon>
        </button>
        <label class="text-xs truncate w-16 text-center">
          {{ item.expanded }}
        </label>
      </div>
    </div>
  </div>
</div>
