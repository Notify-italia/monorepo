<div
  class="drawer border-b border-secondary/20 drawer-open z-[999] shadow-xl shadow-primary-700/20"
>
  <div class="navbar p-0">
    <div class="flex">
      <input id="my-drawer" type="checkbox" class="drawer-toggle" />
      <label class="btn btn-square btn-ghost lg:hidden mx-2" for="my-drawer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          class="inline-block w-10 h-10 stroke-current"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </label>

      <div class="drawer-content hidden lg:block">
        <!-- DESKTOP SIDEBAR -->
        <ng-container [ngTemplateOutlet]="SidebarContent"></ng-container>
      </div>

      <div class="drawer-side lg:hidden">
        <!-- MOBILE SIDEBAR -->
        <ng-container [ngTemplateOutlet]="SidebarContent"></ng-container>
      </div>
    </div>
  </div>
</div>

<ng-template #SidebarContent>
  <label
    for="my-drawer"
    aria-label="close sidebar"
    class="drawer-overlay"
  ></label>

  <div class="flex flex-col justify-between h-[99.85vh] bg-base-200">
    <div class="flex flex-col">
      <div class="items-center text-center p-4 pt-10">
        <span
          class="font-montserratAlt1 tracking-widest title-gradient text-6xl"
          >NOTIFY</span
        >
      </div>
      <ul>
        <!-- Sidebar content here -->
        <li *ngFor="let item of topItems">
          <a
            [routerLink]="item.path"
            routerLinkActive="btn-active"
            class="flex space-x-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="text-primary"
            >
              <path
                *ngFor="let p of item.icon"
                fill-rule="evenodd"
                [attr.d]="p"
              />
            </svg>

            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>
    <ul>
      <!-- Sidebar content here -->
      <li *ngFor="let item of bottomItems">
        <a
          [routerLink]="item.path"
          routerLinkActive="btn-active"
          class="flex space-x-2 {{ item.style }}"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path *ngFor="let p of item.icon" [attr.d]="p" />
          </svg>

          <span>{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>
</ng-template>
