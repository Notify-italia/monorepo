<form
  class="flex flex-col items-center space-y-4 bg-gray-700/20 p-4 rounded-xl"
  [formGroup]="form"
>
  <!-- AVATAR -->
  <div class="flex space-x-2 items-center w-full">
    <div class="form-control w-full">
      <label class="label">
        <span class="label-text text-white font-medium">Avatar</span>
      </label>
      <input type="file" class="file-input file-input-bordered w-full" />
      <label class="label"> </label>
    </div>
  </div>

  <div class="divider">Anagrafica</div>

  <div class="w-full">
    <!-- NOME -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="name"
        label="Nome"
        placeholder="Mario"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
    <!-- COGNOME -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="surname"
        label="Cognome"
        placeholder="Rossi"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
    <!-- BIO -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="bio"
        label="Bio"
        placeholder="Inserisci una breve descrizione di te"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>

  <div class="divider">Contatti</div>

  <div class="w-full">
    <!-- EMAIL -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="email"
        label="Email"
        placeholder="email@example.com"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
    <!-- TELEFONO -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="phoneNumber"
        label="Telefono"
        placeholder="3331234567"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
    <!-- LINKEDIN -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="linkedIn"
        label="LinkedIn"
        placeholder="https://www.linkedin.com/in/mario-rossi/"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>

  <div class="divider">Opzioni</div>

  <div class="field">
    <notify-tailwind-checkbox
      [parent]="form"
      name="isPublic"
      label="Permetti chiamate"
      [validationErrors]="validationErrors"
    ></notify-tailwind-checkbox>
    <notify-tailwind-checkbox
      [parent]="form"
      name="isPublic"
      label="Whatsapp"
      [validationErrors]="validationErrors"
    ></notify-tailwind-checkbox>
    <notify-tailwind-checkbox
      [parent]="form"
      name="isPublic"
      label="E-Mail"
      [validationErrors]="validationErrors"
    ></notify-tailwind-checkbox>
    <notify-tailwind-checkbox
      [parent]="form"
      name="isPublic"
      label="LinkedIn"
      [validationErrors]="validationErrors"
    ></notify-tailwind-checkbox>
  </div>

  <div class="divider"></div>

  <div class="field flex justify-around space-x-2" data-theme="notifytheme">
    <button class="btn btn-secondary w-6/12" (click)="this.form.reset()">
      Annulla
    </button>
    <button class="btn btn-primary w-6/12">Salva</button>
  </div>
</form>
