<form
  class="flex flex-col items-center space-y-4 bg-gray-700/20 p-4 rounded-xl w-full"
  [formGroup]="form"
  (submit)="submit()"
>
  <div class="section">
    <!-- NOME -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="name"
        label="Nome*"
        placeholder="Mario"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
    <!-- COGNOME -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="surname"
        label="Cognome*"
        placeholder="Rossi"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
    <!-- BIO -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="bio"
        label="Bio"
        placeholder="Inserisci una breve descrizione di te"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>

  <div class="divider">Avatar</div>
  <!-- AVATAR -->
  <div class="section">
    <notify-upload
      class="w-full"
      uploadLabel="Fai click per caricare un'immagine o trascinala all'interno del riquadro"
      [acceptedFiles]="'image/*'"
      [file]="avatarFile"
      (fileChanged)="setUploadedFile($event.blob)"
      [removeFile$]="removeAvatar$"
    ></notify-upload>
  </div>

  <div class="divider">Contatti</div>

  <div class="section">
    <!-- EMAIL -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="email"
        label="Email"
        placeholder="email@example.com"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
    <!-- TELEFONO -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="phoneNumber"
        label="Telefono"
        placeholder="3331234567"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>

  <div class="divider">Principali</div>

  <div class="section">
    <notify-tailwind-checkbox
      [parent]="form"
      name="phoneCallEnabled"
      label="Permetti chiamate"
      [validationErrors]="validationErrors"
    ></notify-tailwind-checkbox>
    <notify-tailwind-checkbox
      [parent]="form"
      name="whatsappEnabled"
      label="Whatsapp"
      [validationErrors]="validationErrors"
    ></notify-tailwind-checkbox>
    <notify-tailwind-checkbox
      [parent]="form"
      name="emailEnabled"
      label="E-Mail"
      [validationErrors]="validationErrors"
    ></notify-tailwind-checkbox>
  </div>

  <div class="divider">Esterni</div>

  <div class="field space-y-2" *ngIf="form.controls.customFields as cf">
    <button class="btn w-full" type="button" (click)="addCustomField()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-6 h-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 4.5v15m7.5-7.5h-15"
        />
      </svg>

      <span>aggiungi</span>
    </button>
    <div *ngFor="let item of cf.controls" class="flex items-center space-x-2">
      <!-- TODO fix widening del form quando viene renderizzato un oggetto -->
      <notify-icon-selector
        class="items-end mt-6"
        [icon]="item.controls['iconName'].value"
        (iconValue)="item.controls['iconName'].setValue($event.name)"
      ></notify-icon-selector>
      <notify-tailwind-input
        [parent]="item"
        name="value"
        class="w-full"
        label=" "
        placeholder="Inserisci un link"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
      <!-- RIMUOVI SERVIZIO -->
      <div class="mt-1">
        <button
          type="button"
          class="btn btn-error my-auto btn-outline"
          (click)="removeCustomField(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6 h-6"
          >
            <path
              fill-rule="evenodd"
              d="M16.5 4.478v.227a48.816 48.816 0 013.878.512.75.75 0 11-.256 1.478l-.209-.035-1.005 13.07a3 3 0 01-2.991 2.77H8.084a3 3 0 01-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 01-.256-1.478A48.567 48.567 0 017.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 013.369 0c1.603.051 2.815 1.387 2.815 2.951zm-6.136-1.452a51.196 51.196 0 013.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 00-6 0v-.113c0-.794.609-1.428 1.364-1.452zm-.355 5.945a.75.75 0 10-1.5.058l.347 9a.75.75 0 101.499-.058l-.346-9zm5.48.058a.75.75 0 10-1.498-.058l-.347 9a.75.75 0 001.5.058l.345-9z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="field flex justify-around space-x-2">
    <button
      type="button"
      class="btn btn-secondary w-6/12"
      (click)="resetForm()"
      data-theme="notifytheme"
    >
      Annulla
    </button>
    <div class="w-6/12">
      <!-- TODO mostra spinner e disabilita se in caricamento -->
      <button
        [disabled]="form.invalid"
        class="btn btn-primary w-full"
        type="submit"
        data-theme="notifytheme"
      >
        Salva
      </button>

      <div class="text-center my-2 kbd-xs opacity-50 hidden lg:block">
        <kbd class="kbd">{{ isMacos ? '⌃' : 'Ctrl' }}</kbd>
        +
        <kbd class="kbd">shift</kbd>
        +
        <kbd class="kbd">S</kbd>
      </div>
    </div>
  </div>
</form>
