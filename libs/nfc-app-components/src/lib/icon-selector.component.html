<div class="relative group/icons w-fit" #SelectContainer>
  <div class="flex flex-col items-center space-y-1">
    <button>
      <svg [attr.data-src]="genIconUrl(currentIcon)" fill="currentColor"></svg>
    </button>
    <label class="text-xs truncate w-12 text-center">
      {{ currentIcon.expanded }}
    </label>
  </div>
  <div
    class="absolute p-1 rounded-xl w-[15rem] flex-wrap justify-around m-1 h-[15rem] overflow-y-auto z-[999] group-focus-within/icons:opacity-100 group-focus-within/icons:pointer-events-auto pointer-events-none opacity-0 flex transition-all backdrop-blur backdrop-brightness-75"
  >
    <div
      *ngFor="let item of availableIcons"
      class="flex flex-col items-center my-1 space-y-1"
    >
      <button class="flex flex-col" (click)="setIcon(item)">
        <svg [attr.data-src]="genIconUrl(item)" fill="currentColor"></svg>
      </button>
      <label class="text-xs truncate w-16 text-center">
        {{ item.expanded }}
      </label>
    </div>
  </div>
</div>
