<div class="modal-container" (click)="close()">
  <div>
    <div
      (click)="$event.stopPropagation()"
      class="rounded-xl px-10 py-8 bg-base-100 w-full h-fit flex flex-col items-center slide-in-blurred-top"
    >
      <div class="file-animation">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-6 h-6"
        >
          <path
            fill-rule="evenodd"
            d="M9 1.5H5.625c-1.036 0-1.875.84-1.875 1.875v17.25c0 1.035.84 1.875 1.875 1.875h12.75c1.035 0 1.875-.84 1.875-1.875V12.75A3.75 3.75 0 0 0 16.5 9h-1.875a1.875 1.875 0 0 1-1.875-1.875V5.25A3.75 3.75 0 0 0 9 1.5Zm6.61 10.936a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 14.47a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
            clip-rule="evenodd"
          />
          <path
            d="M12.971 1.816A5.23 5.23 0 0 1 14.25 5.25v1.875c0 .207.168.375.375.375H16.5a5.23 5.23 0 0 1 3.434 1.279 9.768 9.768 0 0 0-6.963-6.963Z"
          />
        </svg>
      </div>
      <div class="text-center mt-4">
        <h1 class="text-2xl font-bold">File Ricevuto!</h1>
        <p class="text-base-content">{{ fileName }}</p>
      </div>
      <button
        class="btn btn-primary w-full mt-5"
        data-theme="notifytheme"
        (click)="downloadFile()"
      >
        Scarica File
      </button>
    </div>
  </div>
</div>
