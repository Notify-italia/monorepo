<div class="popup-backdrop" (click)="close()">
  <div class="flex flex-col justify-center items-center w-full">
    <form
      [formGroup]="form"
      (submit)="submit()"
      (click)="$event.stopPropagation()"
      class="rounded-xl px-4 py-8 pt-6 bg-base-100 w-[80%] lg:w-[50%] h-fit flex flex-col items-center slide-in-blurred-top space-y-4"
    >
      <div class="flex flex-col w-full">
        <h1 class="text-3xl font-bold w-full text-start">Carica un file</h1>
        <h2 class="text font-medium w-full text-start">
          Il file sarà caricato ed inviato al dispositivo selezionato in tempo
          reale
        </h2>
      </div>

      <div class="divider"></div>

      <notify-upload
        class="w-full"
        [uploadLabel]="_capacitor.isDesktop ? desktopMessage : mobileMessage"
        (fileChanged)="setUploadedFile($event.file)"
      ></notify-upload>

      <div class="flex justify-end space-x-4 w-full">
        <button
          data-theme="notifytheme"
          [disabled]="form.invalid"
          class="btn w-full text-white/80 btn-primary bg-primary-500/40 brightness-90 z-10"
        >
          Invia
        </button>
      </div>
    </form>
  </div>
</div>
