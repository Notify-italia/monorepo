<div
  data-theme="notifytheme"
  class="relative"
  [ngClass]="{
    'h-full w-full  mockup-phone': mockup,
    'min-h-screen w-screen ': !mockup
  }"
>
  <div class="flex justify-between relative text-gray-50" *ngIf="mockup">
    <div class="absolute top-[0.6rem] left-8 font-medium my-auto">
      {{ currentTime$ | async }}
    </div>
    <div class="phone-camera"></div>
    <div class="flex absolute top-[0.6rem] right-6 space-x-1">
      <!-- CELLULAR -->
      <svg
        class="w-4 h-4 my-auto"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path d="M0 0h24v24H0z" fill="none" st></path>
        <path d="M17 4h3v16h-3zM5 14h3v6H5zm6-5h3v11h-3z"></path>
      </svg>
      <!-- WIFI -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-4 h-4 my-auto"
      >
        <path d="M0 0h24v24H0z" fill="none" st></path>
        <path
          d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 00-6 0zm-4-4l2 2a7.074 7.074 0 0110 0l2-2C15.14 9.14 8.87 9.14 5 13z"
        ></path>
      </svg>
      <!-- BATTERY -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6 my-auto"
      >
        <path
          fill-rule="evenodd"
          d="M3.75 6.75a3 3 0 00-3 3v6a3 3 0 003 3h15a3 3 0 003-3v-.037c.856-.174 1.5-.93 1.5-1.838v-2.25c0-.907-.644-1.664-1.5-1.837V9.75a3 3 0 00-3-3h-15zm15 1.5a1.5 1.5 0 011.5 1.5v6a1.5 1.5 0 01-1.5 1.5h-15a1.5 1.5 0 01-1.5-1.5v-6a1.5 1.5 0 011.5-1.5h15zM4.5 9.75a.75.75 0 00-.75.75V15c0 .414.336.75.75.75H18a.75.75 0 00.75-.75v-4.5a.75.75 0 00-.75-.75H4.5z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
  </div>

  <div
    class="main-container"
    [ngClass]="{
      'display pt-10 h-full': mockup,
      'h-max min-h-screen ': !mockup
    }"
  >
    <div
      class="main-child"
      [class.opacity-50]="!data"
      [ngClass]="{
        'h-full py-5': mockup,
        'h-full min-h-screen': !mockup
      }"
    >
      <div class="flex justify-center mt-4">
        <!-- FEEDBACK -->
        @if (isAgent) {
        <button
          type="button"
          class="btn btn-wide btn-accent"
          [disabled]="mockup || feedbackGiven()"
          (click)="showFeedback()"
        >
          @if (!feedbackGiven()) {
          <svg
            class="w-6 h-6"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M0 0h24v24H0z" fill="none"></path>
            <path
              d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"
            ></path>
          </svg>
          <p class="normal-case">Lascia un feedback</p>
          }

          <div *ngIf="feedbackGiven() as fb" class="m-1 space-y-1">
            <p class="normal-case text-xs text-gray/50">Feedback lasciato</p>
            <notify-rating
              [currentValue]="fb.rating"
              colorClass="bg-primary"
              sizeClass="sm"
            ></notify-rating>
          </div>
        </button>
        } @else {
        <button
          type="button"
          class="btn btn-wide btn-accent"
          [disabled]="mockup || !data?.reviewRedirect"
          (click)="redirectToReview()"
        >
          <svg
            class="w-6 h-6"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M0 0h24v24H0zm15.35 6.41l-1.77-1.77c-.2-.2-.51-.2-.71 0L6 11.53V14h2.47l6.88-6.88c.2-.19.2-.51 0-.71z"
              fill="none"
            ></path>
            <path
              d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 14v-2.47l6.88-6.88c.2-.2.51-.2.71 0l1.77 1.77c.2.2.2.51 0 .71L8.47 14H6zm12 0h-7.5l2-2H18v2z"
            ></path>
          </svg>
          <p class="normal-case">Lascia una recensione</p>
        </button>
        }
      </div>

      <div class="section w-fit h-fit relative">
        <notify-avatar
          [src]="data?.avatar"
          size="40"
          [mask]="data?.config?.avatarMask || (isAgent ? 'circle' : 'squircle')"
        ></notify-avatar>

        <button
          *ngIf="isAgent"
          (click)="companyAvatarClick.emit()"
          class="!absolute bottom-0 right-0 -mr-4 scale-125"
        >
          <notify-avatar
            size="14"
            [src]="data?.company?.avatar"
            [mask]="data?.company?.config?.avatarMask || 'circle'"
          ></notify-avatar>
        </button>
      </div>

      <div class="section">
        <div class="title">
          <span>{{ data?.name || 'Nome' }}</span>
          <span *ngIf="isAgent">{{ data?.surname || 'Cognome' }}</span>
        </div>

        <div class="text-sm italic text-center" *ngIf="isAgent">
          {{ data?.role }}
        </div>
      </div>

      <!-- STATIC LINKS -->
      <notify-profile-static-links
        [data]="data"
        class="w-[80%]"
      ></notify-profile-static-links>

      <!-- BIO -->
      <div
        class="section module module-blur text-sm italic text-center !px-2"
        *ngIf="data?.bio as b"
      >
        {{ b }}
      </div>

      @if (!isAgent) {
      <div
        class="section w-full"
        *ngIf="profileService.buildCompanyLocation(data?.address) as p"
      >
        <div class="module module-blur !py-2 text-center my-1.5 text-sm">
          {{ p | titlecase }}
        </div>
        <notify-google-maps [address]="p" class="!w-[90%]"></notify-google-maps>
      </div>

      <div
        class="flex flex-wrap justify-evenly w-full module module-blur"
        *ngIf="data?.customFields?.length"
      >
        @for (item of data?.customFields; track item.value) {
        <button [disabled]="!item.value" type="button" class="button-icon m-3">
          <a
            [href]="prepareUrl(item.value)"
            target="_blank"
            class="buttton-redirect"
          >
            <notify-svg-box-icon
              [iconName]="item.iconName"
            ></notify-svg-box-icon>
          </a>
        </button>
        }
      </div>
      }
    </div>

    <div class="footer" *ngIf="!mockup && showFooter">
      <div class="flex justify-between w-full">
        <div>Provided by <span class="font-bold">Notify</span></div>
      </div>
    </div>
  </div>
</div>
