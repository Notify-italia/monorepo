<div
  class="relative"
  [ngClass]="{
    'h-full !w-full mockup-phone': mockup,
    'min-h-screen w-full ': !mockup
  }"
>
  <!-- MOCKUP FILL -->
  <notify-mockup-fill *ngIf="mockup" class="w-full"></notify-mockup-fill>

  <div
    class="main-container"
    [ngStyle]="{
      background: 'linear-gradient(' + cssGradientStops + ')'
    }"
    [ngClass]="{
      'display pt-10 h-full': mockup,
      
    }"
  >
    <div
      class="main-child !h-full justify-around"
      [class.opacity-50]="!data"
      [ngClass]="{
        'h-full py-5': mockup,
        'h-full  min-h-screen  w-screen': !mockup
      }"
    >
      <div class="section h-fit w-full space-y-8">
        <div class="flex justify-center mt-4">
          <!-- FEEDBACK -->
          <notify-feedback-button
            [data]="data"
            [cssElementsColor]="cssElementsColor"
            (feedbackClicked)="feedbackClicked.emit($event)"
            [isAgent]="isAgent"
            [feedbackKey]="feedbackKey"
          ></notify-feedback-button>
        </div>
        <div class="section space-y-2">
          <div
            class="section w-full h-fit !flex-row justify-around space-x-5 px-2"
          >
            <notify-avatar
              class="w-4/12"
              [avatarConfig]="{
                src: data?.avatar || '',
                size: '42',
                mask: data?.config?.avatarMask || '',
                placeholderSeed: data?._id || '',
                backgroundColor: cssElementsColor,
                placeholderStyle: isAgent
                  ? dicebearAvatarStyles.BigSmile
                  : dicebearAvatarStyles.Bottts
              }"
              [subAvatarConfig]="
                isAgent
                  ? {
                      src: data?.company?.avatar || '',
                      size: '12',
                      mask: data?.company?.config?.avatarMask || '',
                      placeholderSeed: ''
                    }
                  : undefined
              "
              (subAvatarClick)="subAvatarClick.emit()"
            ></notify-avatar>

            <div class="h-full w-7/12">
              <div class="title" [ngStyle]="{ color: cssElementsColor }">
                <!-- NAME ( and surname) -->
                <span>{{ data?.name || 'Nome' }}</span>
                <span *ngIf="isAgent">{{ data?.surname || 'Cognome' }}</span>
              </div>
              <!-- ROLE -->
              <div
                class="text-sm italic w-full text-start"
                *ngIf="isAgent"
                [ngStyle]="{ color: cssElementsColor, opacity: 0.8 }"
              >
                {{ data?.role }}
              </div>
              <!-- BIO -->
              <div
                class="text-xs w-full mt-2"
                [ngStyle]="{ color: cssElementsColor, opacity: 0.7 }"
                *ngIf="data?.bio as b"
              >
                {{ b }}
              </div>
            </div>
          </div>

          <!-- STATIC LINKS -->
          <notify-profile-static-links
            [data]="data"
            class="w-10/12"
            [color]="cssElementsColor"
          ></notify-profile-static-links>
        </div>
      </div>

      <div class="section w-full">
        <div class="divider mx-5" *ngIf="data?.customFields?.length"></div>
        <notify-profile-integrations
          class="w-full"
          [data]="data?.customFields"
          [color]="cssElementsColor"
          (integrationClicked)="integrationClicked.emit($event)"
        ></notify-profile-integrations>

        @if (!isAgent) {
        <div
          class="section w-full"
          *ngIf="profileService.buildCompanyLocation(data?.address) as p"
        >
          <div
            class="module module-blur !py-2 text-center my-1.5 text-sm"
            [ngStyle]="{ color: cssElementsColor }"
          >
            {{ p | titlecase }}
          </div>
          <notify-google-maps
            [address]="p"
            class="!w-[90%]"
          ></notify-google-maps>
        </div>
        }
      </div>
    </div>
  </div>
</div>
