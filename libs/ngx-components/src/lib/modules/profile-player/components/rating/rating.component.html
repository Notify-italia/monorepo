<div class="rating rating-{{ sizeClass }} space-x-2 ">
  <input
    *ngIf="rating === 0"
    type="radio"
    name="rating-10"
    class="rating-hidden"
    [checked]="true"
  />
  @for (item of availableItems; track rating) {

  <input
    type="radio"
    name="rating-8 "
    class="mask mask-star-2 {{ colorClass }}"
    [checked]="rating >= item.value"
    (change)="setRating(item.value)"
  />
  }
</div>
