<!-- STATIC LINKS -->
<div class="section section-horizontal !justify-around">
  @for (item of staticLinks; track $index) {
  <button
    *ngIf="item.visible ?? true"
    [disabled]="item.disabled"
    [ngClass]="{
      'btn-circle': linksCount > countThreshold,
    }"
    class="flex !flex-row whitespace-nowrap"
  >
    <a
      [href]="item.href"
      class="button-redirect space-x-2"
      [ngStyle]="iconColor"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        @for (path of item.icon; track $index) {
        <path fill-rule="evenodd" [attr.d]="path" clip-rule="evenodd" />

        }
      </svg>
      <span *ngIf="linksCount <= countThreshold">
        {{ item.name }}
      </span>
    </a>
  </button>
  }
</div>
