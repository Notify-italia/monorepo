<div class="backdrop">
  <div class="slide-in-left">
    <div class="scale-75 lg:scale-100 space-y-4">
      <div class="w-full flex justify-end">
        <button
          class="btn btn-error btn-circle btn-ghost"
          data-theme="notifytheme"
          (click)="close()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-10 h-10"
          >
            <path
              fill-rule="evenodd"
              d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>

      <div>
        <notify-share-profile
          [profile]="data"
          [playerUrl]="playerUrl"
        ></notify-share-profile>
      </div>
      <div class="w-[405px] h-[800px]">
        <notify-profile-view
          class="h-full w-full"
          [mockup]="true"
          [data]="data"
          [publicUrl]="''"
        ></notify-profile-view>
      </div>
    </div>
  </div>
</div>
