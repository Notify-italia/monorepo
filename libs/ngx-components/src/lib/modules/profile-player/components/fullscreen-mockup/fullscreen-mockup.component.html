<div class="modal-container" (click)="close()">
  <div>
    <div
      class="scale-[65%] lg:scale-100 space-y-4"
      (click)="$event.stopPropagation()"
    >
      <div
        *ngIf="baseUrl && !hideShare"
        class="slide-in-left"
        [style]="{
          'animation-delay': '0.1s'
        }"
      >
        <notify-share-profile
          [profile]="data"
          [baseUrl]="baseUrl"
        ></notify-share-profile>
      </div>
      <div class="iphone-15-pro slide-in-left">
        <notify-profile-view
          class="h-full w-full"
          [mockup]="true"
          [data]="data"
        ></notify-profile-view>
      </div>
    </div>
  </div>
</div>
