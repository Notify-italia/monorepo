<div *ngIf="profile" class="modal-container" (click)="close()">
  <div>
    <div
      class="modal-content !bg-base-100/80"
      (click)="$event.stopPropagation()"
    >
      <div class="hero-content text-center h-full w-full">
        <div class="h-full flex flex-col justify-center w-full space-y-2 hf">
          <div class="modal-icon">
            <div>
              <div>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  class="w-6 h-6"
                >
                  <path
                    fill-rule="evenodd"
                    d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                    clip-rule="evenodd"
                  />
                </svg>
              </div>
            </div>
            <h2>Lascia un feedback</h2>
            <p>
              Come valuteresti la tua esperienza con {{ profile.name?.trim() }}?
            </p>
            <div class="divider"></div>
          </div>

          <div class="my-2 w-full h-full">
            <notify-rating
              [rating]="rating"
              (valueChanged)="rating = $event"
              sizeClass="lg"
              class="w-full h-full"
            ></notify-rating>
            <div class="form-control text-xs">
              <label class="label">
                <span class="label-text">Commento</span>
              </label>
              <textarea
                class="textarea textarea-bordered h-24"
                [(ngModel)]="comment"
                placeholder="Scrivi un commento. Obbligatorio se vuoi lasciare un feedback negativo."
              ></textarea>
            </div>
          </div>
          <div class="flex flex-col space-y-2">
            <button
              class="btn btn-primary"
              data-theme="notifytheme"
              (click)="sendFeedback()"
              [class.pointer-events-none]="loading"
              [disabled]="isSendDisabled()"
            >
              @if(!loading) { Invia } @else {
              <span class="loading loading-spinner loading-lg"></span>
              }
            </button>
            <p class="text-xs lg:text-base">
              Il feedback inviato sarà usato per migliorare la tua esperienza e
              non sarà visibile pubblicamente.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
