<div [formGroup]="parent" class="w-full group/advancedSelect">
  <label [for]="name" class="block text-sm font-medium">
    {{ label | titlecase }}
  </label>

  <div class="dropdown w-full">
    <input
      class="w-full select items-center flex"
      role="button"
      tabindex="0"
      [id]="name"
      [name]="name"
      autocomplete="one-time-code"
      [formControlName]="name"
      [placeholder]="placeholder"
      [ngClass]="{
        'border border-red-500': showValidationErrors
      }"
    />

    <ul
      *ngIf="dropdownVisible"
      tabindex="0"
      class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-full my-2"
    >
      @for (item of filteredOptions; track item) {
      <li
        class="w-full items-center flex justify-between !flex-row flex-nowrap"
      >
        <button type="button" (click)="value = item" class="w-10/12 xl:w-11/12">
          <span>
            {{ item }}
          </span>
        </button>
        <button
          *ngIf="allowRemove"
          type="button"
          (click)="removeOption.emit(item)"
          class="w-2/12 xl:w-1/12 flex justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 mx-auto"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
          </svg>
        </button>
      </li>
      <div class="divider !my-0 mx-2" *ngIf="!$last"></div>
      }
    </ul>
  </div>

  <p
    class="mt-2 text-sm text-red-600 absolute"
    [id]="name + '-error'"
    *ngIf="showValidationErrors"
  >
    {{ validationErrorMessage }}
  </p>
</div>
