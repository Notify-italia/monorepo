<div
  class="relative flex justify-between w-full"
  [formGroup]="parent"
  id="form-wrapper"
>
  <label [for]="name" class="font-medium my-auto opacity-45">{{ label }}</label>

  <div class="form-control">
    <label class="cursor-pointer label">
      <input
        type="checkbox"
        class="toggle toggle-info"
        [formControlName]="name"
        [id]="name"
        checked
      />
    </label>
  </div>
</div>
<p [id]="name + '-description'" class="opacity-75 text-sm" *ngIf="description">
  {{ description }}
</p>
<p
  class="mt-2 text-sm text-red-600"
  [id]="name + '-error'"
  *ngIf="showValidationErrors"
>
  {{ validationErrorMessage }}
</p>
