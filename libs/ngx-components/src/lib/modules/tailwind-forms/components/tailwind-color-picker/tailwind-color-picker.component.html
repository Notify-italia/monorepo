<div [formGroup]="parent" class="flex space-x-2 my-auto">
  <div class="relative group/colorPicker w-full">
    <button
      class="current-color group-focus-within/colorPicker:border-2 group-focus-within/colorPicker:scale-90"
      [ngStyle]="{
        'background-color': color || defaultColor
      }"
      [ngClass]="{
        'border-2 border-red-500': hasErrors && touched
      }"
    ></button>

    <div
      class="absolute -translate-y-10 opacity-0 pointer-events-none group-focus-within/colorPicker:translate-y-0 group-focus-within/colorPicker:opacity-100 group-focus-within/colorPicker:pointer-events-auto py-2 px-4 rounded-lg bg-white border my-2 smooth max-w-96 overflow-auto"
    >
      <div class="flex w-full space-x-1">
        @for (color of colors; track color) {
        <button
          class="current-color !w-6 !h-6 border border-slate-500 flex-shrink-0"
          [ngStyle]="{
            'background-color': color
          }"
          (click)="parent.get(name)?.setValue(color)"
        ></button>
        }
      </div>
    </div>
  </div>
</div>
