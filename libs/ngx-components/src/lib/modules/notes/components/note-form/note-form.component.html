<form
  *ngIf="form"
  [formGroup]="form"
  class="bg-base-100/50 w-full h-full flex flex-col justify-center items-center p-4 rounded-lg shadow-lg brightness-125"
>
  <div class="flex w-full items-center space-x-2">
    <notify-tailwind-color-picker
      [parent]="form"
      name="color"
      label=" "
      class="brightness-75"
    ></notify-tailwind-color-picker>
    <input
      type="text"
      placeholder="Titolo..."
      formControlName="title"
      [maxlength]="100"
    />
  </div>

  <div class="divider !my-1 lg:!my-3"></div>

  <textarea
    #Textarea
    placeholder="Contenuto..."
    [rows]="maxRows(Textarea)"
    resize="none"
    formControlName="content"
  ></textarea>
</form>
