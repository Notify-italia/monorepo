<div class="note-module !flex-row group/linkPadlock h-56">
  @if (!formVisible) {
  <a
    class="main-container"
    [class.pointer-events-none]="!redirectUrl"
    [href]="redirectUrl"
    target="_blank"
  >
    <div
      class="smooth flex w-full left-5 top-5 absolute items-center space-x-4 z-50 lg:pointer-events-none lg:group-hover/linkPadlock:pointer-events-auto lg:-translate-x-10 group-hover/linkPadlock:translate-x-0 lg:opacity-0 group-hover/linkPadlock:opacity-100"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          fill-rule="evenodd"
          d="M19.902 4.098a3.75 3.75 0 0 0-5.304 0l-4.5 4.5a3.75 3.75 0 0 0 1.035 6.037.75.75 0 0 1-.646 1.353 5.25 5.25 0 0 1-1.449-8.45l4.5-4.5a5.25 5.25 0 1 1 7.424 7.424l-1.757 1.757a.75.75 0 1 1-1.06-1.06l1.757-1.757a3.75 3.75 0 0 0 0-5.304Zm-7.389 4.267a.75.75 0 0 1 1-.353 5.25 5.25 0 0 1 1.449 8.45l-4.5 4.5a5.25 5.25 0 1 1-7.424-7.424l1.757-1.757a.75.75 0 1 1 1.06 1.06l-1.757 1.757a3.75 3.75 0 1 0 5.304 5.304l4.5-4.5a3.75 3.75 0 0 0-1.035-6.037.75.75 0 0 1-.354-1Z"
          clip-rule="evenodd"
        />
      </svg>

      <span class="font-bold lg:text-2xl text-white">{{
        form.value.title || 'Inserisci un titolo'
      }}</span>
    </div>

    @if (redirectUrl) {
    <div
      class="iframe-wrapper w-full h-full pointer-events-none group-hover/linkPadlock:opacity-25 smooth"
    >
      <iframe
        (click)="$event.preventDefault()"
        [src]="redirectUrl"
        frameborder="0"
        class="!rounded-lg w-full h-full"
      ></iframe>
    </div>
    } @else {
    <div class="flex justify-center w-full space-x-4 h-full items-center">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-10 h-10 text-gray-300"
      >
        <path d="M0 0h24v24H0V0z" fill="none"></path>
        <path
          d="M17 7h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1 0 1.43-.98 2.63-2.31 2.98l1.46 1.46C20.88 15.61 22 13.95 22 12c0-2.76-2.24-5-5-5zm-1 4h-2.19l2 2H16zM2 4.27l3.11 3.11A4.991 4.991 0 002 12c0 2.76 2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1 0-1.59 1.21-2.9 2.76-3.07L8.73 11H8v2h2.73L13 15.27V17h1.73l4.01 4L20 19.74 3.27 3 2 4.27z"
        ></path>
        <path d="M0 24V0" fill="none"></path>
      </svg>

      <span
        class="font-semibold lg:text-lg text-gray-300"
        *ngIf="!redirectUrl"
        >{{ 'Nessun URL inserito' }}</span
      >
    </div>
    }
  </a>
  } @else {

  <!-- formVisible -->
  <form [formGroup]="form" class="main-container">
    <div
      class="flex flex-col justify-around w-full space-y-2 items-center scale-90 h-full"
    >
      <notify-tailwind-input
        [parent]="form"
        name="title"
        label="Titolo"
        placeholder="Inserisci il titolo"
        class="w-full"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
      <notify-tailwind-input
        [parent]="form"
        name="url"
        label="URL"
        placeholder="Inserisci l'URL"
        class="w-full"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </form>
  }

  <div
    class="flex justify-end w-1/12 my-auto h-full items-end text-gray-300 absolute right-2 -top-2"
  >
    <button
      class="btn btn-ghost btn-square lg:pointer-events-none lg:group-hover/linkPadlock:pointer-events-auto lg:translate-x-10 group-hover/linkPadlock:translate-x-0 lg:opacity-0 group-hover/linkPadlock:opacity-100 smooth"
      (click)="formVisible = !formVisible"
    >
      @if (!formVisible) {

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          fill-rule="evenodd"
          d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z"
          clip-rule="evenodd"
        />
      </svg>

      } @else {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          d="M18 1.5c2.9 0 5.25 2.35 5.25 5.25v3.75a.75.75 0 0 1-1.5 0V6.75a3.75 3.75 0 1 0-7.5 0v3a3 3 0 0 1 3 3v6.75a3 3 0 0 1-3 3H3.75a3 3 0 0 1-3-3v-6.75a3 3 0 0 1 3-3h9v-3c0-2.9 2.35-5.25 5.25-5.25Z"
        />
      </svg>
      }
    </button>
  </div>
</div>
