<div class="w-full flex flex-col justify-center space-y-4">
  @for (note of notes; track note._id) {
  <div
    class="flex justify-between w-full box p-4 min-h-16 hover:brightness-150 smooth cursor-pointer"
    (click)="editNote.emit(note._id)"
  >
    <div class="flex items-center space-x-4">
      <div
        class="w-8 h-8 rounded-full p-2"
        [ngStyle]="{ 'background-color': note.color }"
      ></div>
      <div class="flex flex-col">
        <h1 class="text-lg font-bold truncate w-40 lg:w-96 xl:w-[50rem]">
          {{ note.title || '‎ ' }}
        </h1>
      </div>
    </div>

    <div class="flex items-center">
      <!-- SHARE NOTE -->
      <button
        class="action-btn action-primary"
        data-theme="notifytheme"
        (click)="shareNote.emit(note)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-6 h-6"
        >
          <path
            d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"
          />
        </svg>
      </button>
      <!-- DELETE USER -->
      <button
        class="action-btn action-error"
        data-theme="notifytheme"
        (click)="deleteNote.emit(note._id)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-8 h-8"
        >
          <path
            fill-rule="evenodd"
            d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
  </div>
  }
</div>
