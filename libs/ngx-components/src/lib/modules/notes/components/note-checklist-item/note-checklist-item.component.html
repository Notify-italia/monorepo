<div class="note-module" *ngIf="form">
  <form [formGroup]="form">
    <div class="flex justify-between w-[90%] lg:w-[95%] items-center -mt-1.5">
      <input
        class="note-title"
        type="text"
        placeholder="Titolo Checklist..."
        formControlName="title"
        [maxlength]="100"
      />

      <button
        class="btn btn-square text-green-500 btn-ghost"
        (click)="addItem()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 4.5v15m7.5-7.5h-15"
          />
        </svg>
      </button>
    </div>

    <div class="w-full my-2">
      @for (item of $any(form.controls['items']).controls; track $index) {
      <div class="flex justify-between w-full items-center space-y-1">
        <form class="flex items-center space-x-2 w-full" [formGroup]="item">
          <input
            type="checkbox"
            class="checkbox h-5 w-5 text-gray-600"
            [class.checkbox-primary]="item.controls['checked'].value"
            formControlName="checked"
          />
          <input
            #DescriptionInput
            class="note-title !font-normal !text-base"
            type="text"
            placeholder="Descrizione..."
            formControlName="description"
            [maxlength]="100"
          />
        </form>
        <button
          [disabled]="form.value.items.length === 1"
          class="btn btn-ghost btn-error -mr-2 btn-square text-gray-500"
          (click)="removeItem($index)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6 h-6"
          >
            <path
              fill-rule="evenodd"
              d="M4.25 12a.75.75 0 0 1 .75-.75h14a.75.75 0 0 1 0 1.5H5a.75.75 0 0 1-.75-.75Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>

      }
    </div>
  </form>
</div>
