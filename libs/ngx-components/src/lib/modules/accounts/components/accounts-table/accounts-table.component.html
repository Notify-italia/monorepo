<div *ngIf="users as p" class="page-layout">
  <div>
    <div>
      <!-- TODO SEARCH e incapsulamento dell'input -->
      <div class="form-control box p-4">
        <label class="label">
          <span class="label-text">Cerca</span>
        </label>
        <div class="relative">
          <svg
            class="pointer-events-none absolute z-10 my-3.5 ms-4 stroke-current opacity-60 text-base-content h-5 w-5"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
          <input
            type="text"
            placeholder="Mario Rossi"
            class="input input-bordered w-full pl-14 input-style"
          />
        </div>
        <label class="label" *ngIf="config?.displayLeftAccounts">
          <label class="label-text"></label>
          <div class="flex justify-end">
            <span class="badge badge-warning badge-sm" data-theme="notifytheme">
              {{ p.length }}/{{ maxAgents }} Utenti creati
            </span>
          </div>
        </label>
      </div>

      <!-- TODO FILTERS -->

      <!-- TABLE -->
      <div class="box w-full h-full p-4">
        <div class="overflow-x-auto">
          <table class="table w-full">
            <!-- head -->
            <thead>
              <tr>
                <th *ngIf="!isRowDisabled('select-item')">
                  <label>
                    <input type="checkbox" class="checkbox" />
                  </label>
                </th>
                <th *ngIf="!isRowDisabled('name')">Nome</th>
                <th *ngIf="!isRowDisabled('role')">Ruolo</th>
                <th *ngIf="!isRowDisabled('createdAt')">Aggiunto il</th>
                <th>Azioni</th>
              </tr>
            </thead>
            <tbody>
              <!-- row 1 -->
              @for (user of p; track user._id) {
              <tr
                notify-accounts-row
                class="w-full"
                [user]="user"
                [config]="config"
                (inspectProfile)="inspectProfile.emit(user.profile)"
                (showUserForm)="showUserForm.emit(user)"
                (deleteUser)="deleteUser.emit(user)"
              ></tr>
              }
            </tbody>
            <!-- foot -->
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
