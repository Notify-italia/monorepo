<div class="page-layout">
  <div>
    <div>
      <div class="p-4">
        <notify-search-bar
          [array$]="users$"
          [filterableFields]="[
            'email',
            'profile.email',
            'profile.name',
            'profile.surname',
            'profile.email',
            'profile.phone',
            'profile.customFields.iconName',
            'profile.customFields.value',
            'createdAt',
            'profile.role'
          ]"
          helpLabel="Cerca utenti"
          placeholder="Nome, Cognome, Email, N. Telefono, Ruolo, Data di creazione, ecc..."
          (filteredArray)="users = $event"
        ></notify-search-bar>
        <label class="label" *ngIf="config?.displayLeftAccounts">
          <label class="label-text"></label>
          <div class="flex justify-end">
            <span class="badge badge-warning badge-sm" data-theme="notifytheme">
              {{ users?.length ?? '?' }}/{{ maxAgents }} Utenti creati
            </span>
          </div>
        </label>
        <!-- TODO FILTERS -->
      </div>

      <notify-no-items
        *ngIf="users && !users?.length"
        [title]="noItemsMessages.title"
        [subtitle]="noItemsMessages.subtitle"
      >
      </notify-no-items>
      <!-- TABLE -->
      <div
        *ngIf="users?.length || skeletonRows"
        class="box w-full h-full p-4"
        [ngStyle]="
      config.transparentBackgroundColor
        ? {
            'background-color': 'transparent',
          }
        : {}"
      >
        <div class="overflow-x-auto">
          <table class="table w-full">
            <!-- head -->
            <thead>
              <tr>
                <th *ngIf="!isRowDisabled('select-item')">
                  <label>
                    <input type="checkbox" class="checkbox" />
                  </label>
                </th>
                <th *ngIf="!isRowDisabled('name')">Nome</th>
                <th *ngIf="!isRowDisabled('role')">Ruolo</th>
                <th *ngIf="!isRowDisabled('createdAt')">Aggiunto il</th>
                <th *ngIf="!isRowDisabled('actions')">Azioni</th>
              </tr>
            </thead>
            <tbody>
              @if (users?.length) {
              <!-- row 1 -->
              @for (user of users; track user._id) {
              <tr
                (click)="config.clickableRow ? rowClicked.emit(user) : null"
                notify-accounts-row
                class="w-full smooth"
                [user]="user"
                [ngClass]="{
                    'hover:brightness-150 cursor-pointer': config.clickableRow,
                    
                  }"
                [config]="config"
                (inspectProfile)="inspectProfile.emit(user.profile)"
                (showUserForm)="showUserForm.emit(user)"
                (deleteUser)="deleteUser.emit(user)"
              ></tr>
              } } @else {
              <!-- skeletons -->
              @for (item of iterableSkeletonRows; track $index) {
              <tr>
                <td *ngIf="!isRowDisabled('select-item')">
                  <div class="skeleton w-8 h-8 rounded-full"></div>
                </td>
                <td *ngIf="!isRowDisabled('name')">
                  <div class="flex space-x-2">
                    <div class="skeleton rounded-full shrink-0 w-14 h-14"></div>
                    <div class="flex flex-col justify-center space-y-2">
                      <div class="skeleton w-32 h-4"></div>
                      <div class="skeleton w-32 h-4"></div>
                    </div>
                  </div>
                </td>
                <td *ngIf="!isRowDisabled('role')">
                  <div class="skeleton w-32 h-4"></div>
                </td>
                <td *ngIf="!isRowDisabled('createdAt')">
                  <div class="skeleton w-32 h-4"></div>
                </td>
                <td *ngIf="!isRowDisabled('actions')">
                  <div class="skeleton w-20 h-12"></div>
                </td>
              </tr>

              } }
            </tbody>
            <!-- foot -->
          </table>
        </div>
      </div>
      @if(!users && !skeletonRows) {
      <div class="h-[40%] md:h-[60%]" *ngIf="!users">
        <notify-loading></notify-loading>
      </div>

      }
    </div>
  </div>
</div>
