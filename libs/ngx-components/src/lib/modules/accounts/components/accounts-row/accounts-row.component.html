<td *ngIf="!isRowDisabled('select-item')">
  <label>
    <input type="checkbox" class="checkbox" />
  </label>
</td>
<td
  *ngIf="!isRowDisabled('name')"
  [ngClass]="{
    'opacity-50': !user.enabled
  }"
>
  <div class="flex items-center gap-3">
    <div class="w-14 h-14">
      <notify-avatar
        [avatarConfig]="{
          src: user.profile?.avatar || '',
          size: '14',
          mask: 'circle',
          placeholderSeed: user.profile?._id || ''
        }"
      ></notify-avatar>
    </div>
    <div>
      <div class="font-bold">
        {{ user.profile?.name }} {{ user.profile?.surname }}
      </div>
      <div class="text-sm opacity-50">{{ user.email }}</div>
    </div>
  </div>
</td>
<td *ngIf="!isRowDisabled('role')">
  <span
    data-theme="notifytheme"
    class="flex whitespace-nowrap py-1 px-2 rounded-full bg-purple-400/60 w-fit text-white text-xs min-w-48 justify-center"
    >{{ user.profile?.role }}</span
  >
</td>
<td *ngIf="!isRowDisabled('createdAt')">
  <span
    class="badge badge-ghost bg-transparent backdrop-brightness-125 badge-sm px-4 py-3 whitespace-nowrap my-auto border-none"
    data-theme="notifytheme"
  >
    {{ user.createdAt | date : 'dd/MM/yyyy HH:mm' }}
  </span>
</td>
<td class="whitespace-nowrap" *ngIf="!isRowDisabled('actions')">
  <div class="space-x-4 py-2 px-4 rounded-2xl backdrop-brightness-110 w-fit">
    <!-- INSPECT PROFILE -->
    <button
      *ngIf="config.allowInspect"
      class="action-btn action-primary"
      data-theme="notifytheme"
      (click)="inspectProfile.emit()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          fill-rule="evenodd"
          d="M10.5 3.75a6.75 6.75 0 100 13.5 6.75 6.75 0 000-13.5zM2.25 10.5a8.25 8.25 0 1114.59 5.28l4.69 4.69a.75.75 0 11-1.06 1.06l-4.69-4.69A8.25 8.25 0 012.25 10.5z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
    <button
      *ngIf="config.allowInspect"
      class="action-btn action-accent"
      data-theme="notifytheme"
      (click)="inspectAnalytics.emit()"
    >
      <svg
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M16.5 6.75h5.25V12"></path>
        <path
          d="m2.25 17.25 5.69-5.69a1.5 1.5 0 0 1 2.12 0l2.38 2.38a1.5 1.5 0 0 0 2.12 0L21 7.5"
        ></path>
      </svg>
    </button>
    <!-- EDIT USER -->
    <button
      *ngIf="config.allowEdit"
      class="action-btn action-info"
      data-theme="notifytheme"
      (click)="showUserForm.emit()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          d="M18.75 12.75h1.5a.75.75 0 0 0 0-1.5h-1.5a.75.75 0 0 0 0 1.5ZM12 6a.75.75 0 0 1 .75-.75h7.5a.75.75 0 0 1 0 1.5h-7.5A.75.75 0 0 1 12 6ZM12 18a.75.75 0 0 1 .75-.75h7.5a.75.75 0 0 1 0 1.5h-7.5A.75.75 0 0 1 12 18ZM3.75 6.75h1.5a.75.75 0 1 0 0-1.5h-1.5a.75.75 0 0 0 0 1.5ZM5.25 18.75h-1.5a.75.75 0 0 1 0-1.5h1.5a.75.75 0 0 1 0 1.5ZM3 12a.75.75 0 0 1 .75-.75h7.5a.75.75 0 0 1 0 1.5h-7.5A.75.75 0 0 1 3 12ZM9 3.75a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5ZM12.75 12a2.25 2.25 0 1 1 4.5 0 2.25 2.25 0 0 1-4.5 0ZM9 15.75a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Z"
        />
      </svg>
    </button>
    <!-- EDIT USER PROFILE -->
    <button
      *ngIf="config.allowEdit"
      class="action-btn action-warning"
      data-theme="notifytheme"
      (click)="editProfile.emit()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          fill-rule="evenodd"
          d="M20.599 1.5c-.376 0-.743.111-1.055.32l-5.08 3.385a18.747 18.747 0 0 0-3.471 2.987 10.04 10.04 0 0 1 4.815 4.815 18.748 18.748 0 0 0 2.987-3.472l3.386-5.079A1.902 1.902 0 0 0 20.599 1.5Zm-8.3 14.025a18.76 18.76 0 0 0 1.896-1.207 8.026 8.026 0 0 0-4.513-4.513A18.75 18.75 0 0 0 8.475 11.7l-.278.5a5.26 5.26 0 0 1 3.601 3.602l.502-.278ZM6.75 13.5A3.75 3.75 0 0 0 3 17.25a1.5 1.5 0 0 1-1.601 1.497.75.75 0 0 0-.7 1.123 5.25 5.25 0 0 0 9.8-2.62 3.75 3.75 0 0 0-3.75-3.75Z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
    <!-- DELETE USER -->
    <button
      *ngIf="config.allowDelete"
      class="action-btn action-error"
      data-theme="notifytheme"
      (click)="deleteUser.emit()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6"
      >
        <path
          fill-rule="evenodd"
          d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>
</td>
