<div class="modal-container">
  <div class="w-[90%] lg:w-[50%] 2xl:w-[40%]">
    <div class="my-1 w-full flex justify-end">
      <button
        class="btn btn-secondary btn-circle btn-ghost"
        data-theme="notifytheme"
        [disabled]="loading"
        (click)="close()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-10 h-10"
        >
          <path
            fill-rule="evenodd"
            d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
    <div class="modal-content content-static">
      <h1 class="text-3xl font-bold text-white sm:text-4xl p-4">
        {{ user ? 'Modifica utente' : 'Crea utente' }}
      </h1>
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="flex flex-col justify-around items-center w-full h-full space-y-5"
      >
        <notify-tailwind-input
          *ngIf="!hiddenFields.includes('email')"
          name="email"
          label="emall"
          [parent]="form"
          placeholder="email@example.com"
          [validationErrors]="validationErrors"
        >
        </notify-tailwind-input>
        <notify-tailwind-input
          *ngIf="!hiddenFields.includes('password')"
          name="password"
          [label]="
            passwordFieldConfig.label || (user ? 'Nuova password' : 'Password')
          "
          [parent]="form"
          placeholder="******"
          [type]="passwordFieldConfig.type"
          [validationErrors]="validationErrors"
          [helpText]="
            user
              ? passwordFieldConfig.helpText ||
                'Lascia vuoto per non modificare la password'
              : 'Inserisci una password sicura, di almeno 6 caratteri'
          "
        >
        </notify-tailwind-input>
        <notify-tailwind-input
          *ngIf="
            !hiddenFields.includes('password') && form.value.password?.length
          "
          class="a animate__fadeInDown animate__animated animate__faster"
          name="confirmPassword"
          label="Conferma password"
          [parent]="form"
          placeholder="******"
          [type]="passwordFieldConfig.type"
          [validationErrors]="validationErrors"
          helpText="Conferma la password inserita"
        >
        </notify-tailwind-input>

        <notify-tailwind-checkbox
          *ngIf="!hiddenFields.includes('enabled')"
          name="enabled"
          label="Attivo"
          [parent]="form"
          class="w-full"
          [validationErrors]="validationErrors"
        ></notify-tailwind-checkbox>

        <div class="divider" *ngIf="hasProfileFields"></div>

        <notify-tailwind-advanced-select
          *ngIf="!hiddenFields.includes('role')"
          name="role"
          label="Ruolo"
          class="w-full"
          [parent]="form"
          placeholder="Sales Manager"
          [options]="createdRoles"
          (removeOption)="removeRole.emit($event)"
          [validationErrors]="validationErrors"
        ></notify-tailwind-advanced-select>

        <notify-tailwind-checkbox
          *ngIf="!hiddenFields.includes('feedbackEnabled')"
          name="feedbackEnabled"
          label="Può ricevere feedbacks"
          [parent]="form"
          class="w-full"
          [validationErrors]="validationErrors"
        ></notify-tailwind-checkbox>

        <div class="divider"></div>

        <button
          [disabled]="form.invalid"
          [class.pointer-events-none]="isLoading"
          class="btn btn-primary w-full"
          type="submit"
          data-theme="notifytheme"
        >
          <span class="loading loading-spinner" *ngIf="isLoading"></span>
          <span class="my-auto" *ngIf="!isLoading"> Conferma </span>
        </button>
      </form>
    </div>
  </div>
</div>
