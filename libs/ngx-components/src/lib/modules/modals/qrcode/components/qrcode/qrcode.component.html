<div class="modal-container" (click)="close()">
  <div
    class="flex flex-col justify-center w-[{{ size }}px] slide-in-blurred-top "
  >
    <div class="flex w-full justify-between items-center">
      <h1 class="font-bold text-2xl" (click)="$event.stopPropagation()">
        {{ title }}
      </h1>
    </div>
    <qrcode
      (click)="$event.stopPropagation()"
      #Qrcode
      [qrdata]="data"
      [width]="size"
      class="!rounded-xl mb-5 mt-3"
    ></qrcode>
    <div class="flex justify-end w-full">
      <button
        (click)="saveAsImage(Qrcode); $event.stopPropagation()"
        class="btn btn-wide justify-around"
        [ngStyle]="{
          width: size / 2 + 'px',
          height: size / 10 + 'px'
        }"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="h-6"
          [ngStyle]="{
            width: size / 10 + 'px',
            
          }"
        >
          <path
            fill-rule="evenodd"
            d="M12 2.25a.75.75 0 0 1 .75.75v11.69l3.22-3.22a.75.75 0 1 1 1.06 1.06l-4.5 4.5a.75.75 0 0 1-1.06 0l-4.5-4.5a.75.75 0 1 1 1.06-1.06l3.22 3.22V3a.75.75 0 0 1 .75-.75Zm-9 13.5a.75.75 0 0 1 .75.75v2.25a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5V16.5a.75.75 0 0 1 1.5 0v2.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V16.5a.75.75 0 0 1 .75-.75Z"
            clip-rule="evenodd"
          />
        </svg>
        <span>Scarica</span>
      </button>
    </div>
  </div>
</div>
