<div class="popup-backdrop" (click)="close()">
  <div class="flex flex-col justify-center items-center">
    <div
      (click)="$event.stopPropagation()"
      class="rounded-xl px-4 py-8 bg-base-100 w-[80%] lg:w-full h-fit flex flex-col items-center slide-in-blurred-top"
    >
      <div class="flex flex-col items-center space-y-3">
        <!-- Modal content -->
        <h2 class="text-3xl font-bold text-center">{{ config.title }}</h2>

        <p class="text-base text-center px-4">
          {{ config.description }}
        </p>
      </div>
      <div class="divider"></div>
      <div class="flex justify-end space-x-4 w-full">
        <button class="btn btn-neutral" (click)="close()">
          {{ config.cancelText }}
        </button>

        <button
          [ngClass]="
            config.confirmClass ? config.confirmClass : 'btn btn-primary'
          "
          (click)="confirm()"
          [class.pointer-events-none]="loading"
          data-theme="notifytheme"
        >
          @if (loading) {
          <span class="loading loading-spinner"></span>
          } @else {
          <span>{{ config.confirmText }}</span>
          }
        </button>
      </div>
    </div>
  </div>
</div>
