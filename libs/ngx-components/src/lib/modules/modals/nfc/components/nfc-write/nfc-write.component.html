<div class="container" *ngIf="progress$ | async as progress" (click)="close()">
  <div>
    <div
      (click)="$event.stopPropagation()"
      class="rounded-xl px-4 py-10 bg-base-100 w-80 lg:w-[60%] flex flex-col items-center slide-in-blurred-top"
    >
      @switch ( progress.status ) { @case ('scanning') {
      <ng-container [ngTemplateOutlet]="Scanning"></ng-container>
      } @case ('found') {
      <ng-container [ngTemplateOutlet]="Found"></ng-container>
      } }
    </div>
  </div>
</div>

<ng-template #Writing>
  <div class="nfc-animation">
    <span class="loading loading-dots w-full"></span>
  </div>
  <div class="text-center mt-4">
    <h1 class="text-2xl font-bold">Sto scrivendo</h1>
    <p class="text-base-content">Non rimuovere la tessera</p>
  </div>
</ng-template>

<ng-template #Found>
  <div class="nfc-animation">
    <span class="loading loading-ball w-full"></span>
  </div>
  <div class="text-center mt-4">
    <h1 class="text-2xl font-bold">Tessera trovata</h1>
    <p class="text-base-content">Vuoi sovrascrivere il profilo?</p>
    <button data-theme="notifytheme" class="btn btn-primary mt-4 w-full">
      Sovrascrivi
    </button>
  </div>
</ng-template>

<ng-template #Scanning>
  <div class="nfc-animation">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      xmlns:v="https://vecta.io/nano"
    >
      <path
        d="M5 8l5 8m8.722 4.5a17 17 0 0 0 0-17M14.392 18a12 12 0 0 0 0-12"
      />
      <path d="M9.928 16a8 8 0 0 0 0-8m-4.856 8a8 8 0 0 1 0-8" />
    </svg>
  </div>
  <div class="text-center mt-4">
    <h1 class="text-2xl font-bold">Avvicina la tua tessera</h1>
    <p class="text-base-content">Per salvare il tuo profilo tramite NFC</p>
  </div>
</ng-template>
