<div class="w-full h-full widget-container">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 1000"
    xmlns:v="https://vecta.io/nano"
  >
    <defs>
      <clipPath id="A">
        <path
          [attr.fill]="backgroundColor"
          d="M922.5 673Q846 846 673 907.5T340.5 894q-159.5-75-234-234.5T96 330q64-170 234-226.5t343-3Q846 154 922.5 327t0 346Z"
        />
      </clipPath>
    </defs>
    <g clip-path="url(#A)">
      <path
        [attr.fill]="backgroundColor"
        d="M922.5 673Q846 846 673 907.5T340.5 894q-159.5-75-234-234.5T96 330q64-170 234-226.5t343-3Q846 154 922.5 327t0 346Z"
      />
    </g>
  </svg>

  <div>
    <div class="header-container">
      <div class="header-items">
        <h2>
          {{ title }}
        </h2>
      </div>
      <div class="divider !mt-1"></div>
    </div>
    <div class="flex flex-col justify-center h-full">
      <apx-chart
        [noData]="chartConfig.noData || {}"
        [legend]="chartConfig.legend || {}"
        [series]="series"
        [chart]="chartConfig.chart || $any({})"
        [series]="series"
        [fill]="chartConfig.fill || {}"
        [stroke]="chartConfig.stroke || {}"
        [plotOptions]="chartConfig.plotOptions || {}"
        [dataLabels]="chartConfig.dataLabels || {}"
        [labels]="legendValues"
        class="w-full h-fit 2xl:scale-125"
      ></apx-chart>
    </div>
  </div>
</div>
