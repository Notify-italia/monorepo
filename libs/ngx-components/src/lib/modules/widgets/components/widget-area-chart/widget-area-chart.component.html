<div class="w-full h-full widget-container">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 1000"
    xmlns:v="https://vecta.io/nano"
  >
    <defs>
      <clipPath id="A">
        <path
          [attr.fill]="backgroundColor"
          d="M922.5 673Q846 846 673 907.5T340.5 894q-159.5-75-234-234.5T96 330q64-170 234-226.5t343-3Q846 154 922.5 327t0 346Z"
        />
      </clipPath>
    </defs>
    <g clip-path="url(#A)">
      <path
        [attr.fill]="backgroundColor"
        d="M922.5 673Q846 846 673 907.5T340.5 894q-159.5-75-234-234.5T96 330q64-170 234-226.5t343-3Q846 154 922.5 327t0 346Z"
      />
    </g>
  </svg>

  <div>
    <div class="header-container">
      <div class="header-items">
        <h2>
          {{ title }}
        </h2>
        <div class="join my-auto mt-4 hidden 2xl:inline-flex">
          @for (item of timespans; track $index) {
          <button
            class="btn join-item btn-sm text-xs"
            data-theme="notifytheme"
            (click)="handleTimespanChange($any(prepareSelectValue(item)))"
            [ngClass]="
        {
            'brigthness-150 btn-primary': selectedTimespan.label === item.label,
        }"
          >
            {{ item.label }}
          </button>
          }
        </div>
        <select
          class="select !text-xs w-fit max-w-xs 2xl:hidden mt-2.5"
          (change)="handleTimespanChange($any($event.target)?.value)"
        >
          @for (item of timespans; track $index) {
          <option [value]="prepareSelectValue(item)">
            {{ item.label }}
          </option>
          }
        </select>
      </div>
      <div class="divider !mt-1"></div>
    </div>
    <apx-chart
      [noData]="chartConfig.noData || {}"
      [stroke]="chartConfig.stroke || {}"
      [fill]="chartConfig.fill || {}"
      [tooltip]="chartConfig.tooltip || {}"
      [series]="series"
      [chart]="chartConfig.chart || $any({})"
      [series]="enrichedSeries"
      class="w-full h-full bottom-0"
    ></apx-chart>
  </div>
</div>
