<div class="w-full h-full widget-container">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 1000"
    xmlns:v="https://vecta.io/nano"
    class="absolute opacity-25 top-0 w-48 h-48 right-0 -mt-10 -mr-10"
  >
    <defs>
      <clipPath id="A">
        <path
          [attr.fill]="backgroundColor"
          d="M922.5 673Q846 846 673 907.5T340.5 894q-159.5-75-234-234.5T96 330q64-170 234-226.5t343-3Q846 154 922.5 327t0 346Z"
        />
      </clipPath>
    </defs>
    <g clip-path="url(#A)">
      <path
        [attr.fill]="backgroundColor"
        d="M922.5 673Q846 846 673 907.5T340.5 894q-159.5-75-234-234.5T96 330q64-170 234-226.5t343-3Q846 154 922.5 327t0 346Z"
      />
    </g>
  </svg>

  <div>
    <!-- header -->
    <div class="header-container">
      <div class="header-items">
        <h2>{{ title }}</h2>
      </div>
      <div class="divider !mt-1"></div>
    </div>
    <!-- body -->
    <div
      class="w-full flex flex-col justify-around items-center pointer-events-none space-y-2 my-2"
    >
      <notify-rating
        [rating]="value"
        [items]="maxRating"
        class="2xl:scale-150 xl:scale-125"
      ></notify-rating>

      <h3 class="text-lg tracking-wider text-gray-200">
        {{ value }} su {{ maxRating }}
      </h3>
    </div>
  </div>
</div>
