<div class="widget-container">
  <!-- header -->
  <div class="header-container">
    <div class="header-items">
      <h2>Feedback medio</h2>
    </div>
    <div class="divider !mt-1"></div>
  </div>
  <!-- body -->
  <div
    class="w-full flex flex-col justify-around items-center pointer-events-none"
  >
    <notify-rating
      [rating]="value"
      [items]="maxRating"
      class="2xl:scale-150 xl:scale-125"
    ></notify-rating>

    <h3 class="text-lg tracking-wider text-gray-200">
      {{ value }}/{{ maxRating }}
    </h3>
  </div>
</div>
