<button
  class="widget-container hover:outline-white outline-1 outline-none"
  (click)="showProfile()"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 1000"
    xmlns:v="https://vecta.io/nano"
    class="absolute !top-0 -mt-10 scale-125"
  >
    <defs>
      <clipPath id="A">
        <path
          [attr.fill]="backgroundColor"
          d="M922.5 673Q846 846 673 907.5T340.5 894q-159.5-75-234-234.5T96 330q64-170 234-226.5t343-3Q846 154 922.5 327t0 346Z"
        />
      </clipPath>
    </defs>
    <g clip-path="url(#A)">
      <path
        [attr.fill]="backgroundColor"
        d="M922.5 673Q846 846 673 907.5T340.5 894q-159.5-75-234-234.5T96 330q64-170 234-226.5t343-3Q846 154 922.5 327t0 346Z"
      />
    </g>
  </svg>

  <div>
    <div class="flex flex-col justify-center items-center py-4 space-y-2">
      <notify-avatar
        [avatarConfig]="{
          src: profile.avatar || '',
          size: '24',
          mask: profile.config.avatarMask || ''
        }"
      ></notify-avatar>

      <div class="flex flex-col items-center">
        <div class="flex justify-center text-lg font-bold">
          {{ profile.name }} {{ profile.surname }}
        </div>
        <small class="opacity-75 font-light">
          {{ profile.email }}
        </small>
      </div>

      <div class="flex items-center" *ngIf="rating">
        <svg
          class="w-4 h-4 text-yellow-300 me-1"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="currentColor"
          viewBox="0 0 22 20"
        >
          <path
            d="M20.924 7.625a1.523 1.523 0 0 0-1.238-1.044l-5.051-.734-2.259-4.577a1.534 1.534 0 0 0-2.752 0L7.365 5.847l-5.051.734A1.535 1.535 0 0 0 1.463 9.2l3.656 3.563-.863 5.031a1.532 1.532 0 0 0 2.226 1.616L11 17.033l4.518 2.375a1.534 1.534 0 0 0 2.226-1.617l-.863-5.03L20.537 9.2a1.523 1.523 0 0 0 .387-1.575Z"
          />
        </svg>
        <p class="ms-2 text-sm font-bold text-gray-900 dark:text-white">
          {{ rating | number : '1.1-1' }}
        </p>
        <span
          class="w-1 h-1 mx-1.5 bg-gray-500 rounded-full dark:bg-gray-400"
        ></span>
        <a href="#" class="text-sm font-medium text-gray-900 dark:text-white"
          >{{ ratingItems || 0 }} feedbacks</a
        >
      </div>
    </div>
  </div>
</button>
