<div class="w-screen h-screen overflow-hidden">
  <div class="center w-full h-full space-y-3 fixed">
    <div class="z-50 space-y-10 flex flex-col justify-center items-center">
      <div class="w-80">
        <notify-app-title [subtitle]="config.pageSubtitle"></notify-app-title>
      </div>
      <div class="space-y-2 flex flex-col justify-center items-center">
        <h1 class="text-gray-50 text-2xl font-bold text-center">
          {{ config.pageTitle }}
        </h1>
        <small class="w-8/12 text-center">
          Inserisci l'indirizzo email associato al tuo account e ti invieremo un
          link per reimpostare la password.
        </small>
      </div>
    </div>

    <div class="flex p-5">
      <form
        [formGroup]="form"
        class="center space-y-8 w-72 lg:w-96"
        (ngSubmit)="submit()"
      >
        <notify-tailwind-input
          [parent]="form"
          class="w-full"
          name="email"
          type="email"
          label="Email"
          placeholder="email@example.com"
          [validationErrors]="validationErrors"
        >
        </notify-tailwind-input>

        <div class="space-x-2 flex justify-around">
          <button
            class="btn btn-outline border-white/50 text-white/50"
            type="button"
            data-theme="notifytheme"
            [routerLink]="config.signinRoute"
          >
            Torna al Login
          </button>
          <button
            class="btn btn-primary btn-wide"
            type="submit"
            data-theme="notifytheme"
            [class.pointer-events-none]="loading"
            [disabled]="form.invalid"
          >
            <span class="loading loading-spinner" *ngIf="loading"></span>
            <span class="my-auto" *ngIf="!loading">
              {{ config.submitLabel }}</span
            >
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
