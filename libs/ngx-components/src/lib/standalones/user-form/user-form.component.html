<div class="popup-backdrop">
  <div
    class="w-[90%] lg:w-[50%] 2xl:w-[40%] animate__fadeInDown animate__animated animate__fast"
  >
    <div class="my-1 w-full flex justify-end">
      <button
        class="btn btn-secondary btn-circle btn-ghost"
        data-theme="notifytheme"
        (click)="close()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-10 h-10"
        >
          <path
            fill-rule="evenodd"
            d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
    <div class="bg-base-300/70 rounded-xl w-full h-full p-5 space-y-10">
      <h1 class="text-3xl font-bold text-white sm:text-4xl p-4">
        {{ user ? 'Modifica utente' : 'Crea utente' }}
      </h1>
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="flex flex-col jusitfy-center items-center w-full space-y-6 h-full"
      >
        <notify-tailwind-input
          name="email"
          label="emall"
          [parent]="form"
          placeholder="email@example.com"
          [validationErrors]="validationErrors"
        >
        </notify-tailwind-input>
        <notify-tailwind-input
          name="password"
          [label]="user ? 'Nuova password' : 'Password'"
          [parent]="form"
          placeholder="******"
          [validationErrors]="validationErrors"
          [helpText]="user ? 'Lascia vuoto per non modificare la password' : ''"
        >
        </notify-tailwind-input>
        <!-- TODO select con possibilità di aggiungere campi dinamicamente -->
        <notify-tailwind-input
          name="role"
          label="Ruolo"
          [parent]="form"
          placeholder="Sales Manager"
          [validationErrors]="validationErrors"
        >
        </notify-tailwind-input>
        <notify-tailwind-checkbox
          name="enabled"
          label="Attivo"
          [parent]="form"
          class="w-full"
          [validationErrors]="validationErrors"
        ></notify-tailwind-checkbox>

        <button
          [disabled]="form.invalid"
          [class.pointer-events-none]="loading"
          class="btn btn-primary w-full"
          type="submit"
          data-theme="notifytheme"
        >
          <span class="loading loading-spinner" *ngIf="loading"></span>
          <span class="my-auto" *ngIf="!loading"> Conferma </span>
        </button>
      </form>
    </div>
  </div>
</div>
