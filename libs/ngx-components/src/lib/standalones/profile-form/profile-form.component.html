<form
  class="flex flex-col items-center space-y-4 box p-4 rounded-xl w-full smooth"
  [formGroup]="form"
>
  <div class="divider !pt-0">Colori</div>

  <div class="section">
    <div class="field" *ngIf="isAgent">
      <notify-tailwind-checkbox
        *ngIf="profile.company?.name?.length"
        [parent]="form"
        name="useCompanyColors"
        label="Usa i colori di {{ profile.company?.name }}"
        [validationErrors]="validationErrors"
      ></notify-tailwind-checkbox>
    </div>
    <div
      class="flex lg:space-x-2 items-center flex-col lg:flex-row space-y-2 lg:space-y-0 smooth"
      [ngClass]="{
        'opacity-50 pointer-events-none scale-90':
          form.controls.useCompanyColors.value
      }"
    >
      <!-- TODO incapsulamento -->
      @if (form.controls.backgroundColors.controls; as bgColors) {
      <div
        class="flex space-x-2 items-center box p-2 w-full"
        *ngIf="bgColors[0] as c"
      >
        <notify-tailwind-color-picker
          [parent]="c"
          name="value"
          [validationErrors]="validationErrors"
        ></notify-tailwind-color-picker>
        <span class="font-bold">Superiore</span>
      </div>
      <div
        class="flex space-x-2 items-center box p-2 w-full"
        *ngIf="bgColors[1] as c"
      >
        <notify-tailwind-color-picker
          [parent]="c"
          name="value"
          [validationErrors]="validationErrors"
        ></notify-tailwind-color-picker>
        <span class="font-bold">Inferiore</span>
      </div>

      <div class="flex space-x-2 items-center box p-2 w-full">
        <notify-tailwind-color-picker
          [parent]="form"
          name="elementsColor"
          [validationErrors]="validationErrors"
        ></notify-tailwind-color-picker>
        <span class="font-bold">Elementi</span>
      </div>

      }
    </div>
  </div>

  <div class="divider">Info</div>

  <div class="section">
    <!-- NOME -->
    <div class="field flex w-full !space-y-0 space-x-2">
      <notify-tailwind-input
        [parent]="form"
        name="name"
        [label]="isAgent ? 'Nome*' : 'Ragione Sociale*'"
        [placeholder]="isAgent ? 'Mario' : 'Notify Italia'"
        [validationErrors]="validationErrors"
        class="w-full"
      ></notify-tailwind-input>
      <!-- COGNOME -->
      <div class="field" *ngIf="isAgent">
        <notify-tailwind-input
          [parent]="form"
          name="surname"
          label="Cognome*"
          placeholder="Rossi"
          [validationErrors]="validationErrors"
          class="w-full"
        ></notify-tailwind-input>
      </div>
    </div>

    <!-- BIO -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="bio"
        label="Bio"
        placeholder="Inserisci una breve descrizione di te"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>

  <div class="divider">Avatar</div>
  <!-- AVATAR -->
  <div class="section">
    <notify-upload
      class="w-full"
      [uploadLabel]="capacitor.isNative ? mobileMessage : desktopMessage"
      [acceptedFiles]="'image/*'"
      [file]="avatarFile"
      (fileChanged)="setUploadedFile($event.blob)"
      [removeFile$]="removeAvatar$"
    ></notify-upload>

    <div class="field">
      <notify-tailwind-select
        [parent]="form"
        name="avatarMask"
        label="Cornice"
        placeholder="Nessuna Cornice"
        [options]="avatarMaskOptions"
        [validationErrors]="validationErrors"
      ></notify-tailwind-select>
    </div>
  </div>

  <!-- INDIRIZZO -->
  @if (isCompany) {
  <div class="divider">Indirizzo</div>
  <div class="section">
    <div class="field flex w-full !space-y-0 space-x-2">
      <notify-tailwind-input
        [parent]="form"
        name="street"
        label="Via/Piazza"
        class="w-5/12"
        placeholder="Via Lorenzo Ciulli"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>

      <notify-tailwind-input
        [parent]="form"
        name="number"
        label="civico"
        class="w-3/12"
        placeholder="40"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>

      <notify-tailwind-input
        [parent]="form"
        name="city"
        label="Città"
        placeholder="Prato"
        class="w-4/12"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>
  }

  <div class="divider">Contatti</div>

  <div class="section">
    <!-- EMAIL -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="email"
        label="Email"
        placeholder="email@example.com"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
    <!-- TELEFONO -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="phoneNumber"
        label="Telefono"
        placeholder="3331234567"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>

  <div class="divider">Contatti</div>

  <div class="section">
    <div class="field" *ngIf="isCompany">
      <notify-tailwind-input
        [parent]="form"
        name="reviewRedirect"
        label="Reindirizzamento recensioni"
        placeholder="https://g.page/la-tua-azienda/review?rc"
        [validationErrors]="validationErrors"
        class="w-full"
        helpText="Lascia vuoto per nascondere il pulsante."
      >
      </notify-tailwind-input>
    </div>
    <div class="field">
      <notify-tailwind-checkbox
        [parent]="form"
        name="phoneCallEnabled"
        label="Telefonate"
        [validationErrors]="validationErrors"
      ></notify-tailwind-checkbox>
      <notify-tailwind-checkbox
        [parent]="form"
        name="smsEnabled"
        label="SMS"
        [validationErrors]="validationErrors"
      ></notify-tailwind-checkbox>
      <notify-tailwind-checkbox
        [parent]="form"
        name="whatsappEnabled"
        label="Whatsapp"
        [validationErrors]="validationErrors"
      ></notify-tailwind-checkbox>
      <notify-tailwind-checkbox
        [parent]="form"
        name="emailEnabled"
        label="E-Mail"
        [validationErrors]="validationErrors"
      ></notify-tailwind-checkbox>
    </div>
  </div>

  <div class="divider">Integrazioni</div>

  <div class="field space-y-2" *ngIf="form.controls.customFields as cf">
    <button
      notify-add-item
      class="w-full"
      type="button"
      (click)="addCustomField()"
    ></button>

    <div *ngFor="let item of cf.controls" class="flex items-center space-x-2">
      <notify-icon-selector
        class="items-end mt-6"
        [icon]="item.controls['iconName'].value"
        (iconValue)="item.controls['iconName'].setValue($event.name)"
        #IconSelector
      ></notify-icon-selector>
      <notify-tailwind-input
        [parent]="item"
        name="value"
        class="w-full"
        label=" "
        [placeholder]="
          IconSelector?.currentIcon?.placeholder || 'Inserisci un link'
        "
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
      <!-- RIMUOVI SERVIZIO -->
      <div class="mt-1">
        <button
          notify-remove-item-button
          (click)="removeCustomField(item)"
        ></button>
      </div>
    </div>
  </div>
</form>
