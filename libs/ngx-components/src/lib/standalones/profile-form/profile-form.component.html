<form
  class="flex flex-col items-center space-y-4 box p-4 rounded-xl w-full"
  [formGroup]="form"
  (submit)="submit()"
>
  <div class="section">
    <!-- NOME -->
    <div class="field flex w-full !space-y-0 space-x-2">
      <notify-tailwind-input
        [parent]="form"
        name="name"
        label="Nome*"
        placeholder="Mario"
        [validationErrors]="validationErrors"
        class="w-full"
      ></notify-tailwind-input>
      <!-- COGNOME -->
      <div class="field" *ngIf="isAgent">
        <notify-tailwind-input
          [parent]="form"
          name="surname"
          label="Cognome*"
          placeholder="Rossi"
          [validationErrors]="validationErrors"
          class="w-full"
        ></notify-tailwind-input>
      </div>
    </div>

    <!-- BIO -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="bio"
        label="Bio"
        placeholder="Inserisci una breve descrizione di te"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>

  <div class="divider">Avatar</div>
  <!-- AVATAR -->
  <div class="section">
    <notify-upload
      class="w-full"
      [uploadLabel]="capacitor.isNative ? mobileMessage : desktopMessage"
      [acceptedFiles]="'image/*'"
      [file]="avatarFile"
      (fileChanged)="setUploadedFile($event.blob)"
      [removeFile$]="removeAvatar$"
    ></notify-upload>

    <div class="field">
      <notify-tailwind-select
        [parent]="form"
        name="avatarMask"
        label="Cornice"
        placeholder="default"
        [options]="avatarMaskOptions"
        [validationErrors]="validationErrors"
      ></notify-tailwind-select>
    </div>
  </div>

  <div class="divider">Gradiente</div>

  <div class="section">
    <button notify-add-item (click)="addColor()" class="w-full"></button>
    @for (colorForm of form.controls.colors.controls; track colorForm) {
    <div class="flex space-x-2 items-center p-2">
      <button type="button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 5.25h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5"
          />
        </svg>
      </button>
      <div class="flex space-x-2 items-center box p-2 w-full">
        <notify-tailwind-color-picker
          [parent]="colorForm"
          name="value"
          [validationErrors]="validationErrors"
        ></notify-tailwind-color-picker>
        <span class="uppercase font-bold">{{ colorForm.value.value }}</span>
      </div>
      <button
        notify-remove-item-button
        (click)="removeColor(colorForm)"
      ></button>
    </div>
    }
  </div>

  <!-- INDIRIZZO -->
  @if (isCompany) {
  <div class="divider">Indirizzo</div>
  <div class="section">
    <div class="field flex w-full !space-y-0 space-x-2">
      <notify-tailwind-input
        [parent]="form"
        name="street"
        label="Via/Piazza"
        class="w-5/12"
        placeholder="Via Lorenzo Ciulli"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>

      <notify-tailwind-input
        [parent]="form"
        name="number"
        label="civico"
        class="w-3/12"
        placeholder="40"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>

      <notify-tailwind-input
        [parent]="form"
        name="city"
        label="Città"
        placeholder="Prato"
        class="w-4/12"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>
  }

  <div class="divider">Contatti</div>

  <div class="section">
    <!-- EMAIL -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="email"
        label="Email"
        placeholder="email@example.com"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
    <!-- TELEFONO -->
    <div class="field">
      <notify-tailwind-input
        [parent]="form"
        name="phoneNumber"
        label="Telefono"
        placeholder="3331234567"
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
    </div>
  </div>

  <div class="divider">Servizi Principali</div>

  <div class="section">
    <div class="field" *ngIf="isCompany">
      <notify-tailwind-input
        [parent]="form"
        name="reviewRedirect"
        label="Reindirizzamento recensioni"
        placeholder="https://g.page/la-tua-azienda/review?rc"
        [validationErrors]="validationErrors"
        class="w-full"
        helpText="Lascia vuoto per nascondere il pulsante."
      >
      </notify-tailwind-input>
    </div>
    <div class="field">
      <notify-tailwind-checkbox
        [parent]="form"
        name="phoneCallEnabled"
        label="Telefonate"
        [validationErrors]="validationErrors"
      ></notify-tailwind-checkbox>
      <notify-tailwind-checkbox
        [parent]="form"
        name="smsEnabled"
        label="SMS"
        [validationErrors]="validationErrors"
      ></notify-tailwind-checkbox>
      <notify-tailwind-checkbox
        [parent]="form"
        name="whatsappEnabled"
        label="Whatsapp"
        [validationErrors]="validationErrors"
      ></notify-tailwind-checkbox>
      <notify-tailwind-checkbox
        [parent]="form"
        name="emailEnabled"
        label="E-Mail"
        [validationErrors]="validationErrors"
      ></notify-tailwind-checkbox>
    </div>
  </div>

  <div class="divider">Integrazioni</div>

  <div class="field space-y-2" *ngIf="form.controls.customFields as cf">
    <button notify-add-item class="w-full" (click)="addCustomField()"></button>

    <div *ngFor="let item of cf.controls" class="flex items-center space-x-2">
      <notify-icon-selector
        class="items-end mt-6"
        [icon]="item.controls['iconName'].value"
        (iconValue)="item.controls['iconName'].setValue($event.name)"
        #IconSelector
      ></notify-icon-selector>
      <notify-tailwind-input
        [parent]="item"
        name="value"
        class="w-full"
        label=" "
        [placeholder]="
          IconSelector?.currentIcon?.placeholder || 'Inserisci un link'
        "
        [validationErrors]="validationErrors"
      ></notify-tailwind-input>
      <!-- RIMUOVI SERVIZIO -->
      <div class="mt-1">
        <button
          notify-remove-item-button
          (click)="removeCustomField(item)"
        ></button>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="field flex justify-around space-x-2">
    <button type="button" class="btn btn-neutral w-6/12" (click)="resetForm()">
      Annulla
    </button>
    <div class="w-6/12">
      <button
        [disabled]="form.invalid"
        [class.pointer-events-none]="loading"
        class="btn btn-primary w-full bg-primary-500/40"
        type="submit"
        data-theme="notifytheme"
      >
        <span class="loading loading-spinner" *ngIf="loading"></span>
        <span class="my-auto" *ngIf="!loading"> Salva </span>
      </button>

      <div class="text-center my-2 kbd-xs opacity-50 hidden lg:block">
        <kbd class="kbd">{{ isMacos ? '⌃' : 'Ctrl' }}</kbd>
        +
        <kbd class="kbd">shift</kbd>
        +
        <kbd class="kbd">S</kbd>
      </div>
    </div>
  </div>
</form>
