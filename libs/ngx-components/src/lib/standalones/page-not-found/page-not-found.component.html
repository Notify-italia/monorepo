<div class="h-screen w-screen">
  <notify-wallpaper class="z-0"></notify-wallpaper>
  <div
    class="flex flex-col justify-center items-center w-full h-full space-y-10 z-50"
  >
    <notify-app-title class="w-3/12"></notify-app-title>
    <div class="text-center m-2">
      <h1 class="text-6xl font-bold text-gray-50">404</h1>
      <h2 class="text-2xl font-bold text-gray-600">Pagina non trovata</h2>
    </div>
    <div>
      <a
        *ngIf="!noHomeRedirect"
        routerLink="/"
        class="btn btn-primary btn-wide"
        data-theme="notifytheme"
        >Torna alla home</a
      >
    </div>
  </div>
</div>
