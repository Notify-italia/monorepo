<div class="flex h-fit w-fit relative" *ngIf="cleanedConfigs as c">
  <ng-container
    [ngTemplateOutlet]="AvatarRenderer"
    [ngTemplateOutletContext]="{ config: c.main }"
  ></ng-container>

  <button
    *ngIf="c.sub?.src?.length && avatarConfig?.src?.length"
    class="!absolute bottom-0 right-0 -mr-4 scale-125 lg:pointer-events-none"
    (click)="subAvatarClick.emit()"
  >
    <ng-container
      [ngTemplateOutlet]="AvatarRenderer"
      [ngTemplateOutletContext]="{ config: c.sub, }"
    ></ng-container>
  </button>
</div>

<ng-template #AvatarRenderer let-config="config">
  <div class="overflow-hidden">
    {{ config.isBase64 }}
    <img
      *ngIf="config.src || placeholderAvatar as avatar"
      [src]="config.isBase64 ? avatar : avatar"
      alt="User Avatar"
      [ngClass]="{
        'mask object-cover ': config.mask?.length,
      }"
      [style.background-color]="config?.mask ? config.backgroundColor : ''"
      class=" mask-{{ config.mask }} w-{{ config.size }} h-{{
        config.size
      }} object-contain "
    />
  </div>
</ng-template>
