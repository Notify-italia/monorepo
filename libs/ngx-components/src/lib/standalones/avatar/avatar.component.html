<div class="flex h-fit w-fit relative">
  <ng-container
    [ngTemplateOutlet]="AvatarRenderer"
    [ngTemplateOutletContext]="{ config: avatarConfig }"
  ></ng-container>

  <button
    *ngIf="subAvatarConfig?.src?.length && avatarConfig?.src?.length"
    class="!absolute bottom-0 right-0 -mr-4 scale-125 lg:pointer-events-none"
    (click)="subAvatarClick.emit()"
  >
    <ng-container
      [ngTemplateOutlet]="AvatarRenderer"
      [ngTemplateOutletContext]="{ config: subAvatarConfig }"
    ></ng-container>
  </button>
</div>

<ng-template #AvatarRenderer let-config="config">
  <a>
    <img
      *ngIf="config.src || placeholderAvatarProvider as avatar"
      [src]="avatar"
      [ngClass]="{
        'mask': config.mask?.length,
      }"
      class=" mask-{{ config.mask }} object-cover  w-{{ config.size }} h-{{
        config.size
      }} "
    />
  </a>
</ng-template>
