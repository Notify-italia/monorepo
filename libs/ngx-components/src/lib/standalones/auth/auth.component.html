<div
  class="w-screen h-screen overflow-hidden fixed bg-gradient-to-br from-complimentary-500/10 to-complimentary-900"
>
  <notify-animated-bg></notify-animated-bg>
  <div class="center w-full h-full space-y-10 fixed">
    <div class="z-50">
      <notify-app-title></notify-app-title>
      <h1 class="text-secondary text-xl font-bold text-center">
        {{ config.pageTitle }}
      </h1>
    </div>
    <div class="flex rounded-3xl p-8 lg:p-10 bg-base-100/50 backdrop-blur-lg">
      <form
        [formGroup]="form"
        class="center space-y-8 w-72 lg:w-96"
        (ngSubmit)="submit()"
      >
        <notify-tailwind-input
          [parent]="form"
          class="w-full"
          name="email"
          type="email"
          label="Email"
          placeholder="email@example.com"
          [validationErrors]="validationErrors"
        >
        </notify-tailwind-input>
        <notify-tailwind-input
          [parent]="form"
          class="w-full"
          name="password"
          type="password"
          label="Password"
          [showToggleEye]="true"
          placeholder="********"
          [validationErrors]="validationErrors"
        >
        </notify-tailwind-input>

        <div class="divider"></div>

        <button
          class="btn btn-primary btn-wide"
          type="submit"
          data-theme="notifytheme"
          [class.pointer-events-none]="loading"
          [disabled]="form.invalid"
        >
          <span class="loading loading-spinner" *ngIf="loading"></span>
          <span class="my-auto" *ngIf="!loading">
            {{ config.submitLabel }}</span
          >
        </button>
      </form>
    </div>
  </div>
</div>
