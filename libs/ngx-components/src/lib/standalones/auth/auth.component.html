<div class="w-screen h-screen overflow-hidden">
  <notify-wallpaper></notify-wallpaper>
  <div class="center w-full h-full space-y-3 fixed">
    <div class="z-50 space-y-20">
      <div class="w-80">
        <notify-app-title [subtitle]="config.pageSubtitle"></notify-app-title>
      </div>
      <div class="space-y-2 flex flex-col">
        <h1 class="text-gray-50 text-2xl font-bold text-center">
          {{ config.pageTitle }}
        </h1>
        <h2
          class="text-gray-50 text-center"
          *ngIf="config.signupRoute as route"
        >
          oppure
          <a [routerLink]="route" class="font-bold text-primary hover:underline"
            >registrati</a
          >
        </h2>
      </div>
    </div>
    <div class="flex rounded-xl p-8 lg:p-10 bg-base-100/50 backdrop-blur-lg">
      <form
        [formGroup]="form"
        class="center space-y-8 w-72 lg:w-96"
        (ngSubmit)="submit()"
      >
        <notify-tailwind-input
          [parent]="form"
          class="w-full"
          name="email"
          type="email"
          label="Email"
          placeholder="email@example.com"
          [validationErrors]="validationErrors"
        >
        </notify-tailwind-input>
        <notify-tailwind-input
          [parent]="form"
          class="w-full"
          name="password"
          type="password"
          label="Password"
          [showToggleEye]="true"
          placeholder="********"
          [validationErrors]="validationErrors"
        >
        </notify-tailwind-input>
        <notify-tailwind-input
          *ngIf="config.isSignup"
          [parent]="form"
          class="w-full"
          name="confirmPassword"
          type="password"
          label="Conferma Password"
          [showToggleEye]="true"
          placeholder="********"
          [validationErrors]="validationErrors"
        >
        </notify-tailwind-input>

        <div class="divider"></div>

        <div class="space-y-2">
          <button
            class="btn btn-primary btn-wide"
            type="submit"
            data-theme="notifytheme"
            [class.pointer-events-none]="loading"
            [disabled]="form.invalid"
          >
            <span class="loading loading-spinner" *ngIf="loading"></span>
            <span class="my-auto" *ngIf="!loading">
              {{ config.submitLabel }}</span
            >
          </button>
          <div
            *ngIf="config.forgotPasswordRoute as route"
            class="text-center text-sm"
          >
            <a [routerLink]="route" class="text-white/50">
              Hai dimenticato la password?
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
