<div class="group/icons w-fit" #SelectContainer>
  <div class="flex flex-col items-center space-y-1">
    <button (click)="hideSelector = false" class="icon-button">
      <notify-svg-box-icon
        [icon]="currentIcon"
        *ngIf="MANUAL_REFRESH"
      ></notify-svg-box-icon>
    </button>
    <label class="text-xs truncate w-12 text-center">
      {{ currentIcon.expanded }}
    </label>
  </div>

  <div
    class="selector-container"
    *ngIf="!hideSelector"
    (mousemove)="onMouseMove($event)"
  >
    <div class="flex flex-col justify-center items-center h-full w-full">
      <div
        class="flex justify-between font-bold text-xl lg:text-3xl tracking-wider my-4 items-center w-11/12 lg:w-7/12"
      >
        <div class="flex space-x-4">
          <p class="my-auto">Servizio</p>
          <span class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="w-6 h-6 absolute left-3 top-1/2 transform -translate-y-1/2"
            >
              <path
                fill-rule="evenodd"
                d="M10.5 3.75a6.75 6.75 0 100 13.5 6.75 6.75 0 000-13.5zM2.25 10.5a8.25 8.25 0 1114.59 5.28l4.69 4.69a.75.75 0 11-1.06 1.06l-4.69-4.69A8.25 8.25 0 012.25 10.5z"
                clip-rule="evenodd"
              />
            </svg>

            <input
              type="text"
              [formControl]="searchValue"
              placeholder="LinkedIn"
              class="input input-bordered w-full bg-base-100/30 backdrop-brightness-105 pl-10 placeholder-secondary-50/20"
            />
          </span>
        </div>

        <button class="btn btn-circle btn-ghost" (click)="hideSelector = true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-10 h-10"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <div class="h-4/6 lg:h-3/6 overflow-y-auto">
        <div class="cards">
          @for (item of filteredIcons$ | async; track item.name) {

          <button class="card" (click)="setIcon(item)" #card>
            <div class="card-content">
              <notify-svg-box-icon [icon]="item"></notify-svg-box-icon>
              <label class="text-sm truncate w-20 text-center">
                {{ item.expanded }}
              </label>
            </div>
          </button>

          }
        </div>
      </div>
    </div>
  </div>
</div>
