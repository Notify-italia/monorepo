<apx-chart
  [chart]="chartOptions?.chart || $any({})"
  [series]="chartOptions?.series || []"
  [labels]="chartOptions?.labels || []"
  [colors]="chartOptions?.colors || []"
  [legend]="chartOptions?.legend || $any({})"
  [dataLabels]="chartOptions?.dataLabels || $any({})"
  [stroke]="chartOptions?.stroke || $any({})"
  [fill]="chartOptions?.fill || $any({})"
  [tooltip]="chartOptions?.tooltip || $any({})"
  [plotOptions]="chartOptions?.plotOptions || $any({})"
  [responsive]="chartOptions?.responsive || $any([])"
  [xaxis]="chartOptions?.xaxis || $any({})"
  [yaxis]="chartOptions?.yaxis || $any({})"
  [grid]="chartOptions?.grid || $any({})"
  [theme]="chartOptions?.theme || $any({})"
  [title]="chartOptions?.title || $any({})"
  [subtitle]="chartOptions?.subtitle || $any({})"
  [noData]="chartOptions?.noData || $any({})"
  class="h-full !block"
></apx-chart>
