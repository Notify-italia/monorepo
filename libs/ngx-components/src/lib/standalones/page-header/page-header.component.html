<header class="w-full bg-gray-900/90 rounded-xl">
  <div class="mx-auto max-w-[100vw] px-4 py-8 sm:px-6 sm:py-12 lg:px-8">
    <div class="sm:flex sm:items-center sm:justify-between w-full">
      <div class="text-center sm:text-left">
        <h1 class="text-3xl font-bold text-white sm:text-4xl">
          {{ title }}
        </h1>

        <p class="mt-1.5 text-sm text-gray-400">
          {{ subtitle }}
        </p>
      </div>

      <div
        class="mt-4 flex flex-col gap-4 sm:mt-0 sm:flex-row-reverse sm:items-center"
      >
        @for(btn of buttons; track btn.disabled; let i = $index) {
        <button
          (click)="onButtonClicked(btn)"
          [disabled]="btn.disabled"
          class="btn btn-{{ btn.buttonColor || 'primary' }} "
          type="button"
          data-theme="notifytheme"
          [class.btn-primary]="i === 0"
          [ngClass]="{ 'btn-accent brightness-90': i > 0 }"
        >
          @if (btn.icon; as i) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-6 h-6"
          >
            @for (path of i; track path) {
            <path fill-rule="evenodd" [attr.d]="path" clip-rule="evenodd" />
            }
          </svg>

          }

          <span> {{ btn.label }}</span>
        </button>
        }
      </div>
    </div>
  </div>
</header>
