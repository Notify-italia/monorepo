<div class="modal-container">
  <div>
    <div class="modal-content">
      <h1 class="text-2xl font-medium w-full text-start text-white">
        Ritaglia immagine
      </h1>

      <div class="divider"></div>

      <div
        [ngClass]="{
          'opacity-0 pointer-events-none absolute': loading
        }"
      >
        <image-cropper
          *ngIf="config as c"
          class="rounded overflow-scroll !w-[400px] !h-[400px]"
          [containWithinAspectRatio]="!!c.containWithinAspectRatio"
          [aspectRatio]="config.aspectRatio || 1 / 1"
          [imageBase64]="config.imageData"
          [cropperMinWidth]="c.minWidth || 100"
          [cropperMinHeight]="c.minHeight || 100"
          [roundCropper]="!!c.roundCropper"
          [alignImage]="c.alignImage || 'center'"
          [allowMoveImage]="false"
          [resizeToWidth]="c.resize?.width || 0"
          [resizeToHeight]="c.resize?.height || 0"
          [maintainAspectRatio]="!!c.aspectRatio"
          [onlyScaleDown]="!!c.onlyScaleDown"
          [format]="c.format || 'webp'"
          (imageCropped)="imageCropped($event)"
          (imageLoaded)="loading = false"
          [(transform)]="transform"
          (loadImageFailed)="loadImageFailed()"
        ></image-cropper>
      </div>

      @if(loading){
      <div class="flex justify-center items-center h-96 w-96">
        <notify-loading></notify-loading>
      </div>
      }

      <div class="flex justify-around w-full mt-4">
        <button
          class="btn btn-ghost btn-circle"
          data-theme="notifytheme"
          (click)="flipHorizontal()"
        >
          <notify-svg-box-icon
            [size]="8"
            [icon]="{ name: 'flip', set: 'materialui' }"
          ></notify-svg-box-icon>
        </button>
        <button
          class="btn btn-ghost btn-circle"
          data-theme="notifytheme"
          (click)="flipVertical()"
        >
          <notify-svg-box-icon
            class="rotate-90"
            [size]="8"
            [icon]="{ name: 'flip', set: 'materialui' }"
          ></notify-svg-box-icon>
        </button>

        <div class="divider divider-vertical"></div>

        <button
          class="btn btn-ghost btn-circle"
          data-theme="notifytheme"
          (click)="rotateRight()"
        >
          <notify-svg-box-icon
            class="rotate-90"
            [size]="8"
            [icon]="{ name: 'rotate_right', set: 'materialui' }"
          ></notify-svg-box-icon>
        </button>
        <button
          class="btn btn-ghost btn-circle"
          data-theme="notifytheme"
          (click)="rotateLeft()"
        >
          <notify-svg-box-icon
            class="rotate-90"
            [size]="8"
            [icon]="{ name: 'rotate_left', set: 'materialui' }"
          ></notify-svg-box-icon>
        </button>
      </div>

      <div class="divider"></div>

      <div class="flex w-full justify-end space-x-4">
        <button
          class="btn btn-accent brightness-90"
          data-theme="notifytheme"
          (click)="close()"
        >
          Annulla
        </button>
        <button
          data-theme="notifytheme"
          class="btn btn-primary"
          (click)="submit()"
        >
          Conferma
        </button>
      </div>
    </div>
  </div>
</div>
