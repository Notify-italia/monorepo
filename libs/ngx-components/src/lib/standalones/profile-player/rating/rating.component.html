<div class="rating rating-{{ sizeClass }} space-x-2">
  <input
    *ngIf="currentValue === 0"
    type="radio"
    name="rating-10"
    class="rating-hidden"
    [checked]="currentValue === 0"
  />

  @for (item of availableItems; track currentValue) {
  <input
    type="radio"
    name="rating-8"
    class="mask mask-star-2 {{ colorClass }}"
    [checked]="currentValue === item.value"
    (change)="setRating(item.value)"
  />
  }
</div>
