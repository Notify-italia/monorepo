<div
  data-theme="notifytheme"
  class="relative"
  [ngClass]="{
    'h-full w-full  border-primary-600  mockup-phone': mockup,
    'min-h-screen w-screen': !mockup
  }"
>
  <div class="flex justify-between relative text-secondary" *ngIf="mockup">
    <div class="absolute top-[0.6rem] left-8 font-medium my-auto">
      {{ currentTime$ | async }}
    </div>
    <div class="phone-camera"></div>
    <div class="flex absolute top-[0.6rem] right-6 space-x-1">
      <!-- CELLULAR -->
      <svg
        class="w-4 h-4 my-auto"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path d="M0 0h24v24H0z" fill="none" st></path>
        <path d="M17 4h3v16h-3zM5 14h3v6H5zm6-5h3v11h-3z"></path>
      </svg>
      <!-- WIFI -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-4 h-4 my-auto"
      >
        <path d="M0 0h24v24H0z" fill="none" st></path>
        <path
          d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 00-6 0zm-4-4l2 2a7.074 7.074 0 0110 0l2-2C15.14 9.14 8.87 9.14 5 13z"
        ></path>
      </svg>
      <!-- BATTERY -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-6 h-6 my-auto"
      >
        <path
          fill-rule="evenodd"
          d="M3.75 6.75a3 3 0 00-3 3v6a3 3 0 003 3h15a3 3 0 003-3v-.037c.856-.174 1.5-.93 1.5-1.838v-2.25c0-.907-.644-1.664-1.5-1.837V9.75a3 3 0 00-3-3h-15zm15 1.5a1.5 1.5 0 011.5 1.5v6a1.5 1.5 0 01-1.5 1.5h-15a1.5 1.5 0 01-1.5-1.5v-6a1.5 1.5 0 011.5-1.5h15zM4.5 9.75a.75.75 0 00-.75.75V15c0 .414.336.75.75.75H18a.75.75 0 00.75-.75v-4.5a.75.75 0 00-.75-.75H4.5z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
  </div>

  <div
    class="main-container"
    [ngClass]="{
      'display pt-10 h-full': mockup,
      'h-max min-h-screen': !mockup
    }"
  >
    <div
      class="main-child"
      [class.opacity-50]="!data"
      [ngClass]="{
        'h-full py-5': mockup,
        'h-full min-h-screen': !mockup
      }"
    >
      <!-- REVIEW -->
      <div class="flex justify-center p-2 mt-4">
        <button
          class="btn btn-wide btn-secondary"
          [disabled]="mockup || feedbackGiven()"
          (click)="showFeedback()"
        >
          <div
            class="flex justify-around text-center items-center text-sm space-x-2"
          >
            @if (!feedbackGiven()) {
            <svg
              class="w-6 h-6"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M12.672.668a.75.75 0 00-1.345 0L8.27 6.865l-6.838.994a.75.75 0 00-.416 1.279l4.948 4.823-1.168 6.811a.75.75 0 001.088.791L12 18.347l6.117 3.216a.75.75 0 001.088-.79l-1.168-6.812 4.948-4.823a.75.75 0 00-.416-1.28l-6.838-.993L12.672.668z"
              ></path>
            </svg>
            <p class="normal-case">Lascia un feedback</p>

            }
            <notify-rating
              *ngIf="feedbackGiven() as fb"
              [currentValue]="fb.rating"
              colorClass="bg-secondary"
              sizeClass="sm"
            ></notify-rating>
          </div>
        </button>
      </div>

      <div class="section w-48 h-48">
        <!-- TODO animazione di flip tra avatar agente e avatar azienda simil instagram con gli avatar -->
        <notify-avatar [src]="data?.avatar" size="48"></notify-avatar>
      </div>

      <div class="section">
        <div class="title">
          <span>{{ data?.name || 'Nome' }}</span>
          <span *ngIf="data?.type === enumProfileTypes.Agent">{{
            data?.surname || 'Cognome'
          }}</span>
        </div>

        <div class="text lg italic">
          {{ data?.company?.name || '' }}
        </div>
      </div>

      <!-- STATIC LINKS -->
      <notify-profile-static-links
        [data]="data"
        class="w-[80%]"
      ></notify-profile-static-links>

      <div class="section module module-blur" *ngIf="data?.bio">
        <p class="text-sm italic text-center">
          {{ data?.bio || '' }}
        </p>
      </div>

      <div
        class="flex flex-wrap justify-evenly w-full module module-blur"
        *ngIf="data?.customFields?.length"
      >
        @for (item of data?.customFields; track item.value) {
        <button [disabled]="!item.value" type="button" class="button-icon m-3">
          <a
            [href]="prepareUrl(item.value)"
            target="_blank"
            class="buttton-redirect"
          >
            <notify-svg-box-icon
              [iconName]="item.iconName"
            ></notify-svg-box-icon>
          </a>
        </button>
        }
      </div>

      <div class="fixed bottom-5 right-5 z-[999]" *ngIf="data && !mockup">
        <button class="save-button" (click)="saveContact()">
          <svg
            class="w-full h-full p-3"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M0 0h24v24H0z" fill="none"></path>
            <path
              d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"
            ></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="footer" *ngIf="!mockup">
      <div class="flex justify-between w-full">
        <div>Provided by <span class="font-bold">Notify</span></div>
      </div>
    </div>
  </div>
</div>
