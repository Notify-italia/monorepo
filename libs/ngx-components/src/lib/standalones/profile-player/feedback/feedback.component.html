<div
  *ngIf="profile"
  class="fixed w-screen h-screen p-2 backdrop-blur-xl backdrop-brightness-50 z-[999] top-0 flex justify-center"
>
  <div class="h-[50%] w-[90%] my-4 animate__fadeInDown animate__animated">
    <div class="my-1 w-full flex justify-end">
      <button
        class="btn btn-secondary btn-circle btn-ghost"
        data-theme="notifytheme"
        (click)="close()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-10 h-10"
        >
          <path
            fill-rule="evenodd"
            d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>
    <div
      class="bg-base-100 rounded-xl p-2 w-full h-full flex justify-center border border-primary"
    >
      <div class="hero-content text-center h-full w-full">
        <div class="h-full flex flex-col justify-around w-full">
          <div>
            <h1 class="text-2xl lg:text-5xl font-bold">Lascia un feedback</h1>
            <p class="text-xs lg:text-xl">
              Come valuteresti la tua esperienza con {{ profile.name }}?
            </p>
          </div>
          <div class="flex justify-center">
            <div class="rating rating-lg space-x-2">
              <input
                type="radio"
                name="rating-10"
                class="rating-hidden"
                [checked]="rating === 0"
              />

              @for (item of availableRatings; track rating) {
              <input
                type="radio"
                name="rating-8"
                class="mask mask-star-2 bg-yellow-500"
                [checked]="rating === item.value"
                (change)="setRating(item.value)"
              />
              }
            </div>
          </div>
          <div class="flex flex-col space-y-2">
            <button
              class="btn btn-primary"
              data-theme="notifytheme"
              [disabled]="!rating"
            >
              Invia
            </button>
            <p class="text-xs lg:text-xl">
              Il feedback inviato sarà usato per migliorare la tua esperienza e
              non sarà visibile pubblicamente.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
