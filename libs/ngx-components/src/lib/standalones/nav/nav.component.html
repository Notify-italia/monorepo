<div
  class="drawer drawer-open z-[999] shadow-xl fixed lg:static bg-primary/5 lg:bg-transparent backdrop-blur-xl backdrop-brightness-50 lg:backdrop-blur-0 lg:backdrop-brightness-100"
>
  <div class="navbar p-0 min-h-10 lg:h-full">
    <div
      class="flex items-center"
      [ngClass]="{
      'mt-safe': capacitor.isNative,
    }"
    >
      <input id="my-drawer" type="checkbox" class="drawer-toggle" />
      <label class="btn btn-square btn-ghost lg:hidden mx-2" for="my-drawer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          class="inline-block w-8 h-8 lg:w-10 lg:h-10 stroke-current"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </label>

      <notify-app-title class="lg:hidden w-32"></notify-app-title>

      <div class="drawer-content hidden lg:block h-screen my-auto">
        <!-- DESKTOP SIDEBAR -->
        <ng-container [ngTemplateOutlet]="SidebarContent"></ng-container>
      </div>

      <div class="drawer-side lg:hidden">
        <!-- MOBILE SIDEBAR -->
        <ng-container [ngTemplateOutlet]="SidebarContent"></ng-container>
      </div>
    </div>
  </div>
</div>
<div class="h-14 lg:hidden"></div>

<ng-template #SidebarContent>
  <label
    for="my-drawer"
    aria-label="close sidebar"
    class="drawer-overlay"
  ></label>

  <div
    class="flex flex-col justify-between bg-base-100 lg:bg-primary/5 h-full"
    [ngClass]="{
      'pt-10': capacitor.isNative,

    }"
  >
    <div class="flex flex-col items-center">
      <div class="p-4 py-2 lg:pt-10 hidden lg:block w-64">
        <notify-app-title [subtitle]="subtitle"></notify-app-title>
      </div>

      <div class="divider px-4 hidden lg:flex lg:mt-8"></div>

      <span class="w-full text-start px-4 mt-5 font-light text-sm"
        >Navigazione</span
      >
      <ul>
        <!-- Sidebar content here -->
        @for (item of topItems; track item.path) {
        <li [class.nav-disabled]="item.disabled">
          <a
            #sidebarItem
            [routerLink]="item.path"
            routerLinkActive="btn-active pointer-events-none border-l-4 border-primary-600 shadow-md  rounded"
            class="flex space-x-2 smooth smooth-slow"
            (click)="sidebarItem.blur()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              @for (p of item.icon; track p) {
              <path fill-rule="evenodd" [attr.d]="p" />
              }
            </svg>

            <span>{{ item.label | titlecase }}</span>
          </a>
        </li>
        }
      </ul>
    </div>

    <div>
      <span class="w-full text-start px-4 mt-5 font-light text-sm"
        >Sistema</span
      >
      <ul>
        <!-- Sidebar content here -->
        @for(item of bottomItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="btn-active"
            class="flex space-x-2 {{ item.style }}"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                *ngFor="let p of item.icon"
                [attr.d]="p"
                fill-rule="evenodd"
              />
            </svg>

            <span>{{ item.label }}</span>
          </a>
        </li>
        }
      </ul>
    </div>
  </div>
</ng-template>
